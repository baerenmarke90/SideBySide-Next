[project]
name = "sidebyside"
version = "0.1.0"
description = "SideBySide Next — Application Core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0",
    "alembic>=1.19",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "uuid6>=2025.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "httpx2>=0.1",
    "ruff==0.16.4",
    "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: benoetigt eine erreichbare PostgreSQL-Instanz",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Ausdruecklich, nicht geraten: in der CI ist das Paket installiert und
# waere sonst Fremdcode, lokal liegt es unter src und waere eigener.
known-first-party = ["sidebyside", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = []

[[tool.mypy.overrides]]
module = "uuid6.*"
ignore_missing_imports = true
