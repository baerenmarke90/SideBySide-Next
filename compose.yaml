# Canonical Docker Compose contract for every SideBySide Compose deployment.
#
# Profiles:
#   self-hosted  complete checkout, Arcane/remote-source builds, and Demo
#   cloud        Cloud/Managed runtime using immutable release images
#   dev-db       PostgreSQL-only database for local source development/tests
#
# Exactly this file is supported. Environment-specific behavior belongs in
# environment/configuration and these narrowly scoped profiles.

x-self-hosted-database-environment: &self-hosted-database-environment
  SBS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidebyside}

# Keys every profile agrees on, so a change to one profile cannot silently
# diverge from the other the way three separate Compose files once did.
x-shared-runtime-environment: &shared-runtime-environment
  SBS_CURSOR_SIGNING_KEY: "${SBS_CURSOR_SIGNING_KEY:-}"
  SBS_SERVER_ADMIN_EMAILS: '${SBS_SERVER_ADMIN_EMAILS:-[]}'
  SBS_MEDIA_STORE: "${SBS_MEDIA_STORE:-local}"
  SBS_MEDIA_ROOT: /var/lib/sidebyside/media
  SBS_S3_ENDPOINT: "${SBS_S3_ENDPOINT:-}"
  SBS_S3_REGION: "${SBS_S3_REGION:-us-east-1}"
  SBS_S3_BUCKET: "${SBS_S3_BUCKET:-}"
  SBS_S3_ACCESS_KEY_ID: "${SBS_S3_ACCESS_KEY_ID:-}"
  SBS_S3_SECRET_ACCESS_KEY: "${SBS_S3_SECRET_ACCESS_KEY:-}"
  SBS_S3_SESSION_TOKEN: "${SBS_S3_SESSION_TOKEN:-}"
  SBS_ACCOUNT_DELETION_JOURNAL_PATH: /var/lib/sidebyside/deletion-journal/account-deletions.journal
  SBS_ACCOUNT_DELETION_INSTANCE_ID: "${SBS_ACCOUNT_DELETION_INSTANCE_ID:-}"
  SBS_OIDC_CONNECTIONS: '${SBS_OIDC_CONNECTIONS:-[]}'
  SBS_WEBAUTHN_RP_ID: "${SBS_WEBAUTHN_RP_ID:-}"
  SBS_WEBAUTHN_RP_NAME: "${SBS_WEBAUTHN_RP_NAME:-SideBySide}"
  SBS_WEBAUTHN_ORIGINS: '${SBS_WEBAUTHN_ORIGINS:-[]}'
  SBS_MAIL_FROM: "${SBS_MAIL_FROM:-no-reply@localhost}"
  SBS_SMTP_HOST: "${SBS_SMTP_HOST:-localhost}"
  SBS_SMTP_PORT: "${SBS_SMTP_PORT:-587}"
  SBS_SMTP_USERNAME: "${SBS_SMTP_USERNAME:-}"
  SBS_SMTP_PASSWORD: "${SBS_SMTP_PASSWORD:-}"
  SBS_SMTP_STARTTLS: "${SBS_SMTP_STARTTLS:-true}"

x-self-hosted-runtime-environment: &self-hosted-runtime-environment
  <<: [*self-hosted-database-environment, *shared-runtime-environment]
  SBS_ENVIRONMENT: "${SBS_ENVIRONMENT:-development}"
  SBS_DEPLOYMENT: self_hosted
  SBS_DEMO_MODE: "${SBS_DEMO_MODE:-false}"
  SBS_DEMO_MODE_RESET_TIMER: "${SBS_DEMO_MODE_RESET_TIMER:-false}"
  SBS_DEMO_MODE_RESET_INTERVAL: "${SBS_DEMO_MODE_RESET_INTERVAL:-6h}"
  SBS_ALLOWED_HOSTS: '${SBS_ALLOWED_HOSTS:-["localhost","127.0.0.1"]}'
  SBS_PUBLIC_BASE_URL: "${SBS_PUBLIC_BASE_URL:-http://localhost:8080}"
  SBS_MAIL_TRANSPORT: "${SBS_MAIL_TRANSPORT:-log}"

x-cloud-runtime-environment: &cloud-runtime-environment
  <<: *shared-runtime-environment
  SBS_DATABASE_URL: "${SBS_DATABASE_URL:-}"
  SBS_ENVIRONMENT: "${SBS_ENVIRONMENT:-production}"
  SBS_DEPLOYMENT: cloud
  SBS_DEMO_MODE: "false"
  SBS_ALLOWED_HOSTS: '${SBS_ALLOWED_HOSTS:-[]}'
  SBS_PUBLIC_BASE_URL: "${SBS_PUBLIC_BASE_URL:-}"
  SBS_MAIL_TRANSPORT: "${SBS_MAIL_TRANSPORT:-none}"

x-self-hosted-backend-build: &self-hosted-backend-build
  build:
    context: "${SBS_BACKEND_BUILD_CONTEXT:-./backend}"
    args:
      SBS_BUILD_REVISION: "${SBS_BUILD_REVISION:-unverified-local-checkout}"
  pull_policy: build

x-self-hosted-web-build: &self-hosted-web-build
  build:
    context: "${SBS_WEB_BUILD_CONTEXT:-./web}"
    args:
      SBS_BUILD_REVISION: "${SBS_BUILD_REVISION:-unverified-local-checkout}"
      VITE_SBS_API_BASE_URL: ""
      VITE_SBS_DEMO_MODE: "${SBS_DEMO_MODE:-false}"
      VITE_SBS_DEMO_URL: "${SBS_DEMO_PUBLIC_URL:-}"
      VITE_SBS_DEMO_RESET_TIMER: "${SBS_DEMO_MODE_RESET_TIMER:-false}"
      VITE_SBS_DEMO_RESET_INTERVAL: "${SBS_DEMO_MODE_RESET_INTERVAL:-6h}"
  pull_policy: build

# Cloud/Managed intentionally has image-only process services. The sentinel
# defaults keep inactive profiles renderable; the Cloud env contract and CI
# require exact immutable release references before the cloud profile is used.
x-cloud-backend-image: &cloud-backend-image
  image: "${SBS_BACKEND_IMAGE:-invalid.invalid/sidebyside-backend:configuration-required}"

x-cloud-web-image: &cloud-web-image
  image: "${SBS_WEB_IMAGE:-invalid.invalid/sidebyside-web:configuration-required}"

x-api-healthcheck: &api-healthcheck
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/ready")
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  postgres:
    profiles: ["self-hosted"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sidebyside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-sidebyside}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["self-hosted"]
    <<: *self-hosted-backend-build
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *self-hosted-database-environment
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy

  demo-init:
    profiles: ["self-hosted"]
    <<: *self-hosted-backend-build
    restart: "no"
    command: ["python", "-m", "scripts.demo_space", "ensure"]
    environment:
      <<: *self-hosted-runtime-environment
    volumes:
      - media_data:/var/lib/sidebyside/media
    networks:
      - app
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    profiles: ["self-hosted"]
    <<: [*self-hosted-backend-build, *api-healthcheck]
    restart: unless-stopped
    environment:
      <<: *self-hosted-runtime-environment
      SBS_BOOTSTRAP_TOKEN: "${SBS_BOOTSTRAP_TOKEN:-}"
      FORWARDED_ALLOW_IPS: "${TRUSTED_PROXY_IPS:-127.0.0.1}"
    volumes:
      - media_data:/var/lib/sidebyside/media
      - deletion_journal_data:/var/lib/sidebyside/deletion-journal
    networks:
      - app
    ports:
      - name: api-loopback
        target: 8000
        published: "${API_PORT:-8000}"
        host_ip: "${SBS_BIND_IP:-127.0.0.1}"
        protocol: tcp
    depends_on:
      demo-init:
        condition: service_completed_successfully

  worker:
    profiles: ["self-hosted"]
    <<: *self-hosted-backend-build
    restart: unless-stopped
    command: ["python", "-m", "sidebyside.jobs.runner"]
    environment:
      <<: *self-hosted-runtime-environment
    volumes:
      - media_data:/var/lib/sidebyside/media
    networks:
      - app
    depends_on:
      demo-init:
        condition: service_completed_successfully

  web:
    profiles: ["self-hosted"]
    <<: *self-hosted-web-build
    restart: unless-stopped
    environment:
      SBS_WEB_CSP_CONNECT_ORIGINS: "${SBS_S3_ENDPOINT:-}"
    networks:
      - app
    ports:
      - name: web-loopback
        target: 8080
        published: "${WEB_PORT:-8080}"
        host_ip: "${SBS_BIND_IP:-127.0.0.1}"
        protocol: tcp
    depends_on:
      api:
        condition: service_healthy

  cloud-migrate:
    profiles: ["cloud"]
    <<: *cloud-backend-image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      SBS_DATABASE_URL: "${SBS_DATABASE_URL:-}"
    networks:
      - app

  cloud-api:
    profiles: ["cloud"]
    <<: [*cloud-backend-image, *api-healthcheck]
    restart: unless-stopped
    environment:
      <<: *cloud-runtime-environment
      FORWARDED_ALLOW_IPS: "${TRUSTED_PROXY_IPS:-}"
    volumes:
      - cloud_media_data:/var/lib/sidebyside/media
      - cloud_deletion_journal_data:/var/lib/sidebyside/deletion-journal
    networks:
      - app
    depends_on:
      cloud-migrate:
        condition: service_completed_successfully

  cloud-worker:
    profiles: ["cloud"]
    <<: *cloud-backend-image
    restart: unless-stopped
    command: ["python", "-m", "sidebyside.jobs.runner"]
    environment:
      <<: *cloud-runtime-environment
    volumes:
      - cloud_media_data:/var/lib/sidebyside/media
      - cloud_deletion_journal_data:/var/lib/sidebyside/deletion-journal
    networks:
      - app
    depends_on:
      cloud-migrate:
        condition: service_completed_successfully

  cloud-web:
    profiles: ["cloud"]
    <<: *cloud-web-image
    restart: unless-stopped
    environment:
      SBS_WEB_CSP_CONNECT_ORIGINS: "${SBS_S3_ENDPOINT:-}"
    networks:
      - app
    depends_on:
      cloud-api:
        condition: service_healthy

  dev-postgres:
    profiles: ["dev-db"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sidebyside
      POSTGRES_PASSWORD: sidebyside
      POSTGRES_DB: sidebyside
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidebyside -d sidebyside"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  media_data:
  deletion_journal_data:
  # Cloud/Managed gets its own volumes, distinct from Self-Hosted's, so an
  # operator mistake that activates both profiles in the same project
  # (`COMPOSE_PROFILES=self-hosted,cloud`) cannot let a self-hosted instance
  # and a cloud instance write to the same local media/deletion-journal data.
  cloud_media_data:
  cloud_deletion_journal_data:
  postgres_dev:
