# Self-Hosted.
#
#   cp .env.example .env    # und ausfuellen
#   docker compose up -d
#
# Der mitgelieferte Stack startet als **lokaler Testbetrieb**. Das ist eine
# bewusste Entscheidung (ADR 0002): ein Erststart soll ohne SMTP-Zugang und
# ohne HTTPS-Domain moeglich sein, sonst kann niemand SideBySide ausprobieren,
# ohne vorher eine Domain zu mieten. Der Testbetrieb ist nur ueber 127.0.0.1
# erreichbar.
#
# Fuer echten Betrieb wird SBS_ENVIRONMENT=production in .env gesetzt. Dann
# verlangt die Anwendung Cursor-Signing-Key, SMTP-Versand und eine
# https-Basisadresse und verweigert sonst den Start. Die Checkliste dafuer
# steht in docs/SELF-HOSTING.md.
#
# Die Datei liegt im Wurzelverzeichnis, nicht in deploy/, damit der
# Build-Kontext ./backend unterhalb des Verzeichnisses liegt, in dem die
# Compose-Datei steht. Oberflaechen wie Arcane oder Portainer legen ein
# Projekt in einem eigenen Verzeichnis ab und kopieren nur die
# Compose-Datei dorthin; ein Pfad wie ../backend zeigt dann ins Leere.
#
# Vier Bausteine: API, Worker, Migration, PostgreSQL. Medien liegen im
# Volume oder, wenn konfiguriert, in einem S3-kompatiblen Speicher.

# Die Migration braucht die Datenbank und sonst nichts. Sie bekommt deshalb
# genau diesen Block - nicht die Runtime-Konfiguration. Haengt eine Migration
# erst einmal an Cursor-Key oder SMTP, scheitert sie in Produktion, bevor die
# erste Revision laeuft.
x-database-environment: &database-environment
  SBS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidebyside}

# API und Worker laden dieselbe Settings-Klasse und brauchen deshalb dieselbe
# Konfiguration. Ein Wert, den nur einer der beiden bekommt, ist kein
# gespartes Detail, sondern ein Dienst, der beim naechsten Neustart nicht
# mehr hochkommt.
x-runtime-environment: &runtime-environment
  <<: *database-environment
  # Lokaler Testbetrieb ist der Standard; production wird in .env gesetzt.
  SBS_ENVIRONMENT: "${SBS_ENVIRONMENT:-development}"
  SBS_DEPLOYMENT: self_hosted
  # Signiert opake API-Cursor. In production Pflicht, mindestens 32 Zeichen.
  SBS_CURSOR_SIGNING_KEY: "${SBS_CURSOR_SIGNING_KEY:-}"
  SBS_MEDIA_STORE: "${SBS_MEDIA_STORE:-local}"
  SBS_MEDIA_ROOT: /var/lib/sidebyside/media
  SBS_S3_ENDPOINT: "${SBS_S3_ENDPOINT:-}"
  SBS_S3_REGION: "${SBS_S3_REGION:-us-east-1}"
  SBS_S3_BUCKET: "${SBS_S3_BUCKET:-}"
  SBS_S3_ACCESS_KEY_ID: "${SBS_S3_ACCESS_KEY_ID:-}"
  SBS_S3_SECRET_ACCESS_KEY: "${SBS_S3_SECRET_ACCESS_KEY:-}"
  SBS_S3_SESSION_TOKEN: "${SBS_S3_SESSION_TOKEN:-}"
  SBS_ALLOWED_HOSTS: '${SBS_ALLOWED_HOSTS:-["localhost","127.0.0.1"]}'
  # Anmelde- und Wiederherstellungslinks werden mit dieser Adresse
  # gebaut - nie aus dem Host-Header, den ein Angreifer setzen kann.
  SBS_PUBLIC_BASE_URL: "${SBS_PUBLIC_BASE_URL:-http://localhost:8000}"
  SBS_OIDC_CONNECTIONS: '${SBS_OIDC_CONNECTIONS:-[]}'
  SBS_WEBAUTHN_RP_ID: "${SBS_WEBAUTHN_RP_ID:-}"
  SBS_WEBAUTHN_RP_NAME: "${SBS_WEBAUTHN_RP_NAME:-SideBySide}"
  SBS_WEBAUTHN_ORIGINS: '${SBS_WEBAUTHN_ORIGINS:-[]}'
  SBS_MAIL_TRANSPORT: "${SBS_MAIL_TRANSPORT:-log}"
  SBS_MAIL_FROM: "${SBS_MAIL_FROM:-no-reply@localhost}"
  SBS_SMTP_HOST: "${SBS_SMTP_HOST:-localhost}"
  SBS_SMTP_PORT: "${SBS_SMTP_PORT:-587}"
  SBS_SMTP_USERNAME: "${SBS_SMTP_USERNAME:-}"
  SBS_SMTP_PASSWORD: "${SBS_SMTP_PASSWORD:-}"
  SBS_SMTP_STARTTLS: "${SBS_SMTP_STARTTLS:-true}"

x-backend-build: &backend-build
  build:
    context: ./backend
  # Ohne image: gibt es keinen Namen, den eine Oberflaeche aus der
  # Registry zu ziehen versucht - Arcane hat genau das getan und ist an
  # "pull access denied" gescheitert. pull_policy sagt es zusaetzlich
  # ausdruecklich: dieses Image entsteht hier, es wird nicht geholt.
  pull_policy: build

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-sidebyside}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Das Schema wird vor dem ersten Start der Anwendung gezogen, nicht von
  # ihr selbst: zwei startende API-Container wuerden sonst gleichzeitig
  # migrieren. Ein einmaliger Dienst laeuft genau einmal durch, und api
  # und worker warten auf seinen Erfolg.
  #
  # Kein Media-Volume und keine Runtime-Werte: eine Migration fasst weder
  # Medien noch Mail an.
  migrate:
    <<: *backend-build
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend-build
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      # Nur die API braucht den einmaligen Bootstrap-Nachweis. Ein leerer
      # Wert laesst die Erstregistrierung sicher geschlossen.
      SBS_BOOTSTRAP_TOKEN: "${SBS_BOOTSTRAP_TOKEN:-}"
      # Uvicorn wertet Forwarded Headers nur von diesen Adressen aus. Fuer
      # einen Reverse-Proxy muss hier dessen kleinster moeglicher IP-Bereich
      # eingetragen werden - niemals pauschal "*".
      FORWARDED_ALLOW_IPS: "${TRUSTED_PROXY_IPS:-127.0.0.1}"
    volumes:
      - media_data:/var/lib/sidebyside/media
    ports:
      # Der sichere Standard ist nur vom Host selbst erreichbar. LAN und
      # Internet gehen ausschliesslich ueber einen HTTPS-Reverse-Proxy.
      - name: api-loopback
        target: 8000
        published: "${API_PORT:-8000}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      # Das schlanke Image bringt kein curl mit; Python ist ohnehin da.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend-build
    restart: unless-stopped
    command: ["python", "-m", "sidebyside.jobs.runner"]
    environment:
      <<: *runtime-environment
    volumes:
      - media_data:/var/lib/sidebyside/media
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  media_data:
