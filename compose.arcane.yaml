# Arcane/remote-workspace Self-Hosted stack.
# Uses remote Git build contexts and therefore does not require ./backend or
# ./web in Arcane's project workspace. See docs/ARCANE.md.

x-database-environment: &database-environment
  SBS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidebyside}

x-runtime-environment: &runtime-environment
  <<: *database-environment
  SBS_ENVIRONMENT: "${SBS_ENVIRONMENT:-development}"
  SBS_DEPLOYMENT: self_hosted
  SBS_CURSOR_SIGNING_KEY: "${SBS_CURSOR_SIGNING_KEY:-}"
  SBS_MEDIA_STORE: "${SBS_MEDIA_STORE:-local}"
  SBS_MEDIA_ROOT: /var/lib/sidebyside/media
  SBS_S3_ENDPOINT: "${SBS_S3_ENDPOINT:-}"
  SBS_S3_REGION: "${SBS_S3_REGION:-us-east-1}"
  SBS_S3_BUCKET: "${SBS_S3_BUCKET:-}"
  SBS_S3_ACCESS_KEY_ID: "${SBS_S3_ACCESS_KEY_ID:-}"
  SBS_S3_SECRET_ACCESS_KEY: "${SBS_S3_SECRET_ACCESS_KEY:-}"
  SBS_S3_SESSION_TOKEN: "${SBS_S3_SESSION_TOKEN:-}"
  SBS_ALLOWED_HOSTS: '${SBS_ALLOWED_HOSTS:-["localhost","127.0.0.1"]}'
  SBS_PUBLIC_BASE_URL: "${SBS_PUBLIC_BASE_URL:-http://localhost:8080}"
  SBS_OIDC_CONNECTIONS: '${SBS_OIDC_CONNECTIONS:-[]}'
  SBS_WEBAUTHN_RP_ID: "${SBS_WEBAUTHN_RP_ID:-}"
  SBS_WEBAUTHN_RP_NAME: "${SBS_WEBAUTHN_RP_NAME:-SideBySide}"
  SBS_WEBAUTHN_ORIGINS: '${SBS_WEBAUTHN_ORIGINS:-[]}'
  SBS_MAIL_TRANSPORT: "${SBS_MAIL_TRANSPORT:-log}"
  SBS_MAIL_FROM: "${SBS_MAIL_FROM:-no-reply@localhost}"
  SBS_SMTP_HOST: "${SBS_SMTP_HOST:-localhost}"
  SBS_SMTP_PORT: "${SBS_SMTP_PORT:-587}"
  SBS_SMTP_USERNAME: "${SBS_SMTP_USERNAME:-}"
  SBS_SMTP_PASSWORD: "${SBS_SMTP_PASSWORD:-}"
  SBS_SMTP_STARTTLS: "${SBS_SMTP_STARTTLS:-true}"

x-backend-build: &backend-build
  build:
    context: "${SBS_SOURCE_REPOSITORY:-https://github.com/baerenmarke90/SideBySide-Next.git}#${SBS_SOURCE_REF:-main}:backend"
  pull_policy: build

x-web-build: &web-build
  build:
    context: "${SBS_SOURCE_REPOSITORY:-https://github.com/baerenmarke90/SideBySide-Next.git}#${SBS_SOURCE_REF:-main}:web"
    args:
      VITE_SBS_API_BASE_URL: ""
      VITE_SBS_SPACE_ID: "${SBS_WEB_SPACE_ID:-}"
  pull_policy: build

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-sidebyside}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend-build
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-environment
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend-build
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      SBS_BOOTSTRAP_TOKEN: "${SBS_BOOTSTRAP_TOKEN:-}"
      FORWARDED_ALLOW_IPS: "${TRUSTED_PROXY_IPS:-127.0.0.1}"
    volumes:
      - media_data:/var/lib/sidebyside/media
    networks:
      - app
    ports:
      - name: api-loopback
        target: 8000
        published: "${API_PORT:-8000}"
        host_ip: "${SBS_BIND_IP:-127.0.0.1}"
        protocol: tcp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/ready")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend-build
    restart: unless-stopped
    command: ["python", "-m", "sidebyside.jobs.runner"]
    environment:
      <<: *runtime-environment
    volumes:
      - media_data:/var/lib/sidebyside/media
    networks:
      - app
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *web-build
    restart: unless-stopped
    networks:
      - app
    ports:
      - name: web-loopback
        target: 8080
        published: "${WEB_PORT:-8080}"
        host_ip: "${SBS_BIND_IP:-127.0.0.1}"
        protocol: tcp
    depends_on:
      api:
        condition: service_healthy

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  media_data:
