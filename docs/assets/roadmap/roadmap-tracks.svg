    <text x="344" y="258" fill="#211A2B" font-size="14">Stabilisieren &amp; verbinden</text>

    <rect x="630" y="208" width="290" height="64" rx="18" fill="#E3F6F1"/>
    <text x="654" y="237" fill="#237A65" font-size="14" font-weight="800" letter-spacing="1.2">NEXT · M2</text>
    <text x="654" y="258" fill="#211A2B" font-size="14">Erinnern &amp; Story</text>

