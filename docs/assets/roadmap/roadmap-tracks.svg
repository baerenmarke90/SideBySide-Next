<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">SideBySide Next Roadmap – parallele Arbeitsströme</title>
  <desc id="desc">Matrix mit den Spuren Produkt, Backend und API, WebApp, Android, Design-System, Security und Qualität sowie Betrieb. Spalten zeigen Now M0 bis M1, Next M2, Then M3 bis M5 und Later M6 bis M9.</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#211A2B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="1180" fill="#FAF8FC"/>
  <rect x="24" y="24" width="1552" height="1132" rx="40" fill="#FFFFFF" stroke="#E6E0EB"/>

  <text x="80" y="82" fill="#1769AA" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">PARALLELE DELIVERY-SPUREN</text>
  <text x="80" y="132" fill="#211A2B" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600">Ein Produkt, sieben zusammenhängende Arbeitsströme</text>
  <text x="80" y="166" fill="#51485C" font-family="Inter, Arial, sans-serif" font-size="18">Parallel arbeiten – aber nur gemeinsam durch die Release Gates gehen.</text>

