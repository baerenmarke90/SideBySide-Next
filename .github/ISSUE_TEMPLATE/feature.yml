name: Product feature
description: Plan a SideBySide product feature with product, design, and delivery constraints.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        User-facing features are product-design work from the start. Read `docs/PARTNER-APP-EXPERIENCE-STANDARD.md` before describing a client feature. SideBySide should feel warm, modern, lively, beautiful, and lightly playful rather than cold or administrative.

  - type: textarea
    id: user_value
    attributes:
      label: User value
      description: What should the couple be able to understand, feel, or accomplish?
      placeholder: Describe the human outcome rather than the database/API operation.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and explicitly out of scope?
    validations:
      required: true

  - type: dropdown
    id: ui_impact
    attributes:
      label: User-facing UI / UX impact
      options:
        - Yes - Web and/or Android product UI changes
        - No - no user-facing UI changes
    validations:
      required: true

  - type: textarea
    id: product_design
    attributes:
      label: Product design / UX plan
      description: For UI work, identify the Screen Template, primary human/content focal point, dominant action, reused design tokens and components, responsive layout composition, warmth/playfulness, relationship microcopy or love-message opportunity, motion/reduced-motion behavior, relevant states, and privacy/relationship presentation. For non-UI work, explain why this is not applicable.
      placeholder: |
        Screen Template:
        Focal point:
        Primary action:
        Reused design-system components/tokens:
        Warmth / modernity / visual personality:
        Gentle playfulness / delight moment:
        Love-message / relationship microcopy opportunity:
        Compact / Expanded:
        Motion / feedback / reduced motion:
        Loading / Empty / Error / Offline / Success:
        Privacy / relationship state:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include functional and experience-level outcomes. Couple-facing UI must not default to spreadsheet/admin/CRUD composition.
      placeholder: |
        - [ ] Functional outcome works
        - [ ] Partner-app experience standard is satisfied
        - [ ] Result feels warm, modern, lively, beautiful, and not visually cold
        - [ ] Gentle playfulness / relationship personality was applied where appropriate
        - [ ] Love-message / relationship microcopy opportunity was considered
        - [ ] Responsive states are verified
        - [ ] Motion and reduced motion are verified
        - [ ] Visual evidence is attached to the implementation PR
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / related work
      description: Link relevant milestones, issues, API contracts, or parallel work.

  - type: textarea
    id: model_tool_routing
    attributes:
      label: 🤖 Modell-/Tool-Routing
      description: Assess the actual scope and choose the most efficient tool and reasoning budget. Always evaluate GPT-5.6 Sol Chat as a real implementation/review option where technically meaningful. Prefer Gemini 3.8 Flash over Gemini 3.1 Pro when deeper architecture/state reasoning is unnecessary. Codex quota is limited, so recommend it only when it has a concrete advantage. Do not choose Very High by default.
      placeholder: |
        **Empfohlen:** [Tool · Modell · Reasoning]
        **Alternative:** [Tool · Modell/Reasoning]
        **ChatGPT:** GPT-5.6 Sol Chat · [Low / Medium / High / Very High] — [möglich / eingeschränkt / nicht sinnvoll]
        **Codex:** [nicht empfohlen / möglich als Reserve / begründete Empfehlung]
    validations:
      required: true
