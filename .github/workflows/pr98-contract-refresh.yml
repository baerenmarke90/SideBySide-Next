name: Temporary PR98 Contract Refresh

on:
  push:
    branches:
      - feat/m2-comments-97

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.7'
      - name: Patch typed comment service and restore focused fixture diff
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          service = Path('backend/src/sidebyside/comments/service.py')
          text = service.read_text()
          text = text.replace('from typing import Any\n', 'from typing import Any, Literal, cast\n')
          text = text.replace('from sqlalchemy import and_, delete, or_, select\n', 'from sqlalchemy import and_, or_, select\n')
          text = text.replace(
              'target_type=comment.target_type,',
              'target_type=cast(Literal["MEMORY", "HEART_MOMENT", "MILESTONE"], comment.target_type),',
          )
          marker = '\ndef delete_for_parent(\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          service.write_text(text)

          original = subprocess.check_output(
              ['git', 'show', 'origin/main:backend/tests/conftest.py'], text=True
          )
          anchor = '    from sidebyside.attachments import models as _attachments  # noqa: F401\n'
          insertion = anchor + '    from sidebyside.comments import models as _comments  # noqa: F401\n'
          if 'from sidebyside.comments import models as _comments' not in original:
              original = original.replace(anchor, insertion, 1)
          Path('backend/tests/conftest.py').write_text(original)
          PY
      - name: Refresh generated OpenAPI snapshot
        working-directory: backend
        run: |
          python -m pip install 'uv==0.12.5'
          uv sync --frozen
          uv run --frozen ruff format src tests scripts alembic
          uv run --frozen python scripts/openapi_contract.py write
      - name: Commit generated and focused fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/openapi.json backend/src/sidebyside/comments/service.py backend/tests/conftest.py backend/tests/integration/test_comments.py
          git commit -m 'fix: align comments contract and typing'
          git push origin HEAD:feat/m2-comments-97
