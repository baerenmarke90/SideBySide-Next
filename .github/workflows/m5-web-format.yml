name: M5 Web Format

on:
  push:
    branches:
      - feat/298-m5-web-space-context

permissions:
  contents: write

jobs:
  format:
    name: Format Web changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/298-m5-web-space-context
          fetch-depth: 0

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply repository formatter
        working-directory: web
        run: npm run format

      - name: Commit formatting and remove this one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m5-web-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx web/src/client/spaceContext.test.ts web/src/client/spaceContext.ts web/src/client/config.ts web/src/i18n/locales/de.ts
          git commit -m "style(web): apply Biome formatting"
          git push origin HEAD:feat/298-m5-web-space-context
