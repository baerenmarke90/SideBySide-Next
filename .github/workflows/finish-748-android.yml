name: Finish 748 Android

on:
  push:
    branches:
      - work/748-finish

permissions:
  contents: write

jobs:
  android:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/748-finish
          fetch-depth: 0
      - name: Apply Android wiring
        run: |
          python tools/finish_748_android.py
          python tools/finish_748_android_tests.py
      - name: Extend dependency verification with the documented Gradle flow
        working-directory: android
        run: |
          ./gradlew --write-verification-metadata sha256 \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --no-daemon
      - name: Review verification-metadata scope
        run: |
          python - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          namespace = {"v": "https://schema.gradle.org/dependency-verification"}
          old_text = subprocess.check_output(
              ["git", "show", "HEAD:android/gradle/verification-metadata.xml"],
              text=True,
          )
          new_text = Path("android/gradle/verification-metadata.xml").read_text(encoding="utf-8")
          old_root = ET.fromstring(old_text)
          new_root = ET.fromstring(new_text)

          def component_keys(root):
              return {
                  (node.attrib["group"], node.attrib["name"], node.attrib["version"])
                  for node in root.findall("v:components/v:component", namespace)
              }

          old_components = component_keys(old_root)
          new_components = component_keys(new_root)
          removed = sorted(old_components - new_components)
          if removed:
              raise SystemExit(f"verification metadata unexpectedly removed components: {removed}")

          allowed_new_groups = {
              "androidx.appcompat",
              "androidx.biometric",
              "androidx.core",
              "androidx.credentials",
              "androidx.cursoradapter",
              "androidx.customview",
              "androidx.drawerlayout",
              "androidx.fragment",
              "androidx.lifecycle",
              "androidx.loader",
              "androidx.vectordrawable",
              "androidx.viewpager",
          }
          unexpected = sorted(
              component
              for component in new_components - old_components
              if component[0] not in allowed_new_groups
          )
          if unexpected:
              raise SystemExit(f"unexpected new verification components: {unexpected}")

          old_config = ET.tostring(
              old_root.find("v:configuration", namespace), encoding="unicode"
          )
          new_config = ET.tostring(
              new_root.find("v:configuration", namespace), encoding="unicode"
          )
          if old_config != new_config:
              raise SystemExit("dependency-verification configuration changed unexpectedly")

          added = sorted(new_components - old_components)
          if not any(group == "androidx.credentials" and name == "credentials" for group, name, _ in added):
              raise SystemExit("Credential Manager was not added to verification metadata")
          print("Reviewed new dependency-verification components:")
          for component in added:
              print(" -", ":".join(component))
          PY
      - name: Rerun strict Android gates
        working-directory: android
        run: |
          ./gradlew --no-daemon --dependency-verification strict \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Remove one-time tooling
        run: |
          rm tools/finish_748_android.py tools/finish_748_android_tests.py
          rm .github/workflows/finish-748-android.yml
      - name: Commit verified Android flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(android): require recent authentication before Account deletion"
          git push origin HEAD:work/748-finish
