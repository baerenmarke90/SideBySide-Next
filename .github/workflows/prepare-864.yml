name: Prepare 864 generated contracts

on:
  push:
    branches: [feat/864-wish-detective]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/864-wish-detective
          fetch-depth: 0

      - name: Apply focused source patches
        run: python3 tools/prepare_864.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen

      - name: Format backend changes and refresh OpenAPI
        working-directory: backend
        run: |
          uv run --frozen ruff format \
            src/sidebyside/games/service.py \
            src/sidebyside/api/v1/games.py \
            tests/integration/test_endpoint_matrix.py \
            tests/integration/test_games_wish_candidates.py
          uv run --frozen python scripts/openapi_contract.py write

      - name: Regenerate API clients
        run: tools/openapi/generate.sh

      - name: Format focused Web changes
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx biome format --write \
            src/App.tsx \
            src/main.tsx \
            src/client/routes.ts \
            src/client/routes.test.ts \
            src/client/wishDetectiveSession.ts \
            src/client/wishDetectiveSession.test.ts \
            src/components/GamesProductArea.tsx \
            src/components/GamesProductArea.test.tsx \
            src/components/WishDetectiveGamePage.tsx \
            src/components/WishDetectiveGamePage.test.tsx \
            src/components/WishDetectiveGamePage.css \
            src/i18n/locales/games.ts

      - name: Commit prepared branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend web
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(games): wire Wish Detective candidate flow (#864)"
          git push origin HEAD:feat/864-wish-detective
