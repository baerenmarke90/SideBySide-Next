name: Temporary implement #809 v2

on:
  push:
    branches:
      - feat/809-shared-story-summary-v2

permissions:
  contents: write

concurrency:
  group: implement-809-v2
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"
  SBS_ENVIRONMENT: test
  SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
  SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/809-shared-story-summary-v2
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Apply the rebased #809 slice
        run: python3 tools/temporary/apply_809_v2.py

      - name: Extend the exhaustive Today module visibility fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("web/src/components/TodayPage.test.tsx")
          text = path.read_text(encoding="utf-8")

          old_dashboard = '''        retrospective: {
            id: 'heart-signal',
            type: 'HEART_MOMENT',
            titleOrText: 'Weisst du noch',
            occurredOn: new Date('2020-01-01T00:00:00Z'),
          },
        };
          '''
          new_dashboard = '''        retrospective: {
            id: 'heart-signal',
            type: 'HEART_MOMENT',
            titleOrText: 'Weisst du noch',
            occurredOn: new Date('2020-01-01T00:00:00Z'),
          },
          sharedStorySummary: {
            memories: 4,
            heartMoments: 1,
            milestones: 0,
          },
        };
          '''
          if text.count(old_dashboard) != 1:
              raise SystemExit("Expected one allModulesEligibleDashboard anchor")
          text = text.replace(old_dashboard, new_dashboard, 1)

          old_map = '''      monthly_highlights: 'today-section-monthly',
              recent_shared: 'today-section-recent',
            };
          '''
          new_map = '''      monthly_highlights: 'today-section-monthly',
              recent_shared: 'today-section-recent',
              shared_story_summary: 'shared-story-summary',
            };
          '''
          if text.count(old_map) != 1:
              raise SystemExit("Expected one MODULE_SECTION_MARKER anchor")
          path.write_text(text.replace(old_map, new_map, 1), encoding="utf-8", newline="\n")
          PY

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Upgrade test database
        working-directory: backend
        run: uv run --frozen alembic upgrade head

      - name: Regenerate the authoritative OpenAPI contract
        working-directory: backend
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Regenerate Web and Android clients
        run: tools/openapi/generate.sh

      - name: Format and validate backend
        working-directory: backend
        run: |
          uv run --frozen ruff format src tests scripts alembic
          uv run --frozen ruff check src tests scripts alembic
          uv run --frozen mypy
          uv run --frozen python scripts/openapi_contract.py check
          uv run --frozen pytest tests/unit/test_dashboard_catalog_parity.py -q
          uv run --frozen pytest tests/integration/test_dashboard_story_summary.py -q

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format and validate Web
        working-directory: web
        run: |
          npm run format
          npm run typecheck
          npm run lint
          npm test -- SharedStorySummary.test.tsx dashboardModules.test.ts TodayPage.test.tsx --reporter=default

      - name: Verify generated clients are current
        run: tools/openapi/generate.sh --check

      - name: Remove one-shot implementation machinery
        run: |
          rm .github/workflows/temporary-implement-809.yml
          rm tools/temporary/apply_809_v2.py
          rmdir tools/temporary 2>/dev/null || true

      - name: Commit the implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(web): add shared story summary to Today (#809)"
          git push origin HEAD:feat/809-shared-story-summary-v2
