name: M4 Finalize R7

on:
  push:
    branches: [feat/292-m4c-rules-occurrences-final]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"
  SBS_ENVIRONMENT: test
  SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
  SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test

jobs:
  finalize:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Apply bounded M4-C-S2 completion
        run: python3 tools/m4_finalize.py

      - name: Apply prior runtime corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def extract(workflow_path: str, step_name: str | None = None) -> str:
              workflow = Path(workflow_path).read_text(encoding="utf-8")
              if step_name is not None:
                  workflow = workflow[workflow.index(step_name):]
              start_marker = "          python3 - <<'PY'\n"
              end_marker = "\n          PY\n"
              start = workflow.index(start_marker) + len(start_marker)
              end = workflow.index(end_marker, start)
              lines = workflow[start:end].splitlines()
              return "\n".join(
                  line[10:] if line.startswith("          ") else line for line in lines
              ) + "\n"

          Path("/tmp/m4_runtime_prior.py").write_text(
              extract(".github/workflows/m4-finalize.yml"), encoding="utf-8"
          )
          Path("/tmp/m4_runtime_r6.py").write_text(
              extract(
                  ".github/workflows/m4-finalize-r5.yml",
                  "- name: Make timezone replanning explicit and fix catch-up evidence",
              ),
              encoding="utf-8",
          )
          PY
          python3 /tmp/m4_runtime_prior.py
          python3 /tmp/m4_runtime_r6.py

      - name: Persist timezone-triggered occurrence replanning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/src/sidebyside/reminders/runtime.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "    for reminder in reminders:\n"
              "        _plan_for_recipient(\n"
              "            session, reminder, account, timezone_name=timezone_name\n"
              "        )\n\n\n"
              "def _active_owner"
          )
          new = (
              "    for reminder in reminders:\n"
              "        _plan_for_recipient(\n"
              "            session, reminder, account, timezone_name=timezone_name\n"
              "        )\n"
              "    session.flush()\n\n\n"
              "def _active_owner"
          )
          if old not in text:
              raise RuntimeError("Missing reconcile_account flush anchor")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Format and lint generated completion
        working-directory: backend
        run: |
          uv run --frozen ruff check src tests scripts alembic --fix --unsafe-fixes
          uv run --frozen ruff format src tests scripts alembic
          uv run --frozen ruff check src tests scripts alembic

      - name: Regenerate authoritative OpenAPI and clients
        run: |
          cd backend
          uv run --frozen python scripts/openapi_contract.py write
          cd ..
          tools/openapi/generate.sh

      - name: Validate static gates
        working-directory: backend
        run: |
          uv run --frozen mypy
          uv run --frozen python scripts/openapi_contract.py check

      - name: Validate migration round-trip and drift
        working-directory: backend
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic downgrade 0031
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check

      - name: Validate focused final M4 runtime evidence
        working-directory: backend
        run: uv run --frozen pytest -q tests/integration/test_reminder_runtime.py

      - name: Verify generated clients
        run: tools/openapi/generate.sh --check

      - name: Commit final M4-C-S2 tree
        run: |
          rm tools/m4_finalize.py \
             .github/workflows/m4-finalize.yml \
             .github/workflows/m4-finalize-r5.yml \
             .github/workflows/m4-finalize-r7.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(reminders): finish M4-C-S2 evidence and reconciliation"
          git push origin "HEAD:${GITHUB_REF_NAME}"