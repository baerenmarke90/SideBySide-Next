name: Profile Contract Matrix Fix

on:
  push:
    branches:
      - feat/368-profile-contract-api

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/368-profile-contract-api

      - name: Add profile operations to tenant endpoint matrix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/integration/test_endpoint_matrix.py')
          text = path.read_text(encoding='utf-8')
          needle = '''    Endpoint(\n        "GET",\n        "/api/v1/spaces/{spaceId}/profiles/{accountId}",\n        resource_absence="PARTNER_PROFILE_NOT_FOUND",\n    ),\n'''
          replacement = needle + '''    Endpoint(\n        "PATCH",\n        "/api/v1/spaces/{spaceId}/profiles/{accountId}",\n        body={"displayName": "Matrix Name"},\n        resource_absence="PARTNER_PROFILE_NOT_FOUND",\n    ),\n    Endpoint(\n        "GET",\n        "/api/v1/spaces/{spaceId}/profiles/{accountId}/avatar/content",\n        resource_absence="PARTNER_PROFILE_NOT_FOUND",\n    ),\n'''
          if text.count(needle) != 1:
              raise SystemExit('Expected profile endpoint matrix anchor exactly once')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY

      - name: Commit matrix coverage
        run: |
          git add backend/tests/integration/test_endpoint_matrix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(profile): add new routes to tenant matrix"
          git push origin HEAD:feat/368-profile-contract-api
