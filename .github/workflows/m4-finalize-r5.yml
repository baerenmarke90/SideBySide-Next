name: M4 Finalize R6

on:
  push:
    branches: [feat/292-m4c-rules-occurrences-final]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"
  SBS_ENVIRONMENT: test
  SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
  SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test

jobs:
  finalize:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Apply bounded M4-C-S2 completion
        run: python3 tools/m4_finalize.py

      - name: Apply prior runtime corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/m4-finalize.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/m4_runtime_corrections.py').write_text(script + '\n', encoding='utf-8')
          PY
          python3 /tmp/m4_runtime_corrections.py

      - name: Make timezone replanning explicit and fix catch-up evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Missing R6 patch anchor in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          runtime_path = "backend/src/sidebyside/reminders/runtime.py"
          replace_once(
              runtime_path,
              "def reconcile_account(session: Session, account: Account) -> None:\n"
              "    \"\"\"Replan current Reminder occurrences for one Account after timezone changes.\"\"\"\n",
              "def reconcile_account(\n"
              "    session: Session,\n"
              "    account: Account,\n"
              "    *,\n"
              "    timezone_name: str | None = None,\n"
              ") -> None:\n"
              "    \"\"\"Replan current Reminder occurrences for one Account after timezone changes.\"\"\"\n",
          )
          replace_once(
              runtime_path,
              "    for reminder in reminders:\n"
              "        _plan_for_recipient(session, reminder, account)\n\n\n"
              "def _active_owner",
              "    for reminder in reminders:\n"
              "        _plan_for_recipient(\n"
              "            session, reminder, account, timezone_name=timezone_name\n"
              "        )\n\n\n"
              "def _active_owner",
          )
          replace_once(
              runtime_path,
              "def _plan_for_recipient(session: Session, reminder: Reminder, account: Account) -> None:\n",
              "def _plan_for_recipient(\n"
              "    session: Session,\n"
              "    reminder: Reminder,\n"
              "    account: Account,\n"
              "    *,\n"
              "    timezone_name: str | None = None,\n"
              ") -> None:\n",
          )
          replace_once(
              runtime_path,
              "    desired = _desired_occurrences(session, reminder, account, parameters)\n",
              "    desired = _desired_occurrences(\n"
              "        session, reminder, account, parameters, timezone_name=timezone_name\n"
              "    )\n",
          )
          replace_once(
              runtime_path,
              "def _desired_occurrences(\n"
              "    session: Session,\n"
              "    reminder: Reminder,\n"
              "    account: Account,\n"
              "    parameters: RuleParameters,\n"
              ") -> list[tuple[str, int, datetime]]:\n",
              "def _desired_occurrences(\n"
              "    session: Session,\n"
              "    reminder: Reminder,\n"
              "    account: Account,\n"
              "    parameters: RuleParameters,\n"
              "    *,\n"
              "    timezone_name: str | None = None,\n"
              ") -> list[tuple[str, int, datetime]]:\n",
          )
          replace_once(
              runtime_path,
              "    timezone = _timezone(account.timezone)\n",
              "    timezone = _timezone(timezone_name or account.timezone)\n",
          )

          preference_path = "backend/src/sidebyside/identity/preferences.py"
          replace_once(
              preference_path,
              "    if timezone_changed:\n"
              "        reminder_runtime.reconcile_account(session, account)\n",
              "    if timezone_changed:\n"
              "        reminder_runtime.reconcile_account(\n"
              "            session, account, timezone_name=validated_zone\n"
              "        )\n",
          )

          test_path = "backend/tests/integration/test_reminder_runtime.py"
          replace_once(
              test_path,
              "    occurrence.state = OccurrenceState.PENDING.value\n"
              "    occurrence.generation += 1\n"
              "    occurrence.due_at = runtime.clock.now() - timedelta(hours=25)\n"
              "    stale_payload = {\"occurrenceId\": str(occurrence.id), \"generation\": occurrence.generation}\n"
              "    runtime.handle_occurrence(session, stale_payload)\n",
              "    stale_now = occurrence.due_at + timedelta(hours=25)\n"
              "    occurrence.state = OccurrenceState.PENDING.value\n"
              "    occurrence.generation += 1\n"
              "    occurrence.due_at = stale_now - timedelta(hours=25)\n"
              "    monkeypatch.setattr(runtime.clock, \"now\", lambda: stale_now)\n"
              "    stale_payload = {\n"
              "        \"occurrenceId\": str(occurrence.id),\n"
              "        \"generation\": occurrence.generation,\n"
              "    }\n"
              "    runtime.handle_occurrence(session, stale_payload)\n",
          )
          PY

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Format and lint generated completion
        working-directory: backend
        run: |
          uv run --frozen ruff check src tests scripts alembic --fix --unsafe-fixes
          uv run --frozen ruff format src tests scripts alembic
          uv run --frozen ruff check src tests scripts alembic

      - name: Regenerate authoritative OpenAPI and clients
        run: |
          cd backend
          uv run --frozen python scripts/openapi_contract.py write
          cd ..
          tools/openapi/generate.sh

      - name: Validate static gates
        working-directory: backend
        run: |
          uv run --frozen mypy
          uv run --frozen python scripts/openapi_contract.py check

      - name: Validate migration round-trip and drift
        working-directory: backend
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic downgrade 0031
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check

      - name: Validate focused final M4 runtime evidence
        working-directory: backend
        run: uv run --frozen pytest -q tests/integration/test_reminder_runtime.py

      - name: Verify generated clients
        run: tools/openapi/generate.sh --check

      - name: Commit final M4-C-S2 tree
        run: |
          rm tools/m4_finalize.py \
             .github/workflows/m4-finalize.yml \
             .github/workflows/m4-finalize-r5.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(reminders): finish M4-C-S2 evidence and reconciliation"
          git push origin "HEAD:${GITHUB_REF_NAME}"