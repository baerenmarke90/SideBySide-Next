name: Web S8

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-s8.yml"

permissions:
  contents: read

concurrency:
  group: web-s8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Reference Flow
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  format-artifact:
    name: Temporary Biome baseline commit
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply final Biome baseline
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const biomePath = 'web/biome.json';
          const biome = JSON.parse(fs.readFileSync(biomePath, 'utf8'));
          biome.files.includes = [
            '**',
            '!src/api/generated',
            '!vite.config.js',
            '!vite.config.d.ts',
          ];
          fs.writeFileSync(biomePath, `${JSON.stringify(biome, null, 2)}\n`);

          execFileSync('npm', ['run', 'format'], {
            cwd: 'web',
            stdio: 'inherit',
          });

          const workflowPath = '.github/workflows/web-s8.yml';
          const workflow = fs.readFileSync(workflowPath, 'utf8');
          const marker = '\n  format-artifact:\n';
          const markerIndex = workflow.indexOf(marker);
          if (markerIndex < 0) throw new Error('Temporary formatter marker not found');
          fs.writeFileSync(workflowPath, `${workflow.slice(0, markerIndex).trimEnd()}\n`);

          const files = [
            '.github/workflows/web-s8.yml',
            'web/biome.json',
            'web/public/theme-bootstrap.js',
            'web/src/App.tsx',
            'web/src/client/config.ts',
            'web/src/client/referenceFlow.e2e.test.ts',
            'web/src/client/referenceFlow.test.ts',
            'web/src/client/referenceFlow.ts',
            'web/src/components/MemoryPreview.tsx',
            'web/src/components/StoryList.test.tsx',
            'web/src/components/StoryList.tsx',
            'web/src/components/ThemeControl.tsx',
            'web/src/components/storyPresentation.test.ts',
            'web/src/components/storyPresentation.ts',
            'web/src/i18n/locales/de.ts',
            'web/src/styles.css',
            'web/src/theme.css',
            'web/src/theme.ts',
            'web/src/themeBootstrap.test.ts',
            'web/src/themeContrast.test.ts',
          ];

          const repository = process.env.REPOSITORY;
          const branch = process.env.HEAD_REF;
          const expectedHead = process.env.EXPECTED_HEAD;
          const token = process.env.GH_TOKEN;
          const api = `https://api.github.com/repos/${repository}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'sidebyside-next-web-s8',
          };

          async function request(path, options = {}) {
            const response = await fetch(`${api}${path}`, {
              ...options,
              headers: {
                ...headers,
                ...(options.body ? { 'Content-Type': 'application/json' } : {}),
                ...(options.headers || {}),
              },
            });
            if (!response.ok) {
              throw new Error(`${options.method || 'GET'} ${path}: ${response.status} ${await response.text()}`);
            }
            return response.json();
          }

          const ref = await request(`/git/ref/heads/${branch}`);
          const currentHead = ref.object.sha;
          if (currentHead !== expectedHead) {
            throw new Error(`Branch moved during formatter run: expected ${expectedHead}, got ${currentHead}`);
          }

          const parent = await request(`/git/commits/${currentHead}`);
          const treeEntries = [];
          for (const path of files) {
            const blob = await request('/git/blobs', {
              method: 'POST',
              body: JSON.stringify({
                content: fs.readFileSync(path).toString('base64'),
                encoding: 'base64',
              }),
            });
            treeEntries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
          }

          const tree = await request('/git/trees', {
            method: 'POST',
            body: JSON.stringify({ base_tree: parent.tree.sha, tree: treeEntries }),
          });
          const commit = await request('/git/commits', {
            method: 'POST',
            body: JSON.stringify({
              message: 'style(web): establish Biome format baseline',
              tree: tree.sha,
              parents: [currentHead],
            }),
          });
          await request(`/git/refs/heads/${branch}`, {
            method: 'PATCH',
            body: JSON.stringify({ sha: commit.sha, force: false }),
          });
          console.log(`Created baseline commit ${commit.sha}`);
          NODE
