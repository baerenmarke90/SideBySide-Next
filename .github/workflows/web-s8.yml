name: Web S8

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-s8.yml"

permissions:
  contents: read

concurrency:
  group: web-s8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Reference Flow
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  format-artifact:
    name: Temporary Biome format artifact
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Snapshot web baseline
        run: cp -a web /tmp/web-before

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply Biome formatting
        working-directory: web
        run: npm run format

      - name: Package formatter result
        run: |
          diff -ruN --exclude=node_modules --exclude=dist /tmp/web-before web > biome-format.patch || true
          tar -czf biome-formatted-web.tar.gz --exclude='web/node_modules' --exclude='web/dist' web

      - name: Upload formatter result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-biome-format-186
          path: |
            biome-format.patch
            biome-formatted-web.tar.gz
          if-no-files-found: error
          retention-days: 1
