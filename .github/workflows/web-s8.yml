name: Web S8

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-s8.yml"

permissions:
  contents: write

concurrency:
  group: web-s8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Reference Flow
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve dependency lock for S8
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Commit generated dependency lock to PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const content = await readFile('package-lock.json', 'utf8');
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/web/package-lock.json`, {
            method: 'PUT',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify({
              message: 'Lock S8 web dependencies',
              content: Buffer.from(content).toString('base64'),
              branch: process.env.HEAD_BRANCH,
            }),
          });
          if (!response.ok) {
            throw new Error(`GitHub contents API failed: ${response.status} ${await response.text()}`);
          }
          EOF

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
