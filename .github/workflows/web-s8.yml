name: Web S8

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-s8.yml"

concurrency:
  group: web-s8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Reference Flow
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve dependency lock for S8
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          echo "S8_LOCK_BEGIN"
          base64 -w 0 package-lock.json
          echo
          echo "S8_LOCK_END"

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
