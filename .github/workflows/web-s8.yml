name: Web S8

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-s8.yml"

permissions:
  contents: write

concurrency:
  group: web-s8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Reference Flow
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh dependency lock for patched versions
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed dependency lock to PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const path = 'web/package-lock.json';
          const apiUrl = `https://api.github.com/repos/${process.env.REPOSITORY}/contents/${path}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const current = await fetch(`${apiUrl}?ref=${encodeURIComponent(process.env.HEAD_BRANCH)}`, { headers });
          if (!current.ok) throw new Error(`Lock lookup failed: ${current.status} ${await current.text()}`);
          const { sha } = await current.json();
          const content = await readFile('package-lock.json', 'utf8');
          const response = await fetch(apiUrl, {
            method: 'PUT',
            headers,
            body: JSON.stringify({
              message: 'Refresh S8 web dependency lock',
              content: Buffer.from(content).toString('base64'),
              sha,
              branch: process.env.HEAD_BRANCH,
            }),
          });
          if (!response.ok) throw new Error(`Lock update failed: ${response.status} ${await response.text()}`);
          EOF

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
