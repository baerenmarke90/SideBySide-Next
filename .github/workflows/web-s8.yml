name: Web S8

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-s8.yml"

permissions:
  contents: read

concurrency:
  group: web-s8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Reference Flow
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  lockfile-update:
    name: Temporary npm lockfile update
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Generate lockfile with npm
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile to PR branch via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const path = 'web/package-lock.json';
          const branch = process.env.HEAD_REF;
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'sidebyside-next-web-s8',
          };

          const url = `https://api.github.com/repos/${repository}/contents/${path}`;
          const currentResponse = await fetch(`${url}?ref=${encodeURIComponent(branch)}`, { headers });
          if (!currentResponse.ok) {
            throw new Error(`Failed to read current lockfile metadata: ${currentResponse.status} ${await currentResponse.text()}`);
          }

          const current = await currentResponse.json();
          const content = fs.readFileSync(path).toString('base64');
          const updateResponse = await fetch(url, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: 'chore(web): refresh lockfile for Biome',
              content,
              sha: current.sha,
              branch,
            }),
          });

          if (!updateResponse.ok) {
            throw new Error(`Failed to update lockfile: ${updateResponse.status} ${await updateResponse.text()}`);
          }
          NODE
