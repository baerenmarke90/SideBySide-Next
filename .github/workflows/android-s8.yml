name: Android S8

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-s8.yml"

permissions:
  contents: read

concurrency:
  group: android-s8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Reference Flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify pinned Gradle wrapper JAR
        working-directory: android
        shell: bash
        run: |
          printf '%s  %s\n' \
            '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7' \
            'gradle/wrapper/gradle-wrapper.jar' \
            | sha256sum --check --strict -

      - name: Install Android SDK 37.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Unit, semantics and contract tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:testDebugUnitTest

      - name: Android lint
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:lintDebug

      - name: Reproducible debug build
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:assembleDebug

      - name: Dependency verification rejects tampered metadata
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          metadata='gradle/verification-metadata.xml'
          backup="$RUNNER_TEMP/verification-metadata.xml"
          log="$RUNNER_TEMP/dependency-verification-negative.log"
          cp "$metadata" "$backup"
          trap 'cp "$backup" "$metadata"' EXIT

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("gradle/verification-metadata.xml")
          text = path.read_text(encoding="utf-8")
          tampered, count = re.subn(
              r'(<sha256 value=")[0-9a-f]{64}(")',
              lambda match: match.group(1) + ("0" * 64) + match.group(2),
              text,
          )
          if count == 0:
              raise SystemExit("No SHA-256 entries found for the negative test.")
          path.write_text(tampered, encoding="utf-8")
          print(f"Negative test temporarily changed {count} SHA-256 entries.")
          PY

          set +e
          ./gradlew --no-daemon --stacktrace --refresh-dependencies \
            --dependency-verification strict help >"$log" 2>&1
          status=$?
          set -e

          cp "$backup" "$metadata"
          trap - EXIT

          if [[ "$status" -eq 0 ]]; then
            cat "$log"
            echo "Dependency Verification unexpectedly accepted modified checksums."
            exit 1
          fi
          if ! grep -q "Dependency verification failed" "$log"; then
            cat "$log"
            echo "Gradle did not fail clearly on Dependency Verification."
            exit 1
          fi
          echo "Modified dependency checksums were rejected as expected."
