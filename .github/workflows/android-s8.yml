name: Android S8

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-s8.yml"

permissions:
  contents: read

concurrency:
  group: android-s8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Reference Flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Unit, semantics and contract tests
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Reproducible debug build
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
