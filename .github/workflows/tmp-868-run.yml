name: Temporary annual archive wiring

on:
  push:
    branches:
      - feat/868-our-years

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore: run annual archive wiring'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/868-our-years
          fetch-depth: 0
      - name: Apply annual archive wiring
        run: |
          python3 .github/tmp_apply_868.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Format changed web files
        working-directory: web
        run: npx biome format src/App.tsx src/client/routes.ts src/components/StoryProductPage.tsx src/components/StoryYearsPage.tsx src/components/StoryYearsPage.css src/components/StoryYearsPage.test.tsx src/i18n/locales/de.ts --write
      - name: Run focused annual archive tests
        working-directory: web
        run: npm test -- src/components/StoryYearsPage.test.tsx
      - name: Run web typecheck
        working-directory: web
        run: npm run typecheck
      - name: Commit annual archive wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/App.tsx web/src/client/routes.ts web/src/components/StoryProductPage.tsx web/src/components/StoryYearsPage.tsx web/src/components/StoryYearsPage.css web/src/components/StoryYearsPage.test.tsx web/src/i18n/locales/de.ts
          git diff --cached --check
          git commit -m 'feat(web): add our years archive (#868)'
          git push origin HEAD:feat/868-our-years
