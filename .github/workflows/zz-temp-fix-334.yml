name: Temporary validation fix for 334

on:
  push:
    branches:
      - feat/334-registration-maintenance

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SBS_ENVIRONMENT: test
      SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
      SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
      UV_VERSION: "0.12.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/334-registration-maintenance
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Apply focused fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          service = "backend/src/sidebyside/administration/service.py"
          replace_once(
              service,
              "from sqlalchemy import select\nfrom sqlalchemy.orm import Session\n",
              "from sqlalchemy import select\nfrom sqlalchemy.dialects.postgresql import insert\nfrom sqlalchemy.orm import Session\n",
          )
          replace_once(
              service,
              """    if settings is None:\n        settings = InstanceAdministrationSettings(\n            singleton_key=1,\n            registration_enabled=True,\n            maintenance_mode=False,\n        )\n        session.add(settings)\n        session.flush()\n    return settings\n""",
              """    if settings is None:\n        # SELECT ... FOR UPDATE cannot lock a row that does not exist. Use an\n        # atomic PostgreSQL upsert so concurrent first requests cannot both try\n        # to create the singleton and turn a normal race into a 500 response.\n        session.execute(\n            insert(InstanceAdministrationSettings)\n            .values(\n                singleton_key=1,\n                registration_enabled=True,\n                maintenance_mode=False,\n                version=1,\n            )\n            .on_conflict_do_nothing(\n                index_elements=[InstanceAdministrationSettings.singleton_key]\n            )\n        )\n        settings = session.execute(statement).scalar_one()\n    return settings\n""",
          )

          matrix = "backend/tests/integration/test_endpoint_matrix.py"
          replace_once(
              matrix,
              'SERVER_ADMIN_ONLY: tuple[tuple[str, str], ...] = (("GET", "/api/v1/server-admin/overview"),)\n',
              '''SERVER_ADMIN_ONLY: tuple[tuple[str, str], ...] = (\n    ("GET", "/api/v1/server-admin/overview"),\n    ("GET", "/api/v1/server-admin/settings"),\n    ("PUT", "/api/v1/server-admin/settings/registration"),\n    ("PUT", "/api/v1/server-admin/settings/maintenance"),\n    ("GET", "/api/v1/server-admin/activity"),\n)\n''',
          )
          replace_once(
              matrix,
              '    ("GET", "/api/v1/health/ready"),\n    ("POST", "/api/v1/auth/register"),\n',
              '    ("GET", "/api/v1/health/ready"),\n    ("GET", "/api/v1/instance/status"),\n    ("POST", "/api/v1/auth/register"),\n',
          )
          replace_once(
              matrix,
              '    for path in ("/api/v1/health", "/api/v1/health/ready"):\n',
              '''    for path in (\n        "/api/v1/health",\n        "/api/v1/health/ready",\n        "/api/v1/instance/status",\n    ):\n''',
          )
          PY

      - name: Validate focused integration failures
        working-directory: backend
        run: |
          uv run --frozen ruff format src/sidebyside/administration/service.py tests/integration/test_endpoint_matrix.py
          uv run --frozen ruff check src/sidebyside/administration/service.py tests/integration/test_endpoint_matrix.py
          uv run --frozen alembic upgrade head
          uv run --frozen pytest -m integration -q \
            tests/integration/test_endpoint_matrix.py::test_contract_is_completely_covered \
            tests/integration/test_invitations.py::TestRace::test_two_invitations_compete_for_last_slot \
            tests/integration/test_oidc_onboarding.py::TestConcurrency::test_two_callbacks_with_same_invitation_create_exactly_one_account \
            tests/integration/test_space_profile.py::TestRace::test_concurrent_updates_do_not_overwrite_each_other

      - name: Commit verified fix
        run: |
          rm .github/workflows/zz-temp-fix-334.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "fix: make instance settings initialization concurrency-safe (#334)"
          git push origin HEAD:feat/334-registration-maintenance
