name: Issue 838 Contract Sync

on:
  push:
    branches:
      - feat/838-date-only-plans

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
      SBS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/838-date-only-plans
          fetch-depth: 0

      - name: Apply count-checked #838 parity patches
        run: python tools/issue_838_native_patch.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen

      - name: Regenerate authoritative OpenAPI contract
        working-directory: backend
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Regenerate TypeScript and Kotlin clients
        run: tools/openapi/generate.sh

      - name: Format Web sources
        working-directory: web
        run: |
          npm ci
          npm run format

      - name: Commit patched, generated and formatted results
        run: |
          if git diff --quiet; then
            echo "No generated, parity, or formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json web/src/api/generated android/api/generated web/src android/app/src
          git commit -m "chore(api): apply and regenerate #838 parity"
          git push origin HEAD:feat/838-date-only-plans
