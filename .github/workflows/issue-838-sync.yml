name: Issue 838 Contract Sync

on:
  push:
    branches:
      - feat/838-date-only-plans

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/838-date-only-plans
          fetch-depth: 0

      - name: Apply #838 Android acceptance follow-up
        run: python tools/issue_838_followup_patch.py

      - name: Commit follow-up
        run: |
          if git diff --quiet; then
            echo "No follow-up changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src
          git commit -m "test(android): cover date-only planning #838"
          git push origin HEAD:feat/838-date-only-plans
