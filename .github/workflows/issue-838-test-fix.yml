name: Issue 838 PlanningTest Fix

on:
  push:
    branches:
      - feat/838-date-only-plans

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/838-date-only-plans
          fetch-depth: 0
      - name: Apply PlanningTest contract patch
        run: python tools/issue_838_planning_test_patch.py
      - name: Commit test updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/test/java/de/sidebyside/next/plan/PlanningTest.kt
          git commit -m "test(android): align planning contract with date-only schedules"
          git push origin HEAD:feat/838-date-only-plans
