name: Finish 748 Android platform bridge

on:
  push:
    branches:
      - work/748-finish

permissions:
  contents: write

jobs:
  bridge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/748-finish
          fetch-depth: 0

      - name: Wire Credential Manager and OIDC callback
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          path = "android/app/src/main/java/de/sidebyside/next/reference/MainActivity.kt"
          replace_once(
              path,
              "import android.content.Context\nimport android.os.Bundle\n",
              "import android.content.Context\nimport android.content.Intent\nimport android.net.Uri\nimport android.os.Bundle\n",
          )
          replace_once(
              path,
              "import androidx.activity.result.contract.ActivityResultContracts\n",
              "import androidx.activity.result.contract.ActivityResultContracts\nimport androidx.credentials.CredentialManager\nimport androidx.credentials.GetCredentialRequest\nimport androidx.credentials.GetPublicKeyCredentialOption\nimport androidx.credentials.PublicKeyCredential\n",
          )
          replace_once(
              path,
              "class MainActivity : ComponentActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n",
              "class MainActivity : ComponentActivity() {\n    private val oidcCallback = mutableStateOf<Uri?>(null)\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n",
          )
          replace_once(
              path,
              "        super.onCreate(savedInstanceState)\n        setContent {\n            SideBySideTheme {\n                ReferenceFlowRoute()\n            }\n        }\n    }\n}\n",
              "        super.onCreate(savedInstanceState)\n        oidcCallback.value = intent?.data?.takeIf(::isRecentAuthenticationOidcCallback)\n        setContent {\n            SideBySideTheme {\n                ReferenceFlowRoute(\n                    oidcCallback = oidcCallback.value,\n                    onOidcCallbackConsumed = { oidcCallback.value = null },\n                )\n            }\n        }\n    }\n\n    override fun onNewIntent(intent: Intent) {\n        super.onNewIntent(intent)\n        setIntent(intent)\n        oidcCallback.value = intent.data?.takeIf(::isRecentAuthenticationOidcCallback)\n    }\n\n    private fun isRecentAuthenticationOidcCallback(uri: Uri): Boolean =\n        uri.scheme == \"de.sidebyside.app\" &&\n            uri.host == \"recent-authentication\" &&\n            uri.path == \"/oidc\"\n}\n",
          )
          replace_once(
              path,
              "private fun ReferenceFlowRoute(\n    referenceViewModel: ReferenceViewModel = viewModel(factory = referenceViewModelFactory(LocalContext.current)),\n) {\n",
              "private fun ReferenceFlowRoute(\n    oidcCallback: Uri? = null,\n    onOidcCallbackConsumed: () -> Unit = {},\n    referenceViewModel: ReferenceViewModel = viewModel(factory = referenceViewModelFactory(LocalContext.current)),\n) {\n",
          )
          replace_once(
              path,
              "    val context = LocalContext.current\n    val scope = rememberCoroutineScope()\n",
              "    val context = LocalContext.current\n    val scope = rememberCoroutineScope()\n    val credentialManager = remember(context) { CredentialManager.create(context) }\n",
          )
          effects = r'''
    LaunchedEffect(state.accountDeletionPasskeyRequest) {
        val requestJson = state.accountDeletionPasskeyRequest ?: return@LaunchedEffect
        runCatching {
            val result = credentialManager.getCredential(
                context,
                GetCredentialRequest(
                    listOf(GetPublicKeyCredentialOption(requestJson = requestJson)),
                ),
            )
            val credential = result.credential as? PublicKeyCredential
                ?: error("Credential Manager returned a non-passkey credential")
            credential.authenticationResponseJson
        }.onSuccess(referenceViewModel::finishAccountDeletionPasskey)
            .onFailure(referenceViewModel::failAccountDeletionRecentAuthentication)
    }

    LaunchedEffect(state.accountDeletionOidcPending?.authorizationUrl) {
        state.accountDeletionOidcPending?.authorizationUrl?.let { authorizationUrl ->
            runCatching {
                context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(authorizationUrl)))
            }.onFailure(referenceViewModel::failAccountDeletionRecentAuthentication)
        }
    }

    LaunchedEffect(oidcCallback) {
        val callback = oidcCallback ?: return@LaunchedEffect
        val code = callback.getQueryParameter("code")
        val stateParameter = callback.getQueryParameter("state")
        if (code != null && stateParameter != null) {
            referenceViewModel.finishAccountDeletionOidc(code, stateParameter)
        } else {
            referenceViewModel.failAccountDeletionRecentAuthentication(
                IllegalArgumentException("OIDC recent authentication did not return code and state"),
            )
        }
        onOidcCallbackConsumed()
    }

'''
          replace_once(
              path,
              "    val storyFlow = @Composable {\n",
              effects + "    val storyFlow = @Composable {\n",
          )
          replace_once(
              path,
              "                            AccountSettingsContent(\n                                demoMode = state.demoMode,\n                                busy = state.accountDeletionBusy,\n                                problem = state.accountDeletionProblem,\n                                onOpenDataExport = { navController.navigate(DATA_EXPORT_ROUTE) },\n                                onDeleteAccount = viewModel::deleteOwnAccount,\n                            )\n",
              "                            AccountSettingsContent(\n                                demoMode = state.demoMode,\n                                busy = state.accountDeletionBusy,\n                                problem = state.accountDeletionProblem,\n                                recentAuthenticationCapabilities =\n                                    state.accountDeletionRecentAuthenticationCapabilities,\n                                recentAuthenticationBusy = state.accountDeletionRecentAuthenticationBusy,\n                                recentAuthenticationProblem = state.accountDeletionRecentAuthenticationProblem,\n                                recentAuthenticationComplete = state.accountDeletionRecentAuthenticationComplete,\n                                onLoadRecentAuthentication = viewModel::loadAccountDeletionRecentAuthentication,\n                                onRecentAuthenticationPassword = viewModel::authenticateAccountDeletionPassword,\n                                onRecentAuthenticationPasskey = viewModel::startAccountDeletionPasskey,\n                                onRecentAuthenticationOidc = viewModel::startAccountDeletionOidc,\n                                onResetRecentAuthentication = viewModel::resetAccountDeletionRecentAuthentication,\n                                onOpenDataExport = { navController.navigate(DATA_EXPORT_ROUTE) },\n                                onDeleteAccount = viewModel::deleteOwnAccount,\n                            )\n",
          )
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/finish-748-android-platform.yml

      - name: Commit platform bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(android): bridge passkey and OIDC step-up ceremonies"
          git push origin HEAD:work/748-finish
