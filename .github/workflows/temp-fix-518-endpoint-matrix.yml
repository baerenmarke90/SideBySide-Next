name: Temporary 518 Endpoint Matrix Repair

on:
  push:
    branches:
      - feat/518-space-offboarding-core
    paths:
      - .github/workflows/temp-fix-518-endpoint-matrix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Restore matrix from main and add one endpoint
        run: python tools/temp_fix_518_endpoint_matrix.py
      - name: Verify and commit scoped repair
        run: |
          git diff --check
          git rm .github/workflows/temp-fix-518-endpoint-matrix.yml tools/temp_fix_518_endpoint_matrix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/integration/test_endpoint_matrix.py
          git commit -m "test(api): restore endpoint matrix and add self-leave"
          git push origin HEAD:feat/518-space-offboarding-core
