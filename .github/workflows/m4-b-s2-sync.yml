name: M4-B-S2 Sync

on:
  push:
    branches:
      - feat/289-m4b-thinking-push

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"
  SBS_ENVIRONMENT: test
  SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
  SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test

jobs:
  sync:
    name: Merge main, complete B-S2 contract, and regenerate clients
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Merge current main and resolve only the expected engagement overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            unexpected=0
            while IFS= read -r path; do
              case "$path" in
                backend/src/sidebyside/api/v1/engagement.py|backend/src/sidebyside/engagement/__init__.py|backend/src/sidebyside/engagement/service.py)
                  ;;
                *)
                  echo "Unexpected merge conflict: $path"
                  unexpected=1
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
            if [ "$unexpected" -ne 0 ]; then
              exit 1
            fi
          fi

          for path in \
            backend/src/sidebyside/api/v1/engagement.py \
            backend/src/sidebyside/engagement/__init__.py \
            backend/src/sidebyside/engagement/service.py; do
            if git ls-files -u -- "$path" | grep -q .; then
              git checkout --ours -- "$path"
              git add "$path"
            fi
          done

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Preserve final B-S1 semantics and complete the B-S2 cross-cutting contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          api = Path("backend/src/sidebyside/api/v1/engagement.py")
          text = api.read_text(encoding="utf-8")
          text = text.replace(
              'router = APIRouter(tags=["activity", "notifications"])',
              'router = APIRouter()',
              1,
          )

          route_tags = {
              'operation_id="getActivity",\n    responses=problem_responses(400, 401, 404, 422),':
                  'operation_id="getActivity",\n    responses=problem_responses(400, 401, 404, 422),\n    tags=["activity"],',
              'operation_id="getNotifications",\n    responses=problem_responses(400, 401, 404, 422),':
                  'operation_id="getNotifications",\n    responses=problem_responses(400, 401, 404, 422),\n    tags=["notifications"],',
              'operation_id="getNotificationUnreadCount",\n    responses=problem_responses(401, 404, 422),':
                  'operation_id="getNotificationUnreadCount",\n    responses=problem_responses(401, 404, 422),\n    tags=["notifications"],',
              'operation_id="markNotificationRead",\n    responses=problem_responses(401, 404, 422),':
                  'operation_id="markNotificationRead",\n    responses=problem_responses(401, 404, 422),\n    tags=["notifications"],',
              'operation_id="markAllNotificationsRead",\n    responses=problem_responses(401, 404, 422),':
                  'operation_id="markAllNotificationsRead",\n    responses=problem_responses(401, 404, 422),\n    tags=["notifications"],',
              'operation_id="sendThinkingOfYou",\n    responses=problem_responses(401, 404, 422, 429),':
                  'operation_id="sendThinkingOfYou",\n    responses=problem_responses(401, 404, 422, 429),\n    tags=["notifications"],',
          }
          for old, new in route_tags.items():
              if old in text and new not in text:
                  text = text.replace(old, new, 1)

          old_id = 'notification_id: Annotated[UUID, Path(alias="notificationId")],'
          new_id = 'notification_id: Annotated[str, Path(alias="notificationId")],'
          if old_id in text:
              text = text.replace(old_id, new_id, 1)
          if new_id not in text:
              raise SystemExit("final B-S1 notification path semantics were not preserved")
          if 'router = APIRouter()' not in text:
              raise SystemExit("engagement router still has shared tags")
          for required in (
              'tags=["activity"]',
              'tags=["notifications"]',
              'operation_id="sendThinkingOfYou"',
          ):
              if required not in text:
                  raise SystemExit(f"missing engagement contract marker: {required}")
          api.write_text(text, encoding="utf-8")

          service = Path("backend/src/sidebyside/engagement/service.py")
          text = service.read_text(encoding="utf-8")
          import_marker = "from sidebyside.core.errors import ErrorCode, NotFoundError\n"
          if "from sidebyside.core.ids import parse_id\n" not in text:
              if import_marker not in text:
                  raise SystemExit("service import marker not found")
              text = text.replace(
                  import_marker,
                  import_marker + "from sidebyside.core.ids import parse_id\n",
                  1,
              )
          signature = "    notification_id: UUID,\n) -> Notification:\n    statement = (\n"
          if signature in text:
              replacement = (
                  "    notification_id: UUID | str,\n"
                  ") -> Notification:\n"
                  "    identifier = notification_id if isinstance(notification_id, UUID) else parse_id(notification_id)\n"
                  "    if identifier is None:\n"
                  "        raise NotFoundError(\n"
                  "            \"Notification not found.\",\n"
                  "            ErrorCode.NOTIFICATION_NOT_FOUND,\n"
                  "        )\n"
                  "    statement = (\n"
              )
              text = text.replace(signature, replacement, 1)
          text = text.replace(
              "            Notification.id == notification_id,\n",
              "            Notification.id == identifier,\n",
              1,
          )
          for required in (
              "from sidebyside.core.ids import parse_id",
              "notification_id: UUID | str",
              "Notification.id == identifier",
              "from sidebyside.engagement import push, thinking",
          ):
              if required not in text:
                  raise SystemExit(f"missing combined service marker: {required}")
          service.write_text(text, encoding="utf-8")

          thinking = Path("backend/src/sidebyside/engagement/thinking.py")
          text = thinking.read_text(encoding="utf-8")
          text = text.replace(
              '"""Content-free `Ich denke an dich` command and projection helper."""',
              '"""Content-free thinking-of-you command and projection helper."""',
              1,
          )
          thinking.write_text(text, encoding="utf-8")

          matrix = Path("backend/tests/integration/test_endpoint_matrix.py")
          text = matrix.read_text(encoding="utf-8")
          thinking_endpoint = (
              '    Endpoint(\n'
              '        "POST",\n'
              '        "/api/v1/spaces/{spaceId}/thinking-of-you",\n'
              '        body={"clientRequestId": str(uuid4())},\n'
              '    ),\n'
          )
          if thinking_endpoint not in text:
              marker = '    Endpoint("POST", "/api/v1/spaces/{spaceId}/notifications/read-all"),\n'
              if marker not in text:
                  raise SystemExit("endpoint-matrix notification marker not found")
              text = text.replace(marker, marker + thinking_endpoint, 1)
          matrix.write_text(text, encoding="utf-8")

          migration = Path("backend/alembic/versions/0030_m4_thinking_push.py").read_text(
              encoding="utf-8"
          )
          if 'revision: str = "0030"' not in migration or 'down_revision: str | None = "0029"' not in migration:
              raise SystemExit("B-S2 migration is not 0030 -> 0029")
          PY

          git add \
            backend/src/sidebyside/api/v1/engagement.py \
            backend/src/sidebyside/engagement/service.py \
            backend/src/sidebyside/engagement/thinking.py \
            backend/tests/integration/test_endpoint_matrix.py

      - name: Validate B-S2 and regenerate authoritative contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$UV_VERSION"
          (
            cd backend
            uv lock --check
            uv sync --frozen
            uv run --frozen ruff format src/sidebyside/api/v1/engagement.py src/sidebyside/engagement/service.py src/sidebyside/engagement/thinking.py tests/integration/test_endpoint_matrix.py
            uv run --frozen ruff check src/sidebyside/api/v1/engagement.py src/sidebyside/engagement tests/integration/test_thinking_push.py tests/integration/test_endpoint_matrix.py
            uv run --frozen ruff format --check src/sidebyside/api/v1/engagement.py src/sidebyside/engagement tests/integration/test_thinking_push.py tests/integration/test_endpoint_matrix.py
            uv run --frozen mypy src/sidebyside/api/v1/engagement.py src/sidebyside/engagement
            uv run --frozen alembic upgrade head
            uv run --frozen alembic check
            uv run --frozen pytest -m integration -q tests/integration/test_thinking_push.py
            uv run --frozen pytest -m integration -q tests/integration/test_endpoint_matrix.py -k "thinking or contract_is_completely_covered"
            uv run --frozen python scripts/openapi_contract.py write
          )
          tools/openapi/generate.sh
          tools/openapi/generate.sh --check
          git add -A

      - name: Create the real B-S2 merge commit and push it
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m4-b-s2-sync.yml
          git add -A
          git commit -m "Merge main into M4-B-S2"
          git push origin HEAD:feat/289-m4b-thinking-push
