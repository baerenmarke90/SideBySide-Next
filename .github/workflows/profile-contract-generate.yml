name: Profile Contract Generator

on:
  push:
    branches:
      - feat/368-profile-contract-api

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/368-profile-contract-api
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen

      - name: Write OpenAPI contract
        working-directory: backend
        env:
          SBS_ENVIRONMENT: test
          SBS_BOOTSTRAP_TOKEN: generator-only-bootstrap-token-with-32-chars
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Generate TypeScript and Kotlin clients
        run: tools/openapi/generate.sh

      - name: Commit generated contract and clients
        run: |
          git add backend/openapi.json web/src/api/generated android/api/generated
          if git diff --cached --quiet; then
            echo "No generated drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(api): regenerate profile contract clients"
          git push origin HEAD:feat/368-profile-contract-api
