name: M3-S7 Status Sync

on:
  push:
    branches:
      - feat/257-m3-s7-private-note-gift-idea
    paths:
      - .github/workflows/m3-s7-status-sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Synchronize M3 living status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "docs/IMPLEMENTATION-STATUS.md",
              "- [ ] **M3-S7 — PrivateNote + GiftIdea:** next runtime slice according to the Delivery Plan.",
              "- [x] **M3-S7 — PrivateNote + GiftIdea:** dedicated owner-only PrivateNote and GiftIdea tables/services with ProtectedPayload content, server-derived Space/owner/privacy, CRUD/List under `/spaces/{spaceId}/private/...`, `If-Match`/409, GiftIdea lifecycle `IDEA | BOUGHT | GIVEN`, inert URL storage without server fetches, privacy-safe 404 behavior, owner-filtered pagination, redacted private events, and PostgreSQL/HTTP partner/Cross-Tenant coverage.",
          )
          replace_once(
              "docs/IMPLEMENTATION-STATUS.md",
              "M3-S7 **PrivateNote + GiftIdea** according to the [M3 Delivery Plan](m3/DELIVERY-PLAN.md): separate owner-only tables/services and CRUD/List under `/spaces/{spaceId}/private/...`, ProtectedPayload content, GiftIdea lifecycle `IDEA | BOUGHT | GIVEN`, Privacy-safe 404 behavior, event/log redaction, and partner-negative coverage. PrivateCollection follows in S8.",
              "M3-S8 **PrivateCollection** according to the [M3 Delivery Plan](m3/DELIVERY-PLAN.md): separate owner-only root/items, parent-derived authorization, owner-only reorder/completion, Privacy-safe 404 behavior, and partner/Cross-Space negative coverage.",
          )

          replace_once("docs/ROADMAP.md", "**Version:** 2.0", "**Version:** 2.1")
          replace_once(
              "docs/ROADMAP.md",
              "**Current:** M0, M1, and M2 are complete for their intended scope. **G1 and G2 have passed. M3 is released for implementation; S1 through S6 are delivered. The next runtime slice is M3-S7 — PrivateNote + GiftIdea.**",
              "**Current:** M0, M1, and M2 are complete for their intended scope. **G1 and G2 have passed. M3 is released for implementation; S1 through S7 are delivered. The next runtime slice is M3-S8 — PrivateCollection.**",
          )
          replace_once(
              "docs/ROADMAP.md",
              "### M3 — Planning & Private Area: released, S1 through S6 delivered",
              "### M3 — Planning & Private Area: released, S1 through S7 delivered",
          )
          replace_once(
              "docs/ROADMAP.md",
              "Delivered are **M3-S1 Wish Foundation**, **M3-S2 Plan + Wish->Plan**, **M3-S3 Place Foundation**, **M3-S4 typed Content Relations**, **M3-S5 Chapter**, and **M3-S6 Shared Collections**. The next runtime slice is **M3-S7 — PrivateNote + GiftIdea**.",
              "Delivered are **M3-S1 Wish Foundation**, **M3-S2 Plan + Wish->Plan**, **M3-S3 Place Foundation**, **M3-S4 typed Content Relations**, **M3-S5 Chapter**, **M3-S6 Shared Collections**, and **M3-S7 PrivateNote + GiftIdea**. The next runtime slice is **M3-S8 — PrivateCollection**.",
          )

          replace_once(
              "docs/m3/DELIVERY-PLAN.md",
              "**Status:** S0 complete; runtime released; S1 through S6 delivered",
              "**Status:** S0 complete; runtime released; S1 through S7 delivered",
          )
          replace_once(
              "docs/m3/DELIVERY-PLAN.md",
              "## 10. S7 – PrivateNote + GiftIdea",
              "## 10. S7 – PrivateNote + GiftIdea – delivered",
          )
          replace_once(
              "docs/m3/DELIVERY-PLAN.md",
              "- partner negative tests.\n\n## 11. S8 – PrivateCollection",
              "- partner negative tests.\n\nImplemented. PrivateNote and GiftIdea use dedicated owner-only tables/services and derive Space, owner, and `OWNER_ONLY` on the server. Protected content remains behind `ProtectedPayload`; list cursors are bound to Space and owner before pagination. Both roots use `If-Match`/409. GiftIdea starts in `IDEA` and enforces the decided `IDEA | BOUGHT | GIVEN` transition graph, including rejection of `GIVEN -> IDEA`. GiftIdea URLs are inert stored content and trigger no server fetch or preview. Unknown, partner-owned, and foreign-Space IDs are privacy-safe 404s, private content and structural state stay out of persistent event payloads, and PostgreSQL/HTTP tests cover owner CRUD, partner/Cross-Tenant isolation, concurrency, lifecycle transitions, and the no-network URL invariant. OpenAPI and generated TypeScript/Kotlin clients are synchronized.\n\n## 11. S8 – PrivateCollection",
          )
          PY

      - name: Commit living status updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/IMPLEMENTATION-STATUS.md docs/ROADMAP.md docs/m3/DELIVERY-PLAN.md
          git diff --cached --check
          git commit -m 'docs(m3): mark S7 delivered and advance to S8 (#257)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
