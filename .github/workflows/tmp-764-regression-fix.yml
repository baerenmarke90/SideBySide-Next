name: Temporary 764 regression fix

on:
  push:
    branches:
      - fix/693-explicit-space-choice-final

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK 37.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Apply regression-test updates
        run: |
          set -euo pipefail
          git apply .tmp-764-regression-tests.patch
          git rm .tmp-764-regression-tests.patch .github/workflows/tmp-764-regression-fix.yml
          git diff --check

      - name: Full Android unit suite
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:testDebugUnitTest

      - name: Commit validated regression updates
        run: |
          set -euo pipefail
          git config user.name "SideBySide CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/test/java/de/sidebyside/next/activity/ActivityTest.kt \
                  android/app/src/test/java/de/sidebyside/next/privatearea/PrivateNoteTest.kt \
                  android/app/src/test/java/de/sidebyside/next/reference/SpaceOffboardingTest.kt
          git commit -m "test(android): make Space-context fixtures explicit"
          git push origin HEAD:fix/693-explicit-space-choice-final
