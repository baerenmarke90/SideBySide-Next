name: M5 Space Context Patch

on:
  push:
    branches:
      - feat/298-m5-web-space-context

permissions:
  contents: write

jobs:
  patch:
    name: Apply Space context wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/298-m5-web-space-context
          fetch-depth: 0

      - name: Wire authenticated Space context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("web/src/App.tsx")
          app = app_path.read_text(encoding="utf-8")
          import_anchor = "import { normalizeClientError } from './client/problemDetails';\n"
          import_replacement = import_anchor + "import {\n  loadAuthorizedMemberships,\n  resolveActiveSpaceId,\n} from './client/spaceContext';\n"
          if "./client/spaceContext" not in app:
              app = app.replace(import_anchor, import_replacement, 1)

          gate = r'''
          function SpaceContextGate({
            loading,
            error,
            onRetry,
          }: {
            loading: boolean;
            error: Error | null;
            onRetry: () => void;
          }) {
            const { t } = useTranslation();
            return (
              <main className="setup-shell">
                <div className="entry-aura entry-aura-start" aria-hidden="true" />
                <div className="entry-aura entry-aura-end" aria-hidden="true" />
                <section className="setup-card" aria-labelledby="space-context-heading">
                  <Brand
                    suffix={<span className="brand-suffix">{t('brand.suffix')}</span>}
                  />
                  <div className="setup-content">
                    <p className="eyebrow">{t('spaceContext.eyebrow')}</p>
                    {loading ? (
                      <UiState kind="loading" title={t('spaceContext.loading')} />
                    ) : error ? (
                      <ProblemState error={error} onRetry={onRetry} />
                    ) : (
                      <>
                        <h1 id="space-context-heading">{t('spaceContext.emptyTitle')}</h1>
                        <p>{t('spaceContext.emptyBody')}</p>
                      </>
                    )}
                  </div>
                </section>
              </main>
            );
          }
          '''.strip("\n")
          app, gate_count = re.subn(
              r"function SetupNotice\(\) \{.*?\n\}\n\nfunction LoginScreen",
              gate + "\n\nfunction LoginScreen",
              app,
              count=1,
              flags=re.S,
          )
          if gate_count != 1 and "function SpaceContextGate" not in app:
              raise SystemExit("SetupNotice replacement anchor not found")

          app_component = r'''
          export function App() {
            const config = useMemo(loadReferenceClientConfig, []);
            const queryClient = useQueryClient();
            const [tokens, setTokens] = useState<TokenView | null>(null);
            const [spaceId, setSpaceId] = useState<string | null>(null);

            const membershipsQuery = useQuery({
              queryKey: ['account-memberships', tokens?.accessToken ?? 'signed-out'],
              queryFn: async () => {
                if (!tokens) return [];
                return loadAuthorizedMemberships(
                  config.apiBaseUrl,
                  tokens.accessToken,
                );
              },
              enabled: tokens !== null,
              retry: false,
            });

            useEffect(() => {
              if (!tokens || !membershipsQuery.data) {
                setSpaceId(null);
                return;
              }
              setSpaceId((current) =>
                resolveActiveSpaceId(membershipsQuery.data, current),
              );
            }, [membershipsQuery.data, tokens]);

            const loginMutation = useMutation({
              mutationFn: ({ email, password }: { email: string; password: string }) =>
                signIn(config.apiBaseUrl, email, password),
              onSuccess: (session) => {
                setSpaceId(null);
                setTokens(session.tokens);
                queryClient.clear();
              },
            });

            function logout() {
              setSpaceId(null);
              setTokens(null);
              queryClient.clear();
            }

            if (!tokens) {
              return (
                <>
                  <ThemeControl />
                  <LoginScreen
                    onLogin={(email, password) =>
                      loginMutation.mutate({ email, password })
                    }
                    pending={loginMutation.isPending}
                    error={loginMutation.error}
                  />
                </>
              );
            }

            if (membershipsQuery.isPending || membershipsQuery.error || !spaceId) {
              return (
                <>
                  <ThemeControl />
                  <SpaceContextGate
                    loading={membershipsQuery.isPending}
                    error={membershipsQuery.error}
                    onRetry={() => void membershipsQuery.refetch()}
                  />
                </>
              );
            }

            return (
              <AuthenticatedApp
                tokens={tokens}
                logout={logout}
                apiBaseUrl={config.apiBaseUrl}
                spaceId={spaceId}
              />
            );
          }
          '''.strip("\n") + "\n"
          app, app_count = re.subn(
              r"export function App\(\) \{.*\Z",
              app_component,
              app,
              count=1,
              flags=re.S,
          )
          if app_count != 1:
              raise SystemExit("App replacement anchor not found")
          app_path.write_text(app, encoding="utf-8")

          locale_path = Path("web/src/i18n/locales/de.ts")
          locale = locale_path.read_text(encoding="utf-8")
          replacement = """  spaceContext: {\n    eyebrow: 'Gemeinsamer Bereich',\n    loading: 'Euer gemeinsamer Bereich wird geladen …',\n    emptyTitle: 'Noch kein gemeinsamer Bereich',\n    emptyBody:\n      'Für dieses Konto ist noch kein aktiver gemeinsamer Bereich verbunden. Nimm eine Einladung an oder richte euren gemeinsamen Bereich ein.',\n  },\n  login:"""
          locale, locale_count = re.subn(
              r"  setup: \{.*?\n  \},\n  login:",
              replacement,
              locale,
              count=1,
              flags=re.S,
          )
          if locale_count != 1 and "spaceContext:" not in locale:
              raise SystemExit("setup locale replacement anchor not found")
          locale_path.write_text(locale, encoding="utf-8")
          PY

      - name: Commit Web wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/src/App.tsx web/src/i18n/locales/de.ts; then
            echo "Space context wiring is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx web/src/i18n/locales/de.ts
          git commit -m "feat(web): derive active Space from authenticated memberships"
          git push origin HEAD:feat/298-m5-web-space-context
