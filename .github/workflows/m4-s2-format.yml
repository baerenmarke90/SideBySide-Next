name: M4 S2 Format

on:
  push:
    branches: [feat/292-m4c-rules-occurrences-final]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
      SBS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/292-m4c-rules-occurrences-final
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Format M4-C-S2 backend diff
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen
          uv run --frozen ruff format \
            alembic/env.py \
            alembic/versions/0032_m4_rules_occurrences.py \
            src/sidebyside/api/v1/__init__.py \
            src/sidebyside/api/v1/rules.py \
            src/sidebyside/domain/events.py \
            src/sidebyside/engagement/models.py \
            src/sidebyside/engagement/service.py \
            src/sidebyside/jobs/runner.py \
            src/sidebyside/reminders/delivery.py \
            src/sidebyside/reminders/rules.py \
            src/sidebyside/reminders/runtime.py \
            src/sidebyside/reminders/runtime_models.py \
            src/sidebyside/reminders/service.py
      - name: Commit formatter output
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style(reminders): format M4-C-S2 backend"
          git push origin HEAD:feat/292-m4c-rules-occurrences-final
