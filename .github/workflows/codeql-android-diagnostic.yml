name: CodeQL Python diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-sarif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: python
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze without upload
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:python-diagnostic
          output: ${{ github.workspace }}/codeql-results
          upload: never

      - name: Print weak-sensitive-data-hashing flow
        shell: bash
        run: |
          jq -c '
            .runs[].results[]
            | select(.ruleId == "py/weak-sensitive-data-hashing")
            | {ruleId, message, locations, codeFlows}
          ' codeql-results/python.sarif
