name: Regenerate #870 OpenAPI

on:
  push:
    branches: [feat/870-wish-moment-continuation]

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[openapi-generated]') }}
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/870-wish-moment-continuation
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen

      - name: Write current OpenAPI contract
        working-directory: backend
        env:
          SBS_ENVIRONMENT: test
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Regenerate Web and Android clients
        run: tools/openapi/generate.sh

      - name: Commit generated contract and clients
        run: |
          git add backend/openapi.json web/src/api/generated android/api/generated
          if git diff --cached --quiet; then
            echo "Generated API artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(api): regenerate contract clients (#870) [openapi-generated]"
          git push origin HEAD:feat/870-wish-moment-continuation
