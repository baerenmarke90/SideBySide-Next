name: M4 Dashboard Query Bound

on:
  push:
    branches:
      - ops/280-dashboard-query-bound

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SBS_ENVIRONMENT: test
      SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
      SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
    steps:
      - name: Check out query-evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/280-dashboard-query-bound

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.7

      - name: Run bounded-query evidence
        run: |
          python -m pip install "uv==0.12.5"
          cd backend
          uv sync --frozen
          uv run --frozen alembic upgrade head
          uv run --frozen ruff check tests/integration/test_dashboard_performance.py
          uv run --frozen ruff format --check tests/integration/test_dashboard_performance.py
          uv run --frozen pytest -q tests/integration/test_dashboard_performance.py
