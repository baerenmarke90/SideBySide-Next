name: M4 S2 Wiring

on:
  push:
    branches: [feat/292-m4c-rules-occurrences-final]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/292-m4c-rules-occurrences-final
      - name: Wire M4-C runtime into existing infrastructure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_s: str, old: str, new: str) -> None:
              path = Path(path_s)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"pattern missing in {path_s}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          replace(
              'backend/src/sidebyside/engagement/models.py',
              'class NotificationKind(StrEnum):\n    COMMENT_CREATED = "COMMENT_CREATED"\n    THINKING_OF_YOU = "THINKING_OF_YOU"\n',
              'class NotificationKind(StrEnum):\n    COMMENT_CREATED = "COMMENT_CREATED"\n    THINKING_OF_YOU = "THINKING_OF_YOU"\n    REMINDER_DUE = "REMINDER_DUE"\n',
          )

          replace(
              'backend/src/sidebyside/engagement/service.py',
              'from sidebyside.relationship.models import Membership, MembershipStatus\n',
              'from sidebyside.relationship.models import Membership, MembershipStatus\n'
              'from sidebyside.reminders import delivery as reminder_delivery\n',
          )
          replace(
              'backend/src/sidebyside/engagement/service.py',
              '    if event_type is EventType.PARTNER_THINKING_OF_YOU:\n'
              '        thinking.project_notification(session, event)\n'
              '        push.ensure_deliveries_for_source_event(session, event.id)\n'
              '        return\n\n',
              '    if event_type is EventType.PARTNER_THINKING_OF_YOU:\n'
              '        thinking.project_notification(session, event)\n'
              '        push.ensure_deliveries_for_source_event(session, event.id)\n'
              '        return\n\n'
              '    if event_type is EventType.REMINDER_DUE:\n'
              '        reminder_delivery.project_notification(session, event)\n'
              '        push.ensure_deliveries_for_source_event(session, event.id)\n'
              '        return\n\n',
          )

          replace(
              'backend/alembic/env.py',
              'from sidebyside.reminders import models as _reminders  # noqa: F401\n',
              'from sidebyside.reminders import models as _reminders  # noqa: F401\n'
              'from sidebyside.reminders import runtime_models as _reminder_runtime  # noqa: F401\n',
          )

          replace(
              'backend/src/sidebyside/api/v1/__init__.py',
              '    reminders,\n    search,\n',
              '    reminders,\n    rules,\n    search,\n',
          )
          replace(
              'backend/src/sidebyside/api/v1/__init__.py',
              'router.include_router(reminders.router)\n',
              'router.include_router(reminders.router)\nrouter.include_router(rules.router)\n',
          )

          replace(
              'backend/src/sidebyside/jobs/runner.py',
              'from sidebyside.jobs.worker import run_once\n',
              'from sidebyside.jobs.worker import run_once\n'
              'from sidebyside.reminders import runtime as reminder_runtime\n',
          )
          replace(
              'backend/src/sidebyside/jobs/runner.py',
              '            media_cleanup.ensure_scheduled(session)\n',
              '            media_cleanup.ensure_scheduled(session)\n'
              '            reminder_runtime.ensure_scheduled(session)\n',
          )
          replace(
              'backend/src/sidebyside/jobs/runner.py',
              '    push_delivery.register_handlers()\n',
              '    push_delivery.register_handlers()\n'
              '    reminder_runtime.register_handlers()\n',
          )

          replace(
              'backend/src/sidebyside/reminders/service.py',
              'from sidebyside.reminders.models import (\n',
              'from sidebyside.reminders import runtime as reminder_runtime\n'
              'from sidebyside.reminders.models import (\n',
          )
          replace(
              'backend/src/sidebyside/reminders/service.py',
              '    _flush(session)\n    return ReminderView(reminder=reminder, offsets=normalized_offsets, muted=False)\n',
              '    _flush(session)\n'
              '    reminder_runtime.reconcile_reminder(session, reminder.id)\n'
              '    return ReminderView(reminder=reminder, offsets=normalized_offsets, muted=False)\n',
          )
          replace(
              'backend/src/sidebyside/reminders/service.py',
              '    _flush(session)\n    return ReminderView(\n        reminder=reminder,\n        offsets=normalized_offsets,\n',
              '    _flush(session)\n'
              '    reminder_runtime.reconcile_reminder(session, reminder.id)\n'
              '    return ReminderView(\n        reminder=reminder,\n        offsets=normalized_offsets,\n',
          )
          replace(
              'backend/src/sidebyside/reminders/service.py',
              '    _flush(session)\n    return ReminderView(\n        reminder=reminder,\n        offsets=_offsets(session, reminder.id),\n        muted=muted,\n',
              '    _flush(session)\n'
              '    reminder_runtime.reconcile_reminder(session, reminder.id)\n'
              '    return ReminderView(\n        reminder=reminder,\n        offsets=_offsets(session, reminder.id),\n        muted=muted,\n',
          )
          PY
          git diff --check
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "feat(reminders): wire M4-C runtime through M4-B and worker"
          git push origin HEAD:feat/292-m4c-rules-occurrences-final
