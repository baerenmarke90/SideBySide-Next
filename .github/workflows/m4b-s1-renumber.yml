name: M4-B S1 Migration Renumber

on:
  push:
    branches:
      - ops/m4b-s1-renumber

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out M4-B S1 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/282-m4b-activity-notifications
          fetch-depth: 0

      - name: Renumber Activity/Notification migration after Search 0028
        run: |
          old=backend/alembic/versions/0028_m4_activity_notifications.py
          new=backend/alembic/versions/0029_m4_activity_notifications.py
          test -f "$old"
          test ! -e "$new"
          mv "$old" "$new"
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/alembic/versions/0029_m4_activity_notifications.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("Revision ID: 0028", "Revision ID: 0029", 1)
          text = text.replace("Revises: 0027", "Revises: 0028", 1)
          text = text.replace('revision = "0028"', 'revision = "0029"', 1)
          text = text.replace('down_revision = "0027"', 'down_revision = "0028"', 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit migration renumber
        run: |
          git add -A backend/alembic/versions
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(migrations): place M4-B S1 after Search"
          git push origin HEAD:feat/282-m4b-activity-notifications
