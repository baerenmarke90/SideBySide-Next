name: Temporary Android Account Localization Move

on:
  push:
    branches:
      - feat/644-android-account-deletion
    paths:
      - .github/workflows/temp-localize-644-android.yml

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Move localized copy into the localization-owned resource file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          strings = Path('android/app/src/main/res/values/strings.xml')
          text = strings.read_text()
          marker = '    <string name="account_settings_title">Account</string>'
          if marker in text:
              raise SystemExit('Account deletion strings already present')
          block = '''

    <!-- Account self-service deletion (#644). User-facing localized copy belongs in this file. -->
    <string name="account_settings_title">Account</string>
    <string name="account_settings_intro">Hier verwaltest du Aktionen, die dein persönliches SidebySide-Konto betreffen. Beziehung und gemeinsamer Bereich bleiben davon getrennt.</string>
    <string name="account_delete_danger_label">DANGER ZONE</string>
    <string name="account_delete_title">Konto löschen</string>
    <string name="account_delete_intro">Die Kontolöschung betrifft nur dein persönliches Konto. Sie ist nicht dasselbe wie den gemeinsamen Bereich zu verlassen oder eine Beziehung zu beenden.</string>
    <string name="account_delete_action">Konto löschen</string>
    <string name="account_delete_demo_unavailable">Kontolöschung ist in der Demo nicht verfügbar. Demo-Konten werden von der Demo-Umgebung verwaltet.</string>
    <string name="account_delete_consequences_title">Folgen der Kontolöschung</string>
    <string name="account_delete_consequences_intro">Prüfe diese Folgen, bevor du mit der endgültigen Bestätigung fortfährst.</string>
    <string name="account_delete_consequence_access">Dein Kontozugriff endet und aktive Sitzungen sowie Anmeldedaten werden widerrufen.</string>
    <string name="account_delete_consequence_private">Daten, die nur deinem Konto gehören, werden nach dem verbindlichen Lösch-Lifecycle entfernt.</string>
    <string name="account_delete_consequence_shared">Gemeinsame Historie folgt den bestehenden Aufbewahrungsregeln. Der gemeinsame Bereich oder die Beziehung wird dadurch nicht automatisch gelöscht.</string>
    <string name="account_delete_consequence_irreversible">Sobald der Server die Löschung angenommen hat, ist sie nicht mehr rückgängig zu machen. Die App muss für die weitere Bereinigung nicht geöffnet bleiben.</string>
    <string name="account_delete_export_first">Vorher Daten exportieren</string>
    <string name="account_delete_cancel">Abbrechen</string>
    <string name="account_delete_continue">Weiter</string>
    <string name="account_delete_confirmation_title">Kontolöschung bestätigen</string>
    <string name="account_delete_confirmation_intro">Diese Aktion kann nach der Annahme durch den Server nicht rückgängig gemacht werden.</string>
    <string name="account_delete_confirmation_instruction">Gib %1$s ein, um dein Konto endgültig zur Löschung freizugeben.</string>
    <string name="account_delete_confirmation_phrase">KONTO LÖSCHEN</string>
    <string name="account_delete_confirmation_label">Bestätigung</string>
    <string name="account_delete_confirmation_help">Die Eingabe muss genau mit dem angezeigten Text übereinstimmen.</string>
    <string name="account_delete_back">Zurück</string>
    <string name="account_delete_confirm_action">Konto endgültig löschen</string>
    <string name="account_delete_pending">Kontolöschung wird gestartet …</string>
'''
          closing = '</resources>\n'
          if not text.endswith(closing):
              raise SystemExit('Unexpected strings.xml ending')
          strings.write_text(text[:-len(closing)] + block + closing)
          PY
          rm android/app/src/main/res/values/account_deletion_strings.xml
          git diff --check
      - name: Remove temporary workflow and commit localization move
        shell: bash
        run: |
          git rm .github/workflows/temp-localize-644-android.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/values/strings.xml android/app/src/main/res/values/account_deletion_strings.xml
          git commit -m "fix(android): keep Account copy in localization resource"
          git push origin HEAD:feat/644-android-account-deletion

# Triggered explicitly after the workflow file was registered on the feature branch.
