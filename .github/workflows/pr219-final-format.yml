name: PR 219 final backend formatting

on:
  push:
    branches:
      - chore/214-backend-english-engineering
    paths:
      - .github/workflows/pr219-final-format.yml

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/214-backend-english-engineering
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend tooling
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Apply authoritative Ruff formatting
        working-directory: backend
        run: uv run --frozen ruff format src tests scripts alembic

      - name: Verify Ruff formatting
        working-directory: backend
        run: uv run --frozen ruff format --check src tests scripts alembic

      - name: Verify Ruff lint
        working-directory: backend
        run: uv run --frozen ruff check src tests scripts alembic

      - name: Verify engineering-language audit
        run: |
          python3 tools/ci/test_engineering_language_audit.py
          python3 tools/ci/engineering_language_audit.py

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/pr219-final-format.yml

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .github/workflows/pr219-final-format.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore(backend): apply authoritative Ruff formatting"
          git push origin HEAD:chore/214-backend-english-engineering
