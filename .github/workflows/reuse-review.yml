name: Reuse Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read

jobs:
  reuse-review:
    name: Reuse Review
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test status drift logic
        run: python3 tools/ci/test_status_drift.py

      - name: Test engineering-language audit
        run: python3 tools/ci/test_engineering_language_audit.py

      - name: Audit migrated engineering-language surfaces
        run: python3 tools/ci/engineering_language_audit.py

      - name: Check living status against GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/status_drift.py --online

      # Automated version bumps do not make a new reuse decision. The component
      # has already been selected; docs/REUSE-BEFORE-BUILD.md requires the
      # review for newly introduced substantial dependencies, not routine
      # maintenance. Dependabot also cannot provide the repository-specific PR
      # body, so enforcing this gate for it would create a permanent false fail.
      - name: Exempt automated dependency updates
        id: exemption
        shell: bash
        run: |
          set -euo pipefail

          if [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            echo "Automated dependency update from ${PR_AUTHOR}."
            echo "Reuse-before-build is not reviewed again."
            echo "exempt=true" >> "$GITHUB_OUTPUT"
          else
            echo "exempt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify documented reuse decision
        if: steps.exemption.outputs.exempt != 'true'
        shell: bash
        run: |
          set -euo pipefail

          body=${PR_BODY:-}

          relevant='- [x] Reuse review relevant'
          not_relevant='- [x] Reuse review not relevant'

          relevant_count=0
          not_relevant_count=0

          if grep -Fqi -- "$relevant" <<< "$body"; then
            relevant_count=1
          fi

          if grep -Fqi -- "$not_relevant" <<< "$body"; then
            not_relevant_count=1
          fi

          if [ $((relevant_count + not_relevant_count)) -ne 1 ]; then
            echo "The PR must select exactly one reuse-before-build decision."
            echo "Expected one of these lines:"
            echo "  - [x] Reuse review relevant"
            echo "  - [x] Reuse review not relevant"
            exit 1
          fi

          echo "Reuse-before-build decision is present."

      - name: Verify reuse documentation sections
        if: steps.exemption.outputs.exempt != 'true'
        shell: bash
        run: |
          set -euo pipefail

          body=${PR_BODY:-}

          grep -Fq '## Reuse-before-build' <<< "$body" || {
            echo "Section '## Reuse-before-build' is missing."
            exit 1
          }

          if grep -Fqi -- '- [x] Reuse review relevant' <<< "$body"; then
            grep -Fq '**Alternatives considered**' <<< "$body" || {
              echo "Relevant reuse review is missing 'Alternatives considered'."
              exit 1
            }
            grep -Fq '**Decision and rationale**' <<< "$body" || {
              echo "Relevant reuse review is missing 'Decision and rationale'."
              exit 1
            }
            grep -Fq '**Third-party components/providers**' <<< "$body" || {
              echo "Relevant reuse review is missing 'Third-party components/providers'."
              exit 1
            }
          else
            grep -Fq '**Rationale**' <<< "$body" || {
              echo "A 'not relevant' reuse decision requires a rationale."
              exit 1
            }
          fi

          echo "Required reuse documentation sections are present."

  profile-concurrency-fix:
    name: Profile Concurrency Fix
    if: github.event.pull_request.head.ref == 'feat/368-profile-contract-api' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/368-profile-contract-api

      - name: Apply deterministic patch
        run: python3 tools/ci/profile_identity_concurrency_fix.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Format and regenerate authoritative contract and clients
        run: |
          python -m pip install "uv==0.12.5"
          cd backend
          uv sync --frozen
          uv run --frozen ruff format \
            src/sidebyside/identity/models.py \
            src/sidebyside/profiles/service.py \
            src/sidebyside/api/v1/profiles.py \
            tests/integration/test_endpoint_matrix.py \
            tests/integration/test_profile_identity_api.py \
            alembic/versions/0035_profile_identity_version.py
          uv run --frozen ruff check \
            src/sidebyside/identity/models.py \
            src/sidebyside/profiles/service.py \
            src/sidebyside/api/v1/profiles.py \
            tests/integration/test_endpoint_matrix.py \
            tests/integration/test_profile_identity_api.py \
            alembic/versions/0035_profile_identity_version.py
          uv run --frozen python scripts/openapi_contract.py write
          cd ..
          tools/openapi/generate.sh

      - name: Commit final contract fix
        run: |
          git add backend android/api/generated web/src/api/generated docs/PROFILES.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(profile): add account-global optimistic concurrency"
          git push origin HEAD:feat/368-profile-contract-api
