name: Reuse Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  reuse-review:
    name: Reuse Review
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      # Automatisierte Versionsanhebungen treffen keine Reuse-Entscheidung. Die
      # Komponente ist bereits gewaehlt; docs/REUSE-BEFORE-BUILD.md verlangt die
      # Pruefung fuer neue umfangreiche Abhaengigkeiten, nicht fuer deren
      # Pflege. Dependabot kann den Beschreibungstext ausserdem nicht setzen,
      # der Gate wuerde dort dauerhaft und ohne fachlichen Gehalt rot bleiben.
      - name: Automatisierte Dependency-Updates sind ausgenommen
        id: exemption
        shell: bash
        run: |
          set -euo pipefail

          if [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            echo "Automatisiertes Dependency-Update von ${PR_AUTHOR}."
            echo "Reuse-before-build wird nicht erneut geprueft."
            echo "exempt=true" >> "$GITHUB_OUTPUT"
          else
            echo "exempt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse-Entscheidung ist dokumentiert
        if: steps.exemption.outputs.exempt != 'true'
        shell: bash
        run: |
          set -euo pipefail

          body=${PR_BODY:-}

          relevant='- [x] Reuse review relevant'
          not_relevant='- [x] Reuse review not relevant'

          relevant_count=0
          not_relevant_count=0

          if grep -Fqi -- "$relevant" <<< "$body"; then
            relevant_count=1
          fi

          if grep -Fqi -- "$not_relevant" <<< "$body"; then
            not_relevant_count=1
          fi

          if [ $((relevant_count + not_relevant_count)) -ne 1 ]; then
            echo "Der PR muss genau eine Reuse-before-build-Entscheidung markieren."
            echo "Erwartet wird eine der beiden Zeilen:"
            echo "  - [x] Reuse review relevant"
            echo "  - [x] Reuse review not relevant"
            exit 1
          fi

          echo "Reuse-before-build-Entscheidung ist vorhanden."

      - name: Begruendungsabschnitte sind vorhanden
        if: steps.exemption.outputs.exempt != 'true'
        shell: bash
        run: |
          set -euo pipefail

          body=${PR_BODY:-}

          grep -Fq '## Reuse-before-build' <<< "$body" || {
            echo "Abschnitt '## Reuse-before-build' fehlt."
            exit 1
          }

          if grep -Fqi -- '- [x] Reuse review relevant' <<< "$body"; then
            grep -Fq '**Gepruefte Alternativen**' <<< "$body" || {
              echo "Bei relevanter Reuse-Pruefung fehlt 'Gepruefte Alternativen'."
              exit 1
            }
            grep -Fq '**Entscheidung und Begruendung**' <<< "$body" || {
              echo "Bei relevanter Reuse-Pruefung fehlt 'Entscheidung und Begruendung'."
              exit 1
            }
            grep -Fq '**Drittkomponenten/Provider**' <<< "$body" || {
              echo "Bei relevanter Reuse-Pruefung fehlt 'Drittkomponenten/Provider'."
              exit 1
            }
          else
            grep -Fq '**Begruendung**' <<< "$body" || {
              echo "Bei 'nicht relevant' fehlt eine Begruendung."
              exit 1
            }
          fi

          echo "Erforderliche Reuse-Dokumentationsabschnitte sind vorhanden."
