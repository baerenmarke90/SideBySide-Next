name: Temporary format #905

on:
  push:
    branches:
      - fix/905-games-under-more
    paths:
      - .github/workflows/tmp-format-905.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/905-games-under-more
      - name: Install locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format browser spec
        working-directory: web
        run: npx biome format --write e2e/tests/floating-bottom-nav.spec.ts
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/tests/floating-bottom-nav.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(web): format #905 browser regression"
          git push origin HEAD:fix/905-games-under-more
