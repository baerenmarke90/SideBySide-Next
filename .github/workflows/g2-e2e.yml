name: G2 Client E2E

on:
  pull_request:
    paths:
      - ".github/workflows/g2-e2e.yml"
      - ".env.example"
      - "compose.yaml"
      - "backend/**"
      - "web/**"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-client-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  G2_E2E_ENABLED: "1"
  G2_E2E_API_BASE: http://127.0.0.1:8000
  G2_E2E_EMAIL: g2-e2e@example.invalid
  G2_E2E_PASSWORD: g2-e2e-password-only
  G2_E2E_BOOTSTRAP_TOKEN: g2-e2e-bootstrap-token-for-ci-only-0001

jobs:
  real-client-flow:
    name: Real Web and Android client flow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reuse self-hosted stack for the gate harness
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=g2-e2e-db-only/' .env
          printf '\nSBS_BOOTSTRAP_TOKEN=%s\n' "$G2_E2E_BOOTSTRAP_TOKEN" >> .env
          docker compose config --quiet

      - name: Start real API, worker, PostgreSQL and LocalMediaStore
        run: docker compose up -d --wait --wait-timeout 300

      - name: Bootstrap synthetic account and resolve its real space
        run: |
          payload=$(jq -nc \
            --arg email "$G2_E2E_EMAIL" \
            --arg password "$G2_E2E_PASSWORD" \
            --arg bootstrap "$G2_E2E_BOOTSTRAP_TOKEN" \
            '{displayName:"G2 E2E",email:$email,password:$password,bootstrapToken:$bootstrap,deviceName:"G2 setup",platform:"ci"}')

          response=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$G2_E2E_API_BASE/api/v1/auth/register")
          account_id=$(jq -r '.account.id // empty' <<< "$response")
          test -n "$account_id" || { echo "Bootstrap lieferte keine account.id."; exit 1; }

          space_id=$(docker compose exec -T postgres \
            psql -U sidebyside -d sidebyside -Atc \
            "select space_id from memberships where account_id = '$account_id' and status = 'ACTIVE' limit 1;")
          test -n "$space_id" || { echo "Kein aktiver Space fuer den synthetischen Account gefunden."; exit 1; }

          echo "G2_E2E_SPACE_ID=$space_id" >> "$GITHUB_ENV"
          echo "Synthetischer G2-Space ist bereit."

      - name: Web uses production S8/OpenAPI path against the real stack
        run: |
          set -o pipefail
          docker run --rm --network host \
            -e CI=true \
            -e VITE_G2_E2E_ENABLED=1 \
            -e VITE_G2_E2E_API_BASE="$G2_E2E_API_BASE" \
            -e VITE_G2_E2E_EMAIL="$G2_E2E_EMAIL" \
            -e VITE_G2_E2E_PASSWORD="$G2_E2E_PASSWORD" \
            -e VITE_G2_E2E_SPACE_ID="$G2_E2E_SPACE_ID" \
            -v "$PWD/web:/work" -w /work \
            node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90 \
            sh -c 'npm ci --ignore-scripts --no-audit --no-fund && npm test -- src/client/referenceFlow.e2e.test.ts --reporter=default' \
            | tee web/g2-web-e2e.log

      - name: Web E2E really ran and was not skipped
        run: |
          grep -Eq 'Tests[[:space:]]+1 passed' web/g2-web-e2e.log || {
            echo "Web-E2E-Ausgabe belegt keinen erfolgreich ausgefuehrten Test."
            cat web/g2-web-e2e.log
            exit 1
          }
          if grep -Eqi 'Tests[[:space:]].*skipped' web/g2-web-e2e.log; then
            echo "Web-E2E wurde uebersprungen."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Install Android SDK 37.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Android uses OkHttpReferenceApi against the same real stack
        working-directory: android
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          --tests de.sidebyside.next.reference.ReferenceFlowE2eTest

      - name: Android E2E really ran and was not skipped
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob(
              "android/app/build/test-results/testDebugUnitTest/TEST-*ReferenceFlowE2eTest.xml"
          )
          if len(reports) != 1:
              raise SystemExit(f"Erwartet genau einen Android-E2E-Report, gefunden: {reports}")
          root = ET.parse(reports[0]).getroot()
          cases = root.findall(".//testcase")
          skipped = sum(case.find("skipped") is not None for case in cases)
          failures = sum(
              case.find("failure") is not None or case.find("error") is not None for case in cases
          )
          if not cases:
              raise SystemExit("Kein Android-E2E-Test gelaufen.")
          if skipped or failures:
              raise SystemExit(f"Android-E2E: {skipped} skipped, {failures} failed.")
          print(f"Android-E2E: {len(cases)} realer Test erfolgreich.")
          PY

      - name: Logs on failure
        if: failure()
        run: docker compose logs api worker postgres

      - name: Tear down the isolated gate stack
        if: always()
        run: |
          rm -f web/g2-web-e2e.log
          docker compose down -v
