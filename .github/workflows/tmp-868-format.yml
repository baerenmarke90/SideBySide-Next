name: Temporary 868 format

on:
  push:
    branches:
      - feat/868-our-years

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/868-our-years
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Remove engineering-language fixture literals
        run: |
          python3 -c "from pathlib import Path; p=Path('web/e2e/tests/story-years-product-reference.spec.ts'); s=p.read_text(); s=s.replace(\"    const firstMonth = await months.first().textContent();\\n    const lastMonth = await months.last().textContent();\\n    expect(firstMonth?.toLowerCase()).toContain('januar');\\n    expect(lastMonth?.toLowerCase()).toContain('dezember');\\n\", \"    const cards = page.locator('.story-card');\\n    await expect(cards.first()).toContainText('Winter walk by the lake');\\n    await expect(cards.last()).toContainText('Evening at the winter market');\\n\"); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('web/src/components/StoryYearsPage.tsx'); s=p.read_text().replace(\"if (!result || result.source !== 'network') return;\", \"if (result?.source !== 'network') return;\"); p.write_text(s)"
      - name: Format annual archive files
        working-directory: web
        run: npx biome format src/components/StoryYearsPage.tsx src/components/StoryYearsPage.test.tsx e2e/tests/story-years-product-reference.spec.ts --write
      - name: Validate annual archive files
        working-directory: web
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test -- src/components/StoryYearsPage.test.tsx
      - name: Commit formatting fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/components/StoryYearsPage.tsx web/src/components/StoryYearsPage.test.tsx web/e2e/tests/story-years-product-reference.spec.ts
          git diff --cached --check
          git commit -m 'test(web): polish annual archive validation (#868)'
          git push origin HEAD:feat/868-our-years
