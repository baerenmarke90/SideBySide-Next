name: Temporary PR98 Matrix Fix

on:
  push:
    branches:
      - feat/m2-comments-97

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.7'
      - name: Complete comment endpoint matrix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/integration/test_endpoint_matrix.py")
          text = path.read_text()

          endpoint_marker = 'Endpunkt("POST", "/api/v1/spaces/{spaceId}/memories/{memoryId}/comments"'
          if endpoint_marker not in text:
              anchor = '    Endpunkt("POST", "/api/v1/spaces/{spaceId}/attachments", body=ATTACHMENT),\n'
              if anchor not in text:
                  raise SystemExit("attachment endpoint anchor missing")
              block = '''    Endpunkt(
              "POST",
              "/api/v1/spaces/{spaceId}/memories/{memoryId}/comments",
              body=COMMENT,
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
          Endpunkt(
              "GET",
              "/api/v1/spaces/{spaceId}/memories/{memoryId}/comments",
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
          Endpunkt(
              "POST",
              "/api/v1/spaces/{spaceId}/heart-moments/{heartMomentId}/comments",
              body=COMMENT,
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
          Endpunkt(
              "GET",
              "/api/v1/spaces/{spaceId}/heart-moments/{heartMomentId}/comments",
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
          Endpunkt(
              "POST",
              "/api/v1/spaces/{spaceId}/milestones/{milestoneId}/comments",
              body=COMMENT,
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
          Endpunkt(
              "GET",
              "/api/v1/spaces/{spaceId}/milestones/{milestoneId}/comments",
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
          Endpunkt(
              "PATCH",
              "/api/v1/spaces/{spaceId}/comments/{commentId}",
              body=COMMENT,
              if_match=True,
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
          Endpunkt(
              "DELETE",
              "/api/v1/spaces/{spaceId}/comments/{commentId}",
              if_match=True,
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
          '''
              text = text.replace(anchor, block + anchor, 1)

          id_marker = '            "commentId": comment["id"],\n'
          if id_marker not in text:
              anchor = '            "milestoneId": milestone["id"],\n'
              if anchor not in text:
                  raise SystemExit("milestone fixture id anchor missing")
              text = text.replace(anchor, anchor + id_marker, 1)

          required = (
              "/memories/{memoryId}/comments",
              "/heart-moments/{heartMomentId}/comments",
              "/milestones/{milestoneId}/comments",
              "/comments/{commentId}",
              '"commentId": comment["id"]',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"matrix fix incomplete: {missing}")

          path.write_text(text)
          PY
      - name: Format and commit fix
        run: |
          python -m pip install 'uv==0.12.5'
          cd backend
          uv sync --frozen
          uv run --frozen ruff format tests/integration/test_endpoint_matrix.py
          uv run --frozen ruff check tests/integration/test_endpoint_matrix.py
          cd ..
          rm .github/workflows/pr98-matrix-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/integration/test_endpoint_matrix.py .github/workflows/pr98-matrix-fix.yml
          git commit -m 'test: complete comment tenant endpoint matrix'
          git push origin HEAD:feat/m2-comments-97
