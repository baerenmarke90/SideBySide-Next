name: Temporary 693 apply

on:
  push:
    branches:
      - fix/693-explicit-space-choice

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK 37.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Apply focused patch from current main
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout origin/main -- \
            android/app/src/main/java/de/sidebyside/next/invitation/AwaitingSpaceScreen.kt \
            android/app/src/main/java/de/sidebyside/next/reference/MainActivity.kt \
            android/app/src/main/java/de/sidebyside/next/reference/ReferenceViewModel.kt \
            android/app/src/test/java/de/sidebyside/next/reference/SpaceContextTest.kt
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/fix693.patch"
          git apply "$RUNNER_TEMP/fix693.patch"
          git rm .github/workflows/tmp-693-apply.yml
          git diff --check

      - name: Focused Space-context tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:testDebugUnitTest --tests de.sidebyside.next.reference.SpaceContextTest

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SideBySide CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            android/app/src/main/java/de/sidebyside/next/invitation/AwaitingSpaceScreen.kt \
            android/app/src/main/java/de/sidebyside/next/reference/MainActivity.kt \
            android/app/src/main/java/de/sidebyside/next/reference/ReferenceViewModel.kt \
            android/app/src/test/java/de/sidebyside/next/reference/SpaceContextTest.kt
          git commit -m "fix(android): require explicit multi-Space choice"
          git push origin HEAD:fix/693-explicit-space-choice
