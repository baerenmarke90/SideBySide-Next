name: OpenAPI Drift Artifact

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.number == 126
    name: Regenerate API Clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generierte API-Clients erzeugen
        run: tools/openapi/generate.sh

      - name: Generator-Ausgabe committen
        run: |
          git add android/api/generated web/src/api/generated
          if git diff --cached --quiet; then
            echo "Keine Generator-Aenderungen vorhanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(android): regenerate API clients for Story union"
          git push origin HEAD:fix/kotlin-story-union-119

      - name: Generator-Ausgabe sammeln
        if: always()
        run: |
          mkdir -p /tmp/openapi-generated
          cp -R android/api/generated /tmp/openapi-generated/android
          cp -R web/src/api/generated /tmp/openapi-generated/web
          git status --short -- \
            android/api/generated web/src/api/generated \
            > /tmp/openapi-generated/changed-files.txt || true

      - name: Generator-Ausgabe hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-generated-${{ github.event.pull_request.head.sha }}
          path: /tmp/openapi-generated
          if-no-files-found: error
          retention-days: 1
