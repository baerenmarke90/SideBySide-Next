name: Temporary 863 browser coverage

on:
  push:
    branches:
      - feat/863-slice-b-sofa-mode
    paths:
      - .github/workflows/tmp-863-browser-coverage.yml

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/863-slice-b-sofa-mode
      - name: Add focused browser regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/e2e/tests/floating-bottom-nav.spec.ts')
          text = p.read_text()
          marker = "  test('scroll clearance: Memory Create actions scroll fully clear of floating navigation', async ({\n"
          if marker not in text:
              raise SystemExit('browser insertion marker missing')
          test = r'''  test('Our Moments child route stays under More and reflows without exposing sparse counts', async ({
    page,
  }, testInfo) => {
    await page.setViewportSize({ width: 390, height: 844 });
    await installApiMocks(page);

    await page.route(`**/api/v1/spaces/${SPACE_ID}`, async (route) => {
      await route.fulfill({
        status: 200,
        contentType: 'application/json',
        body: JSON.stringify({
          id: SPACE_ID,
          createdAt: TEST_NOW,
          partners: [
            { id: ACCOUNT_ID, displayName: 'Anna' },
            {
              id: '44444444-4444-4444-8444-444444444444',
              displayName: 'Alex',
            },
          ],
        }),
      });
    });
    await page.route(
      `**/api/v1/spaces/${SPACE_ID}/games/moments/candidates`,
      async (route) => {
        await route.fulfill({
          status: 200,
          contentType: 'application/json',
          body: JSON.stringify({
            items: [
              {
                memoryId: '55555555-5555-4555-8555-555555555555',
                title: 'Shared memory A',
                effectiveDate: '2026-05-01',
                imageAttachmentId: '66666666-6666-4666-8666-666666666666',
              },
              {
                memoryId: '77777777-7777-4777-8777-777777777777',
                title: 'Shared memory B',
                effectiveDate: '2026-06-01',
                imageAttachmentId: '88888888-8888-4888-8888-888888888888',
              },
            ],
          }),
        });
      },
    );

    await page.goto('/login');
    await signIn(page);
    await page.waitForURL('**/today');
    await page.goto('/games/our-moments');

    await expect(
      page.getByRole('heading', {
        name: games.entries.moments.title,
        level: 1,
      }),
    ).toBeVisible();
    await expect(page.getByText(games.momentsGame.sparseTitle)).toBeVisible();

    const links = page.locator('.mobile-bottom-nav a.shell-nav-link');
    await expect(links.nth(3)).toHaveClass(/shell-nav-link-active/);
    await expect(links.nth(3)).toHaveAttribute('aria-current', 'page');

    const axe390 = await new AxeBuilder({ page })
      .include('.our-moments-page')
      .analyze();
    expect(axe390.violations).toEqual([]);
    await page.screenshot({
      path: testInfo.outputPath('our-moments-sparse-390.png'),
      fullPage: true,
    });

    await page.setViewportSize({ width: 320, height: 640 });
    await expectNoHorizontalOverflow(page);
    await expect(page.getByText(games.momentsGame.sparseTitle)).toBeVisible();
    const axe320 = await new AxeBuilder({ page })
      .include('.our-moments-page')
      .analyze();
    expect(axe320.violations).toEqual([]);
    await page.screenshot({
      path: testInfo.outputPath('our-moments-sparse-320.png'),
      fullPage: true,
    });
  });

'''
          p.write_text(text.replace(marker, test + marker, 1))
          PY
      - name: Install locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format browser spec
        working-directory: web
        run: npx biome format --write e2e/tests/floating-bottom-nav.spec.ts
      - name: Commit browser coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/tests/floating-bottom-nav.spec.ts
          git commit -m "test(web): cover Our Moments child-route reflow (#863)"
          git push origin HEAD:feat/863-slice-b-sofa-mode

# Triggered after workflow registration so the browser regression is committed.