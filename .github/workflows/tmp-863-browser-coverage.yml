name: Temporary 863 browser coverage

on:
  push:
    branches:
      - feat/863-slice-b-sofa-mode
    paths:
      - .github/workflows/tmp-863-browser-coverage.yml

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/863-slice-b-sofa-mode
      - name: Add focused browser regression
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Install locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format browser spec
        working-directory: web
        run: npx biome format --write e2e/tests/floating-bottom-nav.spec.ts
      - name: Commit browser coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/tests/floating-bottom-nav.spec.ts
          git commit -m "test(web): cover Our Moments child-route reflow (#863)"
          git push origin HEAD:feat/863-slice-b-sofa-mode
