name: M3-S6 Status Sync

on:
  push:
    branches:
      - feat/254-m3-s6-shared-collections
    paths:
      - .github/workflows/m3-s6-status-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Synchronize living M3 status documents
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "docs/IMPLEMENTATION-STATUS.md",
              "As of: August 27, 2026  ",
              "As of: August 30, 2026  ",
          )
          replace(
              "docs/IMPLEMENTATION-STATUS.md",
              "- [ ] **M3-S6 — Shared Collections:** next runtime slice according to the Delivery Plan. S7+ continues with PrivateNote, GiftIdea, and PrivateCollection.",
              "- [x] **M3-S6 — Shared Collections:** shared Collection + CollectionItem aggregate with collaborative writes; immutable server-derived `createdBy`; independent root structure/order and Item content versions; contiguous positions; append-on-create, transactional delete compaction, and atomic exact-set full-list reorder; Cross-Tenant fail-closed handling and real PostgreSQL reorder/create/delete/completion race coverage; Collection/Item titles remain out of event payloads. ShoppingList and persisted multi-select state remain outside S6.\n- [ ] **M3-S7 — PrivateNote + GiftIdea:** next runtime slice according to the Delivery Plan.",
          )
          replace(
              "docs/IMPLEMENTATION-STATUS.md",
              "M3-S6 **Shared Collections** according to the [M3 Delivery Plan](m3/DELIVERY-PLAN.md): Collection + CollectionItem, collaborative writes, separate root/item versioning, contiguous positions, atomic full-list reorder, delete compaction, and Cross-Tenant/Concurrency coverage. ShoppingList and persisted multi-select state remain outside S6.",
              "M3-S7 **PrivateNote + GiftIdea** according to the [M3 Delivery Plan](m3/DELIVERY-PLAN.md): separate owner-only tables/services and CRUD/List under `/spaces/{spaceId}/private/...`, ProtectedPayload content, GiftIdea lifecycle `IDEA | BOUGHT | GIVEN`, Privacy-safe 404 behavior, event/log redaction, and partner-negative coverage. PrivateCollection follows in S8.",
          )

          replace("docs/ROADMAP.md", "**Version:** 1.9  ", "**Version:** 2.0  ")
          replace(
              "docs/ROADMAP.md",
              "**Current:** M0, M1, and M2 are complete for their intended scope. **G1 and G2 have passed. M3 is released for implementation; S1 through S5 are delivered. The next runtime slice is M3-S6 — Shared Collections.** The binding current gate evidence is the [final G2 Gate Review](./reviews/2026-08-26-g2-final-gate-review.md).",
              "**Current:** M0, M1, and M2 are complete for their intended scope. **G1 and G2 have passed. M3 is released for implementation; S1 through S6 are delivered. The next runtime slice is M3-S7 — PrivateNote + GiftIdea.** The binding current gate evidence is the [final G2 Gate Review](./reviews/2026-08-26-g2-final-gate-review.md).",
          )
          replace(
              "docs/ROADMAP.md",
              "### M3 — Planning & Private Area: released, S1 through S5 delivered",
              "### M3 — Planning & Private Area: released, S1 through S6 delivered",
          )
          replace(
              "docs/ROADMAP.md",
              "Delivered are **M3-S1 Wish Foundation**, **M3-S2 Plan + Wish->Plan**, **M3-S3 Place Foundation**, **M3-S4 typed Content Relations**, and **M3-S5 Chapter**. The next runtime slice is **M3-S6 — Shared Collections**.",
              "Delivered are **M3-S1 Wish Foundation**, **M3-S2 Plan + Wish->Plan**, **M3-S3 Place Foundation**, **M3-S4 typed Content Relations**, **M3-S5 Chapter**, and **M3-S6 Shared Collections**. The next runtime slice is **M3-S7 — PrivateNote + GiftIdea**.",
          )

          replace(
              "docs/m3/DELIVERY-PLAN.md",
              "**Status:** S0 complete; runtime released; S1 through S5 delivered  ",
              "**Status:** S0 complete; runtime released; S1 through S6 delivered  ",
          )
          replace(
              "docs/m3/DELIVERY-PLAN.md",
              "## 9. S6 – Shared Collections",
              "## 9. S6 – Shared Collections – delivered",
          )
          replace(
              "docs/m3/DELIVERY-PLAN.md",
              "Not included: ShoppingList and persisted multi-select state.\n\n## 10. S7 – PrivateNote + GiftIdea",
              "Not included: ShoppingList and persisted multi-select state.\n\nImplemented. Collection CRUD/List and Item Create/Update/Delete are collaborative within the Space while `createdBy` remains immutable server attribution. The Collection root version protects root fields plus list structure/order; Item versions protect title/completed independently. Item Create appends, Item Delete compacts positions transactionally, and full-list Reorder is atomic under the root `If-Match` with a deferrable `(collection_id, position)` uniqueness constraint. Real PostgreSQL races cover competing Reorders and Reorder against Create/Delete/Completion; Cross-Tenant and foreign parent/item IDs fail closed. Collection and Item titles remain outside event payloads. ShoppingList and persisted multi-select state remain outside S6.\n\n## 10. S7 – PrivateNote + GiftIdea",
          )

      - name: Remove temporary status workflow and commit
        run: |
          git rm .github/workflows/m3-s6-status-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/IMPLEMENTATION-STATUS.md docs/ROADMAP.md docs/m3/DELIVERY-PLAN.md
          git diff --cached --check
          git commit -m 'docs(m3): mark S6 delivered and advance to S7 (#254)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
