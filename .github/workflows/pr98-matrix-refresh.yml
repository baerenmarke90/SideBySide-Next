name: Temporary PR98 Endpoint Matrix Refresh

on:
  push:
    branches:
      - feat/m2-comments-97

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.7'
      - name: Extend tenant endpoint matrix for comments
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/integration/test_endpoint_matrix.py')
          text = path.read_text()

          milestone = '''MILESTONE = {
              "title": "Matrix Milestone",
              "body": "Text",
              "happenedOn": "2025-06-13",
          }
          '''
          replacement = milestone + '''COMMENT = {"body": "Matrix Comment"}
          '''
          if 'COMMENT = {"body": "Matrix Comment"}' not in text:
              text = text.replace(milestone, replacement, 1)

          anchor = '''    Endpunkt(
              "DELETE",
              "/api/v1/spaces/{spaceId}/milestones/{milestoneId}",
              if_match=True,
              resource_absence="RESOURCE_NOT_FOUND",
          ),
          '''
          comments = anchor + '''    Endpunkt(
              "POST",
              "/api/v1/spaces/{spaceId}/memories/{memoryId}/comments",
              body=COMMENT,
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
              Endpunkt(
              "GET",
              "/api/v1/spaces/{spaceId}/memories/{memoryId}/comments",
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
              Endpunkt(
              "POST",
              "/api/v1/spaces/{spaceId}/heart-moments/{heartMomentId}/comments",
              body=COMMENT,
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
              Endpunkt(
              "GET",
              "/api/v1/spaces/{spaceId}/heart-moments/{heartMomentId}/comments",
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
              Endpunkt(
              "POST",
              "/api/v1/spaces/{spaceId}/milestones/{milestoneId}/comments",
              body=COMMENT,
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
              Endpunkt(
              "GET",
              "/api/v1/spaces/{spaceId}/milestones/{milestoneId}/comments",
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
              Endpunkt(
              "PATCH",
              "/api/v1/spaces/{spaceId}/comments/{commentId}",
              body=COMMENT,
              if_match=True,
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
              Endpunkt(
              "DELETE",
              "/api/v1/spaces/{spaceId}/comments/{commentId}",
              if_match=True,
              resource_absence="COMMENT_TARGET_NOT_AVAILABLE",
          ),
          '''
          if '/api/v1/spaces/{spaceId}/comments/{commentId}' not in text:
              text = text.replace(anchor, comments, 1)

          fixture_anchor = '''    milestone = client.post(f"{basis}/milestones", json=MILESTONE, headers=kopf).json()
              attachment = client.post(f"{basis}/attachments", json=ATTACHMENT, headers=kopf).json()
          '''
          fixture_replacement = '''    milestone = client.post(f"{basis}/milestones", json=MILESTONE, headers=kopf).json()
              comment = client.post(
                  f"{basis}/memories/{memory['id']}/comments", json=COMMENT, headers=kopf
              ).json()
              attachment = client.post(f"{basis}/attachments", json=ATTACHMENT, headers=kopf).json()
          '''
          if 'comment = client.post(' not in text:
              text = text.replace(fixture_anchor, fixture_replacement, 1)

          id_anchor = '''            "milestoneId": milestone["id"],
                  "attachmentId": attachment["attachment"]["id"],
          '''
          id_replacement = '''            "milestoneId": milestone["id"],
                  "commentId": comment["id"],
                  "attachmentId": attachment["attachment"]["id"],
          '''
          if '"commentId": comment["id"]' not in text:
              text = text.replace(id_anchor, id_replacement, 1)

          placeholder_anchor = '''            "milestoneId",
                  )
          '''
          placeholder_replacement = '''            "milestoneId",
                      "commentId",
                  )
          '''
          if '            "commentId",' not in text:
              text = text.replace(placeholder_anchor, placeholder_replacement, 1)

          delete_anchor = '''    if endpunkt.method == "DELETE":
                  nachher = welt["client"].get(pfad, headers=welt["kopf_owner"])
                  assert nachher.status_code == 200
          '''
          delete_replacement = '''    if endpunkt.method == "DELETE":
                  if "{commentId}" in endpunkt.template:
                      nachher = welt["client"].patch(
                          pfad,
                          json=COMMENT,
                          headers={**welt["kopf_owner"], "If-Match": '\"1\"'},
                      )
                      assert nachher.status_code == 200
                  else:
                      nachher = welt["client"].get(pfad, headers=welt["kopf_owner"])
                      assert nachher.status_code == 200
          '''
          text = text.replace(delete_anchor, delete_replacement, 1)

          path.write_text(text)
          PY
      - name: Format and commit matrix
        working-directory: backend
        run: |
          python -m pip install 'uv==0.12.5'
          uv sync --frozen
          uv run --frozen ruff format tests/integration/test_endpoint_matrix.py
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/integration/test_endpoint_matrix.py
          git commit -m 'test: cover comment endpoints in tenant matrix'
          git push origin HEAD:feat/m2-comments-97
