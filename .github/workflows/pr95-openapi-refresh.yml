name: Temporary PR95 OpenAPI Refresh

on:
  push:
    branches:
      - tmp/pr95-contract-build

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"

jobs:
  refresh-openapi:
    name: Refresh OpenAPI snapshot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen
      - name: Generate OpenAPI snapshot
        run: uv run --frozen python scripts/openapi_contract.py write
      - name: Commit generated snapshot when changed
        working-directory: .
        run: |
          if git diff --quiet -- backend/openapi.json; then
            echo "OpenAPI snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json
          git commit -m "chore: refresh OpenAPI snapshot for PR 95 validation"
          git push origin HEAD:tmp/pr95-contract-build
