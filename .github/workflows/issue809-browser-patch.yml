name: Issue 809 browser evidence patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/809-shared-story-summary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'

      - name: Apply bounded browser evidence edits
        run: python3 tools/issue809_browser_patch.py

      - name: Format web and e2e edits
        run: |
          cd web
          npm ci
          npm run format
          cd e2e
          npm ci
          npx prettier --write tests/product-reflow.spec.ts

      - name: Commit implementation and remove helper
        run: |
          rm tools/issue809_browser_patch.py .github/workflows/issue809-browser-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "test(web): cover #809 in browser reflow and axe"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
