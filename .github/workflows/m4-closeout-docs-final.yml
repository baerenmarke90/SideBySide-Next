name: M4 Closeout Docs Final

on:
  push:
    branches: [chore/292-m4-closeout-docs]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reapply prepared closeout patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/m4-closeout-docs.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/m4_closeout.py').write_text(script + '\n', encoding='utf-8')
          PY
          python3 /tmp/m4_closeout.py
          sed -i 's/delivered  $/delivered/' docs/m4/README.md docs/m4/DELIVERY-PLAN.md
          sed -i 's/pull request  $/pull request/' docs/m4/M4-EVIDENCE.md
          sed -i 's/August 30, 2026  $/August 30, 2026/' docs/m4/M4-EVIDENCE.md

      - name: Verify closeout diff
        run: |
          git diff --check
          test -s docs/m4/M4-EVIDENCE.md
          grep -q "M4 complete" docs/IMPLEMENTATION-STATUS.md
          grep -q "M5 — Client Completion & Parity" README.md

      - name: Commit prepared closeout docs
        run: |
          rm .github/workflows/m4-closeout-docs.yml \
             .github/workflows/m4-closeout-docs-fix.yml \
             .github/workflows/m4-closeout-docs-final.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(m4): record completed M4 evidence and status"
          git push origin "HEAD:${GITHUB_REF_NAME}"