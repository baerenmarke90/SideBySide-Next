name: Temporary #905 Games Under More Sync

on:
  push:
    branches:
      - fix/905-games-under-more

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[905-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/905-games-under-more
          fetch-depth: 0
      - name: Apply minimal Product Owner navigation correction
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              raw = p.read_bytes()
              newline = '\r\n' if b'\r\n' in raw else '\n'
              text = raw.decode('utf-8').replace('\r\n', '\n')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              updated = text.replace(old, new, count)
              p.write_bytes(updated.replace('\n', newline).encode('utf-8'))

          replace(
              'web/src/client/routes.ts',
              '/** Primary navigation. At most five destinations, in the documented order. */',
              '/** Stable top-level route registry. Primary shell destinations are derived below. */',
          )
          replace(
              'web/src/client/routes.ts',
              '] as const satisfies readonly AppRouteDefinition[];\n\nexport const DEFAULT_APP_ROUTE = APP_ROUTES[0].path;',
              "] as const satisfies readonly AppRouteDefinition[];\n\n/** Primary shell destinations. Games is intentionally discovered through More. */\nexport const PRIMARY_APP_ROUTES = APP_ROUTES.filter(\n  (route) => route.id !== 'games',\n);\n\nexport const DEFAULT_APP_ROUTE = APP_ROUTES[0].path;",
          )
          replace(
              'web/src/client/routes.ts',
              "  if (pathname === '/games' || pathname.startsWith('/games/')) return 'games';",
              "  if (pathname === '/games' || pathname.startsWith('/games/')) return 'more';",
          )

          replace(
              'web/src/components/AppShell.tsx',
              '  APP_ROUTES,\n',
              '  PRIMARY_APP_ROUTES,\n',
          )
          replace(
              'web/src/components/AppShell.tsx',
              '      {APP_ROUTES.map((route) => (',
              '      {PRIMARY_APP_ROUTES.map((route) => (',
          )

          replace(
              'web/src/components/MoreOverviewPage.tsx',
              "import {\n  MORE_COLLECTIONS_ROUTE,",
              "import {\n  appRoutePath,\n  MORE_COLLECTIONS_ROUTE,",
          )
          replace(
              'web/src/components/MoreOverviewPage.tsx',
              'const MORE_DESTINATIONS: readonly MoreDestination[] = [\n',
              "const MORE_DESTINATIONS: readonly MoreDestination[] = [\n  {\n    path: appRoutePath('games'),\n    icon: 'games',\n    titleKey: 'navigation.games',\n    descriptionKey: 'games.intro',\n  },\n",
          )

          css_path = Path('web/src/components/GamesProductArea.css')
          raw = css_path.read_bytes()
          newline = '\r\n' if b'\r\n' in raw else '\n'
          css = raw.decode('utf-8').replace('\r\n', '\n')
          start = css.find('/*\n * #902 expands the accepted compact shell')
          end = css.find('@media (max-width: 599px)', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate #902 compact-shell override')
          updated_css = css[:start] + css[end:]
          css_path.write_bytes(updated_css.replace('\n', newline).encode('utf-8'))

          replace(
              'web/src/client/routes.test.ts',
              '  APP_ROUTES,\n  CHAPTER_CREATE_ROUTE,',
              '  APP_ROUTES,\n  PRIMARY_APP_ROUTES,\n  CHAPTER_CREATE_ROUTE,',
          )
          replace(
              'web/src/client/routes.test.ts',
              "  it('carries exactly five destinations in the documented order', () => {\n    expect(APP_ROUTES.map((route) => route.id)).toEqual([\n      'today',\n      'story',\n      'plan',\n      'games',\n      'more',\n    ]);\n    expect(APP_ROUTES).toHaveLength(5);\n    expect(DEFAULT_APP_ROUTE).toBe('/today');\n  });",
              "  it('keeps four primary destinations while preserving the stable Games route', () => {\n    expect(PRIMARY_APP_ROUTES.map((route) => route.id)).toEqual([\n      'today',\n      'story',\n      'plan',\n      'more',\n    ]);\n    expect(PRIMARY_APP_ROUTES).toHaveLength(4);\n    expect(APP_ROUTES.map((route) => route.id)).toEqual([\n      'today',\n      'story',\n      'plan',\n      'games',\n      'more',\n    ]);\n    expect(DEFAULT_APP_ROUTE).toBe('/today');\n  });",
          )
          replace(
              'web/src/client/routes.test.ts',
              "  it('uses the fifth primary slot for Games and keeps Discover out of the shell', () => {\n    const paths: readonly string[] = APP_ROUTES.map((route) => route.path);\n    expect(paths).toContain('/games');\n    expect(paths).not.toContain('/discover');\n    expect(paths).toHaveLength(5);\n  });",
              "  it('keeps Games out of the primary shell while preserving its canonical route', () => {\n    const primaryPaths: readonly string[] = PRIMARY_APP_ROUTES.map(\n      (route) => route.path,\n    );\n    expect(primaryPaths).not.toContain('/games');\n    expect(primaryPaths).not.toContain('/discover');\n    expect(appRoutePath('games')).toBe('/games');\n  });",
          )
          replace(
              'web/src/client/routes.test.ts',
              "    expect(activeNavigationArea('/games')).toBe('games');\n    expect(activeNavigationArea('/games/our-moments')).toBe('games');",
              "    expect(activeNavigationArea('/games')).toBe('more');\n    expect(activeNavigationArea('/games/our-moments')).toBe('more');",
          )

          replace(
              'web/src/components/MoreOverviewPage.test.tsx',
              "  it('renders only secondary destinations without persistent header affordances (People, Places, Collections, Private Area)', () => {",
              "  it('renders Games with the other secondary destinations and omits persistent header affordances', () => {",
          )
          replace(
              'web/src/components/MoreOverviewPage.test.tsx',
              "    expect(html).toContain('href=\"/more/people\"');",
              "    expect(html).toContain('href=\"/games\"');\n    expect(html).toContain('href=\"/more/people\"');",
          )
          replace(
              'web/src/components/MoreOverviewPage.test.tsx',
              '    // Exactly 4 cards have matching structure: icon box + copy with title & description\n',
              '    // Exactly 5 cards have matching structure: icon box + copy with title & description\n',
          )
          for old, new in [
              ('expect(cardMatches).toHaveLength(4);', 'expect(cardMatches).toHaveLength(5);'),
              ('expect(iconMatches).toHaveLength(4);', 'expect(iconMatches).toHaveLength(5);'),
              ('expect(copyMatches).toHaveLength(4);', 'expect(copyMatches).toHaveLength(5);'),
          ]:
              replace('web/src/components/MoreOverviewPage.test.tsx', old, new)

          replace(
              'web/src/components/AppShell.test.tsx',
              "    expect(html).toContain('href=\"/games\"');",
              "    expect(html).not.toContain('href=\"/games\"');",
          )
          replace(
              'web/src/components/AppShell.test.tsx',
              "    for (const path of ['/today', '/story', '/plan', '/games', '/more']) {\n      expect(compact).toContain(`href=\"${path}\"`);\n    }",
              "    for (const path of ['/today', '/story', '/plan', '/more']) {\n      expect(compact).toContain(`href=\"${path}\"`);\n    }\n    expect(compact).not.toContain('href=\"/games\"');",
          )
          replace(
              'web/src/components/AppShell.test.tsx',
              "    ['/games', '/games'],\n    ['/games/our-moments', '/games'],",
              "    ['/games', '/more'],\n    ['/games/our-moments', '/more'],",
          )
          replace('web/src/components/AppShell.test.tsx', "    ['/story', '/games'],\n", '')
          replace(
              'web/src/components/AppShell.test.tsx',
              "  it('integrates Quick Create into floating bottom shell with five-destination navigation (#882/#902)', () => {",
              "  it('integrates Quick Create into floating bottom shell with four primary destinations (#882/#905)', () => {",
          )
          replace(
              'web/src/components/AppShell.test.tsx',
              '    // Navigation landmark has exactly the 5 primary product destinations.\n',
              '    // Navigation landmark has exactly the 4 primary product destinations.\n',
          )
          replace(
              'web/src/components/AppShell.test.tsx',
              '    expect(navLinks).toHaveLength(5);',
              '    expect(navLinks).toHaveLength(4);',
          )
          replace(
              'web/src/components/AppShell.test.tsx',
              "    expect(navContent).toContain('href=\"/games\"');\n    expect(navContent).toContain(`>${navigation.games}<`);\n",
              "    expect(navContent).not.toContain('href=\"/games\"');\n",
          )

          e2e = 'web/e2e/tests/floating-bottom-nav.spec.ts'
          replace(e2e, "test.describe('Floating Bottom Navigation (#882/#902)'", "test.describe('Floating Bottom Navigation (#882/#905)'")
          replace(e2e, "test('shell composition: five destinations + centered Quick Create action in one floating shell'", "test('shell composition: four destinations + centered Quick Create action in one floating shell'")
          replace(e2e, '    await expect(links).toHaveCount(5);', '    await expect(links).toHaveCount(4);', 2)
          replace(
              e2e,
              "      navigation.plan,\n      navigation.games,\n      navigation.more,",
              "      navigation.plan,\n      navigation.more,",
              2,
          )
          replace(
              e2e,
              '    // Quick Create remains between Planen and Spielen in the six-slot shell.\n    const planenBox = await links.nth(2).boundingBox();\n    const triggerBox = await trigger.boundingBox();\n    const spielenBox = await links.nth(3).boundingBox();\n    expect(planenBox).not.toBeNull();\n    expect(triggerBox).not.toBeNull();\n    expect(spielenBox).not.toBeNull();\n\n    if (planenBox && triggerBox && spielenBox) {\n      expect(planenBox.x + planenBox.width).toBeLessThanOrEqual(\n        triggerBox.x + 5,\n      );\n      expect(triggerBox.x + triggerBox.width).toBeLessThanOrEqual(\n        spielenBox.x + 5,\n      );\n    }',
              '    // Quick Create remains centered between Planen and Mehr in the five-slot shell.\n    const planenBox = await links.nth(2).boundingBox();\n    const triggerBox = await trigger.boundingBox();\n    const moreBox = await links.nth(3).boundingBox();\n    expect(planenBox).not.toBeNull();\n    expect(triggerBox).not.toBeNull();\n    expect(moreBox).not.toBeNull();\n\n    if (planenBox && triggerBox && moreBox) {\n      expect(planenBox.x + planenBox.width).toBeLessThanOrEqual(\n        triggerBox.x + 5,\n      );\n      expect(triggerBox.x + triggerBox.width).toBeLessThanOrEqual(\n        moreBox.x + 5,\n      );\n    }',
          )
          replace(
              e2e,
              "    await links.nth(3).click();\n    await waitForGamesHub(page);\n    await expect(links.nth(3)).toHaveClass(/shell-nav-link-active/);\n    await expect(links.nth(3)).toHaveAttribute('aria-current', 'page');\n\n    await links.nth(4).click();\n    await page.waitForURL('**/more');\n    await expect(links.nth(4)).toHaveClass(/shell-nav-link-active/);\n    await expect(links.nth(4)).toHaveAttribute('aria-current', 'page');",
              "    await links.nth(3).click();\n    await page.waitForURL('**/more');\n    await expect(links.nth(3)).toHaveClass(/shell-nav-link-active/);\n    await expect(links.nth(3)).toHaveAttribute('aria-current', 'page');\n\n    await page\n      .getByRole('link', { name: new RegExp(navigation.games) })\n      .click();\n    await waitForGamesHub(page);\n    await expect(links.nth(3)).toHaveClass(/shell-nav-link-active/);\n    await expect(links.nth(3)).toHaveAttribute('aria-current', 'page');",
          )
          replace(e2e, '    for (let index = 0; index < 5; index += 1) {', '    for (let index = 0; index < 4; index += 1) {')
          replace(
              e2e,
              '    const spielenBox = await links.nth(3).boundingBox();\n    expect(planenBox).not.toBeNull();\n    expect(triggerBox).not.toBeNull();\n    expect(spielenBox).not.toBeNull();\n    if (planenBox && triggerBox && spielenBox) {\n      expect(planenBox.x + planenBox.width).toBeLessThanOrEqual(\n        triggerBox.x + 1,\n      );\n      expect(triggerBox.x + triggerBox.width).toBeLessThanOrEqual(\n        spielenBox.x + 1,\n      );\n    }',
              '    const moreBox = await links.nth(3).boundingBox();\n    expect(planenBox).not.toBeNull();\n    expect(triggerBox).not.toBeNull();\n    expect(moreBox).not.toBeNull();\n    if (planenBox && triggerBox && moreBox) {\n      expect(planenBox.x + planenBox.width).toBeLessThanOrEqual(\n        triggerBox.x + 1,\n      );\n      expect(triggerBox.x + triggerBox.width).toBeLessThanOrEqual(\n        moreBox.x + 1,\n      );\n    }',
          )

          replace(
              'docs/decisions/0009-games-primary-navigation-and-premium-capability.md',
              '**Status:** Accepted  ',
              '**Status:** Accepted; primary-navigation placement superseded by Decision 0010 / #905  ',
          )
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web docs/decisions/0009-games-primary-navigation-and-premium-capability.md
          git commit -m "fix(web): move Games under More (#905) [905-sync]"
          git push origin HEAD:fix/905-games-under-more
