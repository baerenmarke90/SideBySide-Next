name: Web Browser QA

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-browser-qa.yml"

permissions:
  contents: read

concurrency:
  group: web-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright + axe
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit Web dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Install locked browser QA dependencies
        working-directory: web/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit browser QA dependencies
        working-directory: web/e2e
        run: npm audit --audit-level=high

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Install pinned Chromium runtime
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Browser E2E and accessibility gate
        working-directory: web/e2e
        run: npm test
