name: Temporary 673 plan schedule timezone fix v3

on:
  push:
    branches:
      - fix/673-android-plan-schedule-timezone

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK 37.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Apply #673 implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          vm_path = Path("android/app/src/main/java/de/sidebyside/next/reference/ReferenceViewModel.kt")
          vm = vm_path.read_text(encoding="utf-8")
          marker = "class ReferenceViewModel("
          helper = """internal fun planScheduleStart(
              day: java.time.LocalDate,
              time: java.time.LocalTime,
              zoneId: java.time.ZoneId,
          ): java.time.OffsetDateTime =
              day.atTime(time).atZone(zoneId).toOffsetDateTime()

          """
          if marker not in vm:
              raise SystemExit("ReferenceViewModel declaration context changed")
          vm = vm.replace(marker, helper + marker, 1)

          stale = """     * the time of day is the moment of scheduling, since no client in this
               * codebase asks for a time-of-day separately from a date.
          """
          fresh = """     * the selected date and time are resolved through the device's IANA
               * timezone rules for that local instant, including daylight-saving changes.
          """
          if stale not in vm:
              raise SystemExit("Plan schedule comment context changed")
          vm = vm.replace(stale, fresh, 1)

          schedule_pattern = re.compile(
              r"    fun schedulePlan\(planId: java\.util\.UUID, startOn: String\) \{.*?^    \}\n",
              re.MULTILINE | re.DOTALL,
          )
          schedule_replacement = """    fun schedulePlan(planId: java.util.UUID, startOn: String, startAt: String) {
              val day = parseHappenedOn(startOn) ?: return
              val time = runCatching { java.time.LocalTime.parse(startAt) }.getOrNull() ?: return
              val plan = _uiState.value.plans.firstOrNull { it.id == planId } ?: return
              val start = planScheduleStart(day, time, java.time.ZoneId.systemDefault())
              planningCall { api, spaceId, token ->
                  api.schedulePlan(spaceId, token, planId, plan.version, PlanSchedule(plannedStart = start))
              }
          }
          """
          vm, count = schedule_pattern.subn(schedule_replacement, vm, count=1)
          if count != 1:
              raise SystemExit(f"Expected one schedulePlan replacement, got {count}")
          segment = vm[vm.find("fun schedulePlan"):vm.find("fun unschedulePlan")]
          if "OffsetDateTime.now()" in segment:
              raise SystemExit("Submission-time clock still present in schedulePlan")
          vm_path.write_text(vm, encoding="utf-8")

          screen_path = Path("android/app/src/main/java/de/sidebyside/next/plan/PlanScreen.kt")
          screen = screen_path.read_text(encoding="utf-8")
          replacements = [
              ("onSchedule: (id: UUID, startOn: String) -> Unit,", "onSchedule: (id: UUID, startOn: String, startAt: String) -> Unit,"),
              ("var startOn by rememberSaveable(id) { mutableStateOf(\"\") }", "var startOn by rememberSaveable(id) { mutableStateOf(\"\") }\n        var startAt by rememberSaveable(id) { mutableStateOf(\"\") }"),
              ("plans.firstOrNull { it.id.toString() == id }?.let { onSchedule(it.id, startOn) }", "plans.firstOrNull { it.id.toString() == id }?.let { onSchedule(it.id, startOn, startAt) }"),
              ("enabled = !busy && startOn.isNotBlank(),", "enabled = !busy && startOn.isNotBlank() && startAt.isNotBlank(),"),
          ]
          for old, new in replacements:
              if old not in screen:
                  raise SystemExit(f"PlanScreen context changed: {old}")
              screen = screen.replace(old, new, 1)

          date_field_pattern = re.compile(
              r"(?P<field>^                    OutlinedTextField\(\n"
              r"                        value = startOn,\n"
              r"                        onValueChange = \{ startOn = it \},\n"
              r"                        label = \{ Text\(stringResource\(R\.string\.plan_schedule_date_hint\)\) \},\n"
              r"                        singleLine = true,\n"
              r"                        modifier = Modifier\.fillMaxWidth\(\),\n"
              r"                    \))",
              re.MULTILINE,
          )
          time_field = (
              "                    OutlinedTextField(\n"
              "                        value = startAt,\n"
              "                        onValueChange = { startAt = it },\n"
              "                        label = { Text(stringResource(R.string.plan_schedule_time_hint)) },\n"
              "                        singleLine = true,\n"
              "                        modifier = Modifier.fillMaxWidth(),\n"
              "                    )"
          )
          screen, count = date_field_pattern.subn(lambda m: m.group("field") + "\n" + time_field, screen, count=1)
          if count != 1:
              raise SystemExit(f"Expected one Plan schedule date field, got {count}")

          date_formatter = "    val dateFormat = DateTimeFormatter.ofLocalizedDate(FormatStyle.LONG).withLocale(locale)"
          if date_formatter not in screen:
              raise SystemExit("Plan date formatter context changed")
          screen = screen.replace(
              date_formatter,
              date_formatter + "\n    val dateTimeFormat =\n        DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG, FormatStyle.SHORT).withLocale(locale)",
              1,
          )
          display_pattern = re.compile(
              r"start\.atZoneSameInstant\(java\.time\.ZoneId\.systemDefault\(\)\)\.toLocalDate\(\)\s*\.format\(dateFormat\)"
          )
          screen, count = display_pattern.subn(
              "start.atZoneSameInstant(java.time.ZoneId.systemDefault()).format(dateTimeFormat)",
              screen,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected one Plan schedule display replacement, got {count}")
          screen_path.write_text(screen, encoding="utf-8")

          strings_path = Path("android/app/src/main/res/values/strings.xml")
          strings = strings_path.read_text(encoding="utf-8")
          date_string = '    <string name="plan_schedule_date_hint">Datum (JJJJ-MM-TT)</string>\n'
          if date_string not in strings:
              raise SystemExit("Plan schedule date string context changed")
          strings = strings.replace(
              date_string,
              date_string + '    <string name="plan_schedule_time_hint">Uhrzeit (HH:MM)</string>\n',
              1,
          )
          strings_path.write_text(strings, encoding="utf-8")

          planning_path = Path("android/app/src/test/java/de/sidebyside/next/plan/PlanningTest.kt")
          planning = planning_path.read_text(encoding="utf-8")
          import_anchor = "import de.sidebyside.next.reference.ReferenceViewModel\n"
          if import_anchor not in planning:
              raise SystemExit("PlanningTest import context changed")
          planning = planning.replace(import_anchor, import_anchor + "import de.sidebyside.next.reference.planScheduleStart\n", 1)
          if "import java.time.LocalDate\n" not in planning:
              raise SystemExit("PlanningTest LocalDate import context changed")
          planning = planning.replace(
              "import java.time.LocalDate\n",
              "import java.time.LocalDate\nimport java.time.LocalTime\nimport java.time.ZoneId\nimport java.time.ZoneOffset\n",
              1,
          )
          planning = planning.replace('model.schedulePlan(PLAN, "2026-09-20")', 'model.schedulePlan(PLAN, "2026-09-20", "18:30")')
          planning = planning.replace('model.schedulePlan(PLAN, "not a date")', 'model.schedulePlan(PLAN, "not a date", "18:30")')
          old_assert = """        assertEquals(listOf(7), api.scheduleVersions)
                  assertEquals(LocalDate.of(2026, 9, 20), api.schedules.single().plannedStart.toLocalDate())
                  assertTrue(api.completions.isEmpty())
          """
          new_assert = """        assertEquals(listOf(7), api.scheduleVersions)
                  val scheduledStart = api.schedules.single().plannedStart
                  assertEquals(LocalDate.of(2026, 9, 20), scheduledStart.toLocalDate())
                  assertEquals(LocalTime.of(18, 30), scheduledStart.toLocalTime())
                  assertTrue(api.completions.isEmpty())
          """
          if old_assert not in planning:
              raise SystemExit("Planning schedule assertion context changed")
          planning = planning.replace(old_assert, new_assert, 1)
          insert_before = """    @Test
              fun completingRecordsTheDayItActuallyHappened() = runTest(dispatcher) {
          """
          added_tests = """    @Test
              fun schedulingAnUnparseableTimeSendsNothing() = runTest(dispatcher) {
                  val api = PlanningApi(plans = listOf(aPlan(PlanStatus.IDEA)))
                  val model = signedIn(api)

                  model.loadPlanning()
                  advanceUntilIdle()
                  model.schedulePlan(PLAN, "2026-09-20", "not a time")
                  advanceUntilIdle()

                  assertTrue(api.schedules.isEmpty())
              }

              @Test
              fun selectedScheduleUsesTimezoneRulesForTheSelectedDate() {
                  val zone = ZoneId.of("Europe/Berlin")
                  val time = LocalTime.of(18, 30)

                  val summer = planScheduleStart(LocalDate.of(2026, 9, 20), time, zone)
                  val winter = planScheduleStart(LocalDate.of(2026, 12, 20), time, zone)

                  assertEquals(time, summer.toLocalTime())
                  assertEquals(time, winter.toLocalTime())
                  assertEquals(ZoneOffset.ofHours(2), summer.offset)
                  assertEquals(ZoneOffset.ofHours(1), winter.offset)
              }

          """
          if insert_before not in planning:
              raise SystemExit("PlanningTest insertion context changed")
          planning = planning.replace(insert_before, added_tests + insert_before, 1)
          if 'schedulePlan(PLAN, "2026-09-20")' in planning or 'schedulePlan(PLAN, "not a date")' in planning:
              raise SystemExit("Old two-argument schedulePlan calls remain in PlanningTest")
          planning_path.write_text(planning, encoding="utf-8")

          screen_test_path = Path("android/app/src/test/java/de/sidebyside/next/plan/PlanScreenTest.kt")
          screen_test = screen_test_path.read_text(encoding="utf-8")
          if "import androidx.compose.ui.test.assertIsEnabled\n" not in screen_test:
              raise SystemExit("PlanScreenTest assert import context changed")
          screen_test = screen_test.replace(
              "import androidx.compose.ui.test.assertIsEnabled\n",
              "import androidx.compose.ui.test.assertExists\nimport androidx.compose.ui.test.assertIsEnabled\n",
              1,
          )
          if "import java.time.OffsetDateTime\n" not in screen_test:
              raise SystemExit("PlanScreenTest time import context changed")
          screen_test = screen_test.replace(
              "import java.time.OffsetDateTime\n",
              "import java.time.OffsetDateTime\nimport java.time.ZoneId\nimport java.time.format.DateTimeFormatter\nimport java.time.format.FormatStyle\nimport java.util.TimeZone\n",
              1,
          )
          test_pattern = re.compile(
              r"    @Test\n    fun schedulingRequiresADateBeforeSubmitEnablesAndSendsIt\(\) \{.*?^    \}\n\n",
              re.MULTILINE | re.DOTALL,
          )
          test_replacement = """    @Test
              fun schedulingRequiresDateAndTimeBeforeSubmitEnablesAndSendsBoth() {
                  val plan = aPlan(PlanStatus.IDEA)
                  var scheduled: Triple<UUID, String, String>? = null
                  render(
                      plans = listOf(plan),
                      onSchedule = { id, startOn, startAt -> scheduled = Triple(id, startOn, startAt) },
                  )

                  composeRule.onNodeWithText(context.getString(R.string.plan_schedule))
                      .performScrollTo()
                      .performClick()
                  composeRule.onNodeWithText(context.getString(R.string.plan_schedule_confirm))
                      .assertIsNotEnabled()

                  composeRule.onNodeWithText(context.getString(R.string.plan_schedule_date_hint))
                      .performTextInput("2026-09-20")
                  composeRule.onNodeWithText(context.getString(R.string.plan_schedule_confirm))
                      .assertIsNotEnabled()

                  composeRule.onNodeWithText(context.getString(R.string.plan_schedule_time_hint))
                      .performTextInput("18:30")
                  composeRule.onNodeWithText(context.getString(R.string.plan_schedule_confirm))
                      .assertIsEnabled()
                      .performClick()

                  assertEquals(Triple(plan.id, "2026-09-20", "18:30"), scheduled)
              }

              @Test
              fun scheduledPlanShowsThePersistedLocalDateAndTime() {
                  val previousZone = TimeZone.getDefault()
                  try {
                      TimeZone.setDefault(TimeZone.getTimeZone("Europe/Berlin"))
                      val plan = aPlan(PlanStatus.PLANNED).copy(
                          plannedStart = OffsetDateTime.parse("2026-12-20T18:30:00+01:00"),
                      )
                      val locale = context.resources.configuration.locales[0]
                      val expected = plan.plannedStart!!
                          .atZoneSameInstant(ZoneId.systemDefault())
                          .format(
                              DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG, FormatStyle.SHORT)
                                  .withLocale(locale),
                          )

                      render(plans = listOf(plan))

                      composeRule.onNodeWithText(
                          context.getString(R.string.plan_scheduled_for, expected),
                      ).assertExists()
                  } finally {
                      TimeZone.setDefault(previousZone)
                  }
              }

          """
          screen_test, count = test_pattern.subn(test_replacement, screen_test, count=1)
          if count != 1:
              raise SystemExit(f"Expected one PlanScreen scheduling test replacement, got {count}")
          old_signature = "onSchedule: (UUID, String) -> Unit = { _, _ -> },"
          if old_signature not in screen_test:
              raise SystemExit("PlanScreenTest render callback context changed")
          screen_test = screen_test.replace(old_signature, "onSchedule: (UUID, String, String) -> Unit = { _, _, _ -> },", 1)
          screen_test_path.write_text(screen_test, encoding="utf-8")

          web_test_path = Path("web/src/client/sharedPlanning.test.ts")
          web_test = web_test_path.read_text(encoding="utf-8")
          web_old = "  dateFromInput,\n  dateOnlyInput,\n"
          if web_old not in web_test:
              raise SystemExit("sharedPlanning import context changed")
          web_test = web_test.replace(web_old, web_old + "  dateTimeFromInput,\n", 1)
          web_anchor = """  it('keeps date-only fields stable in UTC', () => {
              const value = dateFromInput('2026-08-31');
              expect(value?.toISOString()).toBe('2026-08-31T00:00:00.000Z');
              expect(dateOnlyInput(value)).toBe('2026-08-31');
            });

          """
          web_test_case = """  it('round-trips an explicit local Plan schedule date and time', () => {
              const value = dateTimeFromInput('2026-12-20T18:30');
              expect(value).toBeDefined();
              expect(localDateTimeInput(value)).toBe('2026-12-20T18:30');
            });

          """
          if web_anchor not in web_test:
              raise SystemExit("sharedPlanning date helper test context changed")
          web_test = web_test.replace(web_anchor, web_anchor + web_test_case, 1)
          web_test_path.write_text(web_test, encoding="utf-8")
          PY

          git rm .github/workflows/tmp-673-plan-schedule-timezone.yml \
                 .github/workflows/tmp-673-plan-schedule-timezone-v3.yml
          git diff --check

      - name: Web schedule parity test
        working-directory: web
        run: |
          npm ci
          npm test -- src/client/sharedPlanning.test.ts

      - name: Focused Android planning tests
        working-directory: android
        run: |
          ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:testDebugUnitTest \
            --tests de.sidebyside.next.plan.PlanningTest \
            --tests de.sidebyside.next.plan.PlanScreenTest

      - name: Full Android unit suite
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:testDebugUnitTest

      - name: Commit validated #673 implementation
        run: |
          set -euo pipefail
          git config user.name "SideBySide CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/de/sidebyside/next/reference/ReferenceViewModel.kt \
                  android/app/src/main/java/de/sidebyside/next/plan/PlanScreen.kt \
                  android/app/src/main/res/values/strings.xml \
                  android/app/src/test/java/de/sidebyside/next/plan/PlanningTest.kt \
                  android/app/src/test/java/de/sidebyside/next/plan/PlanScreenTest.kt \
                  web/src/client/sharedPlanning.test.ts
          git commit -m "fix(android): preserve explicit Plan schedule time and timezone"
          git push origin HEAD:fix/673-android-plan-schedule-timezone
