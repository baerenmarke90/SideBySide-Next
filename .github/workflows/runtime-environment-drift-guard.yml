name: Runtime Environment Drift Guard

on:
  pull_request:
    paths:
      - compose.yaml
      - .env.example
      - deploy/cloud-managed.env.example
      - deploy/persistent-development.env.example
      - scripts/check_runtime_environment.py
      - scripts/test_check_runtime_environment.py
      - backend/src/sidebyside/identity/deletion_bootstrap.py
      - docs/ACCOUNT-DELETION-SELF-HOSTED.md
      - docs/ARCANE.md
      - docs/SELF-HOSTING.md
      - docs/m6/CLOUD-MANAGED-ACCOUNT-DELETION-AUTHORITY.md
      - .github/workflows/runtime-environment-drift-guard.yml
  push:
    branches: [main]
    paths:
      - compose.yaml
      - .env.example
      - deploy/cloud-managed.env.example
      - deploy/persistent-development.env.example
      - scripts/check_runtime_environment.py
      - scripts/test_check_runtime_environment.py
      - backend/src/sidebyside/identity/deletion_bootstrap.py
      - docs/ACCOUNT-DELETION-SELF-HOSTED.md
      - docs/ARCANE.md
      - docs/SELF-HOSTING.md
      - docs/m6/CLOUD-MANAGED-ACCOUNT-DELETION-AUTHORITY.md
      - .github/workflows/runtime-environment-drift-guard.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-environment:
    name: Render and runtime drift contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check_runtime_environment.py \
            scripts/test_check_runtime_environment.py \
            backend/src/sidebyside/identity/deletion_bootstrap.py
          python3 -m unittest scripts.test_check_runtime_environment

      - name: Account-deletion bootstrap guidance stays canonical
        run: |
          set -euo pipefail
          operator_surfaces=(
            .env.example
            deploy/cloud-managed.env.example
            deploy/persistent-development.env.example
            docs/SELF-HOSTING.md
            docs/ACCOUNT-DELETION-SELF-HOSTED.md
            docs/ARCANE.md
            docs/m6/CLOUD-MANAGED-ACCOUNT-DELETION-AUTHORITY.md
          )

          if grep -nE 'uuid\.uuid4|print\(uuid\.uuid4\(\)\)' "${operator_surfaces[@]}"; then
            echo 'Standalone UUID generation must not be documented for the Account-deletion authority.'
            exit 1
          fi

          for path in "${operator_surfaces[@]}"; do
            grep -Fq 'sidebyside.identity.deletion_bootstrap' "$path" || {
              echo "$path does not point operators at the explicit deletion-authority bootstrap."
              exit 1
            }
          done

          grep -Fq -- '--confirm-new-installation' docs/ACCOUNT-DELETION-SELF-HOSTED.md
          grep -Fq 'recovery failure' docs/ACCOUNT-DELETION-SELF-HOSTED.md

      - name: Arcane-style deletion authority render cannot drift from dotenv
        run: |
          set -euo pipefail
          cp .env.example .env-runtime-guard
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=runtime-guard-only/' .env-runtime-guard
          sed -i 's/^SBS_ACCOUNT_DELETION_INSTANCE_ID=.*/SBS_ACCOUNT_DELETION_INSTANCE_ID=11111111-2222-4333-8444-555555555555/' .env-runtime-guard

          python3 scripts/check_runtime_environment.py \
            --env-file .env-runtime-guard \
            --profile self-hosted

          if SBS_ACCOUNT_DELETION_INSTANCE_ID= \
            python3 scripts/check_runtime_environment.py \
              --env-file .env-runtime-guard \
              --profile self-hosted; then
            echo 'Runtime guard accepted an explicitly blank process override of the dotenv authority.'
            exit 1
          fi

          docker compose --profile self-hosted --env-file .env-runtime-guard config --format json \
            > /tmp/runtime-guard-compose.json
          jq -e '
            (.services.api.environment.SBS_ACCOUNT_DELETION_INSTANCE_ID == "11111111-2222-4333-8444-555555555555") and
            (.services.worker.environment.SBS_ACCOUNT_DELETION_INSTANCE_ID == "11111111-2222-4333-8444-555555555555") and
            (.services["demo-init"].environment.SBS_ACCOUNT_DELETION_INSTANCE_ID == "11111111-2222-4333-8444-555555555555")
          ' /tmp/runtime-guard-compose.json

      - name: Arcane Production source identity is immutable
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          short_revision=${revision:0:12}
          other_revision=0000000000000000000000000000000000000000
          repository=https://github.com/baerenmarke90/SideBySide-Next.git

          cp .env.example .env-production-source-guard
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=runtime-guard-only/' .env-production-source-guard
          sed -i 's/^SBS_ENVIRONMENT=.*/SBS_ENVIRONMENT=production/' .env-production-source-guard
          sed -i 's|^SBS_PUBLIC_BASE_URL=.*|SBS_PUBLIC_BASE_URL=https://production.example.invalid|' .env-production-source-guard
          sed -i 's/^SBS_ACCOUNT_DELETION_INSTANCE_ID=.*/SBS_ACCOUNT_DELETION_INSTANCE_ID=11111111-2222-4333-8444-555555555555/' .env-production-source-guard
          cat >>.env-production-source-guard <<EOF
          SBS_BACKEND_BUILD_CONTEXT=${repository}#${revision}:backend
          SBS_WEB_BUILD_CONTEXT=${repository}#${revision}:web
          SBS_BUILD_REVISION=${revision}
          EOF

          python3 scripts/check_runtime_environment.py \
            --env-file .env-production-source-guard \
            --profile self-hosted

          expect_rejected() {
            label=$1
            shift
            if env "$@" python3 scripts/check_runtime_environment.py \
              --env-file .env-production-source-guard \
              --profile self-hosted; then
              echo "Runtime guard accepted unsafe Production source identity: $label"
              exit 1
            fi
          }

          expect_rejected main \
            "SBS_BACKEND_BUILD_CONTEXT=${repository}#main:backend" \
            "SBS_WEB_BUILD_CONTEXT=${repository}#main:web" \
            "SBS_BUILD_REVISION=main"
          expect_rejected branch \
            "SBS_BACKEND_BUILD_CONTEXT=${repository}#release/test:backend" \
            "SBS_WEB_BUILD_CONTEXT=${repository}#release/test:web" \
            "SBS_BUILD_REVISION=release/test"
          expect_rejected tag \
            "SBS_BACKEND_BUILD_CONTEXT=${repository}#v1.0.0:backend" \
            "SBS_WEB_BUILD_CONTEXT=${repository}#v1.0.0:web" \
            "SBS_BUILD_REVISION=v1.0.0"
          expect_rejected short-sha \
            "SBS_BACKEND_BUILD_CONTEXT=${repository}#${short_revision}:backend" \
            "SBS_WEB_BUILD_CONTEXT=${repository}#${short_revision}:web" \
            "SBS_BUILD_REVISION=${short_revision}"
          expect_rejected blank-default \
            "SBS_BACKEND_BUILD_CONTEXT=" \
            "SBS_WEB_BUILD_CONTEXT=" \
            "SBS_BUILD_REVISION="
          expect_rejected backend-web-mismatch \
            "SBS_WEB_BUILD_CONTEXT=${repository}#${other_revision}:web"
          expect_rejected declared-revision-mismatch \
            "SBS_BUILD_REVISION=${other_revision}"

      - name: Production dotenv must carry the deletion authority
        run: |
          set -euo pipefail
          cp .env.example .env-production-guard
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=runtime-guard-only/' .env-production-guard
          sed -i 's/^SBS_ENVIRONMENT=.*/SBS_ENVIRONMENT=production/' .env-production-guard
          sed -i 's/^SBS_ACCOUNT_DELETION_INSTANCE_ID=.*/SBS_ACCOUNT_DELETION_INSTANCE_ID=/' .env-production-guard

          if python3 scripts/check_runtime_environment.py \
            --env-file .env-production-guard \
            --profile self-hosted; then
            echo 'Runtime guard accepted Production without an Account-deletion authority.'
            exit 1
          fi
