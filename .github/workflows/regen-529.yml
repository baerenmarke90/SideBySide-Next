name: Temporary OpenAPI regeneration for 529

on:
  push:
    branches: [feat/529-server-admin-operations]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/529-server-admin-operations
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install 'uv==0.12.5'
          uv sync --frozen

      - name: Regenerate authoritative OpenAPI contract
        working-directory: backend
        env:
          SBS_ENVIRONMENT: test
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Regenerate TypeScript and Kotlin clients
        run: tools/openapi/generate.sh

      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/openapi.json web/src/api/generated android/api/generated
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git commit -m 'chore(openapi): regenerate clients for server admin operations'
          git push origin HEAD:feat/529-server-admin-operations
