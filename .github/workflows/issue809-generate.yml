name: Issue 809 one-shot generation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'feat/809-shared-story-summary'
    runs-on: ubuntu-latest
    env:
      SBS_ENVIRONMENT: test
      UV_VERSION: '0.12.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'

      - name: Apply bounded source edits
        run: python3 tools/issue809_apply.py

      - name: Install locked backend environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          cd backend
          uv lock --check
          uv sync --frozen

      - name: Write authoritative OpenAPI contract
        working-directory: backend
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Regenerate OpenAPI clients
        run: tools/openapi/generate.sh

      - name: Format backend edits
        working-directory: backend
        run: uv run --frozen ruff format src tests scripts alembic

      - name: Format web edits
        working-directory: web
        run: |
          npm ci
          npm run format

      - name: Commit generated implementation and remove helper
        run: |
          rm tools/issue809_apply.py .github/workflows/issue809-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(web): render shared story summary and setting (#809)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
