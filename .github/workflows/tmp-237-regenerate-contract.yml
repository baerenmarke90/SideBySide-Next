name: Temporary #237 contract regeneration

on:
  push:
    branches: [tmp/237-generate-contract]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"
  SBS_ENVIRONMENT: test

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/237-generate-contract
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Regenerate authoritative OpenAPI snapshot
        working-directory: backend
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Regenerate API clients
        run: tools/openapi/generate.sh

      - name: Commit generated artifacts to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json web/src/api/generated android/api/generated
          git commit -m "chore(api): regenerate #237 contract artifacts"
          git push origin HEAD:tmp/237-generate-contract
