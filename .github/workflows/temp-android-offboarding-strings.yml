name: Temporary Android offboarding strings migration

on:
  push:
    branches:
      - feat/518-android-space-offboarding
    paths:
      - .github/workflows/temp-android-offboarding-strings.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Move offboarding strings into canonical Android resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          canonical = Path("android/app/src/main/res/values/strings.xml")
          source = Path("android/app/src/main/res/values/strings_space_offboarding.xml")
          text = canonical.read_text()
          extra = source.read_text()
          opening = "<resources>\n"
          closing = "</resources>"
          if opening not in extra or closing not in extra:
              raise SystemExit("unexpected offboarding strings resource shape")
          body = extra.split(opening, 1)[1].rsplit(closing, 1)[0].strip()
          if 'name="space_offboarding_title"' in text:
              raise SystemExit("offboarding strings already exist in canonical resource")
          if text.count(closing) != 1:
              raise SystemExit("canonical strings.xml must have exactly one closing resources tag")
          canonical.write_text(text.replace(closing, f"\n{body}\n{closing}", 1))
          source.unlink()
          PY

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-android-offboarding-strings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(android): keep offboarding copy in canonical resources"
          git push origin HEAD:${GITHUB_REF_NAME}
