name: M4-B-S2 Ready

on:
  push:
    branches:
      - feat/289-m4b-thinking-push

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 290 --repo baerenmarke90/SideBySide-Next
