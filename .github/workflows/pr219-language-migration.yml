name: PR 219 language migration

on:
  push:
    branches:
      - chore/214-backend-english-engineering
    paths:
      - tools/ci/pr219_language_codemod.py
      - tools/ci/pr219_language_cleanup.py
      - .github/workflows/pr219-language-migration.yml

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/214-backend-english-engineering
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend tooling
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Apply scoped engineering-language codemod
        run: |
          python3 tools/ci/pr219_language_codemod.py
          python3 tools/ci/pr219_language_cleanup.py

      - name: Format migrated backend surfaces
        working-directory: backend
        run: uv run --frozen ruff format src tests scripts alembic

      - name: Verify Python syntax
        run: python3 -m compileall -q backend/tests

      - name: Show concrete remaining prose markers
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "language_audit", "tools/ci/engineering_language_audit.py"
          )
          audit = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(audit)

          for path in audit.backend_files():
              if path.suffix != ".py":
                  continue
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if audit._contains_marker(line):
                      print(f"{path}:{number}: {line.strip()}")
          PY

      - name: Verify authoritative engineering-language audit
        run: python3 tools/ci/engineering_language_audit.py

      - name: Verify lint
        working-directory: backend
        run: uv run --frozen ruff check src tests scripts alembic

      - name: Remove temporary migration tooling
        run: |
          rm tools/ci/pr219_language_codemod.py
          rm tools/ci/pr219_language_cleanup.py
          rm .github/workflows/pr219-language-migration.yml

      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests tools/ci/pr219_language_codemod.py tools/ci/pr219_language_cleanup.py .github/workflows/pr219-language-migration.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore(tests): finish backend engineering language migration"
          git push origin HEAD:chore/214-backend-english-engineering
