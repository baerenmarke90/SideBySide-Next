name: Transfer Hardening Patch

on:
  push:
    branches: [feat/345-transfer-bundle]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/345-transfer-bundle
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen

      - name: Harden protected payload transfer
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/sidebyside/transfer/service.py")
          text = path.read_text()

          if "from pydantic import BaseModel\n" not in text:
              text = text.replace(
                  "from zipfile import ZIP_DEFLATED, ZipFile\n\nfrom sqlalchemy",
                  "from zipfile import ZIP_DEFLATED, ZipFile\n\nfrom pydantic import BaseModel\nfrom sqlalchemy",
              )

          text = text.replace(
              "    if isinstance(value, (UUID, datetime, date, time)):\n"
              "        return value.isoformat()\n",
              "    if isinstance(value, UUID):\n"
              "        return str(value)\n"
              "    if isinstance(value, (datetime, date, time)):\n"
              "        return value.isoformat()\n",
              1,
          )

          json_marker = "    if isinstance(value, Mapping):\n"
          if "    if isinstance(value, BaseModel):\n" not in text:
              if json_marker not in text:
                  raise SystemExit("JSON conversion marker not found")
              text = text.replace(
                  json_marker,
                  "    if isinstance(value, BaseModel):\n"
                  "        return _json_value(value.model_dump(mode=\"json\"))\n"
                  + json_marker,
                  1,
              )

          column_marker = "    if python_type is UUID and not isinstance(value, UUID):\n"
          if "issubclass(python_type, BaseModel)" not in text:
              if column_marker not in text:
                  raise SystemExit("column conversion marker not found")
              text = text.replace(
                  column_marker,
                  "    if isinstance(python_type, type) and issubclass(python_type, BaseModel):\n"
                  "        return python_type.model_validate(value)\n"
                  + column_marker,
                  1,
              )

          if "reminder_target_table = generated_sources.get(source_type)" not in text:
              text, count = re.subn(
                  r"(?m)^(\s*)target_table = generated_sources\.get\(source_type\)$",
                  r"\1reminder_target_table = generated_sources.get(source_type)",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"reminder target assignment matches: {count}")
              marker = "ids.get(target_table, set())"
              pos = text.find("reminder_target_table = generated_sources.get(source_type)")
              relation_pos = text.find(marker, pos)
              if relation_pos < 0:
                  raise SystemExit("reminder target relation marker missing")
              text = (
                  text[:relation_pos]
                  + "ids.get(reminder_target_table, set())"
                  + text[relation_pos + len(marker):]
              )

          if "for transfer_export in exports:" not in text:
              text, count = re.subn(
                  r"(?m)^(\s*)for transfer in exports:\n"
                  r"\1    store\.delete\(export_storage_key\(transfer\)\)\n"
                  r"\1    transfer\.status = ExportStatus\.EXPIRED\.value\n"
                  r"\1    transfer\.artifact_size = None\n"
                  r"\1    count \+= 1$",
                  r"\1for transfer_export in exports:\n"
                  r"\1    store.delete(export_storage_key(transfer_export))\n"
                  r"\1    transfer_export.status = ExportStatus.EXPIRED.value\n"
                  r"\1    transfer_export.artifact_size = None\n"
                  r"\1    count += 1",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"export cleanup matches: {count}")

          if "for transfer_import in imports:" not in text:
              text, count = re.subn(
                  r"(?m)^(\s*)for transfer in imports:\n"
                  r"\1    store\.delete\(import_storage_key\(transfer\)\)\n"
                  r"\1    transfer\.status = ImportStatus\.EXPIRED\.value\n"
                  r"\1    count \+= 1$",
                  r"\1for transfer_import in imports:\n"
                  r"\1    store.delete(import_storage_key(transfer_import))\n"
                  r"\1    transfer_import.status = ImportStatus.EXPIRED.value\n"
                  r"\1    count += 1",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"import cleanup matches: {count}")

          required = (
              "from pydantic import BaseModel\n",
              "    if isinstance(value, UUID):\n",
              "    if isinstance(value, BaseModel):\n",
              "issubclass(python_type, BaseModel)",
              "reminder_target_table = generated_sources.get(source_type)",
              "ids.get(reminder_target_table, set())",
              "for transfer_export in exports:",
              "for transfer_import in imports:",
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f"hardening markers missing: {missing}")

          path.write_text(text)
          PY

      - name: Validate patch
        working-directory: backend
        run: |
          uv run --frozen ruff format src/sidebyside/transfer/service.py
          uv run --frozen ruff check src/sidebyside/transfer/service.py
          uv run --frozen mypy src/sidebyside/transfer/service.py
          uv run --frozen pytest tests/unit/test_transfer_archive.py -q

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/sidebyside/transfer/service.py
          git commit -m "fix(transfer): preserve protected payloads across bundles (#345)"
          git fetch origin feat/345-transfer-bundle
          git rebase origin/feat/345-transfer-bundle
          git push origin HEAD:feat/345-transfer-bundle
