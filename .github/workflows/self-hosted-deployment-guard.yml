name: Self-Hosted Deployment Guard

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    outputs:
      deployment_guard: ${{ steps.scope.outputs.deployment_guard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filterlogik testen
        run: python3 tools/ci/test_change_scope.py

      - name: Relevante Aenderungsflaechen bestimmen
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "deployment_guard=true" >> "$GITHUB_OUTPUT"
            echo "Push auf main: Deployment Guard bleibt aktiv."
            exit 0
          fi

          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          echo "Geaenderte Dateien:"
          cat /tmp/changed-files.txt
          python3 tools/ci/change_scope.py /tmp/changed-files.txt >> "$GITHUB_OUTPUT"

  deployment-guard:
    name: Network and Port Guard
    needs: changes
    if: needs.changes.outputs.deployment_guard == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Testkonfiguration vorbereiten
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-nur-fuer-den-testlauf/' .env
          sed -i 's/^API_PORT=.*/API_PORT=18081/' .env
          sed -i 's/^WEB_PORT=.*/WEB_PORT=18082/' .env
          sed -i 's|^SBS_PUBLIC_BASE_URL=.*|SBS_PUBLIC_BASE_URL=http://localhost:18082|' .env
          docker compose config --quiet
          docker compose -f compose.arcane.yaml --env-file .env config --quiet

      - name: Arcane-Variante bleibt semantisch gleichwertig
        run: |
          set -euo pipefail
          docker compose --env-file .env config --format json \
            | jq -S 'del(.name) | walk(if type == "object" and has("build") and (.build | type == "object") then .build.context = "__BUILD_CONTEXT__" else . end)' \
            > /tmp/compose-standard.json
          docker compose -f compose.arcane.yaml --env-file .env config --format json \
            | jq -S 'del(.name) | walk(if type == "object" and has("build") and (.build | type == "object") then .build.context = "__BUILD_CONTEXT__" else . end)' \
            > /tmp/compose-arcane.json
          diff -u /tmp/compose-standard.json /tmp/compose-arcane.json

          docker compose -f compose.arcane.yaml --env-file .env config --format json > /tmp/compose-arcane-raw.json
          jq -e '
            (.services.migrate.build.context | startswith("https://github.com/baerenmarke90/SideBySide-Next.git#")) and
            (.services.api.build.context == .services.migrate.build.context) and
            (.services.worker.build.context == .services.migrate.build.context) and
            (.services.web.build.context | endswith(":web")) and
            (.services.migrate.build.context | endswith(":backend"))
          ' /tmp/compose-arcane-raw.json

      - name: Bind-Adresse ist sicher und gezielt konfigurierbar
        run: |
          set -euo pipefail

          docker compose config --format json > /tmp/compose-default.json
          jq -e '
            .services.api.ports[0].host_ip == "127.0.0.1" and
            .services.web.ports[0].host_ip == "127.0.0.1"
          ' /tmp/compose-default.json

          cp .env .env-bind
          sed -i 's/^SBS_BIND_IP=.*/SBS_BIND_IP=127.0.0.2/' .env-bind
          docker compose --env-file .env-bind config --format json > /tmp/compose-bind.json
          jq -e '
            .services.api.ports[0].host_ip == "127.0.0.2" and
            .services.web.ports[0].host_ip == "127.0.0.2"
          ' /tmp/compose-bind.json

      - name: Belegter API-Port scheitert eindeutig
        run: |
          cp .env .env-conflict
          sed -i 's/^API_PORT=.*/API_PORT=18080/' .env-conflict

          python3 -m http.server 18080 --bind 0.0.0.0 >/tmp/occupied-api-port.log 2>&1 &
          blocker_pid=$!
          trap 'kill "$blocker_pid" 2>/dev/null || true; docker compose -p sidebyside-port-conflict --env-file .env-conflict down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          sleep 1

          set +e
          ausgabe=$(timeout 300 docker compose -p sidebyside-port-conflict --env-file .env-conflict up -d --build api 2>&1)
          status=$?
          set -e

          printf '%s\n' "$ausgabe"
          if [ "$status" -eq 0 ]; then
            echo "Der Stack hat einen bereits belegten Host-Port akzeptiert."
            exit 1
          fi

          api_id=$(docker compose -p sidebyside-port-conflict --env-file .env-conflict ps -aq api)
          if [ -n "$api_id" ]; then
            state=$(docker inspect "$api_id" --format '{{.State.Status}}')
            networks=$(docker inspect "$api_id" --format '{{len .NetworkSettings.Networks}}')
            echo "API nach erwartetem Fehlstart: state=$state networks=$networks"
            if [ "$state" = "running" ]; then
              echo "Nach dem Portkonflikt darf kein laufender API-Container zurueckbleiben."
              exit 1
            fi
          fi

          kill "$blocker_pid" 2>/dev/null || true
          docker compose -p sidebyside-port-conflict --env-file .env-conflict down -v --remove-orphans
          trap - EXIT

      - name: Normalen Self-Hosted-Stack starten
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Gemeinsames Compose-Netz ist aktiv
        run: |
          for dienst in postgres api worker web; do
            id=$(docker compose ps -q "$dienst")
            if [ -z "$id" ]; then
              echo "$dienst hat keinen laufenden Container."
              exit 1
            fi
            networks=$(docker inspect "$id" --format '{{len .NetworkSettings.Networks}}')
            echo "$dienst: $networks Netzwerk(e)"
            if [ "$networks" -lt 1 ]; then
              echo "$dienst ist an kein Docker-Netzwerk angeschlossen."
              exit 1
            fi
          done

          migrate_id=$(docker compose ps -aq migrate)
          if [ -z "$migrate_id" ]; then
            echo "migrate-Container fehlt."
            exit 1
          fi
          migrate_networks=$(docker inspect "$migrate_id" --format '{{len .NetworkSettings.Networks}}')
          echo "migrate: $migrate_networks Netzwerk(e)"
          if [ "$migrate_networks" -lt 1 ]; then
            echo "migrate ist an kein Docker-Netzwerk angeschlossen."
            exit 1
          fi

      - name: API kann postgres ueber Docker-DNS erreichen
        run: |
          docker compose exec -T api python - <<'PY'
          import socket

          address = socket.gethostbyname("postgres")
          if not address:
              raise SystemExit("postgres wurde nicht per Docker-DNS aufgeloest")
          print(f"postgres -> {address}")
          PY

      - name: Readiness ueber veroeffentlichten Port
        run: |
          antwort=$(curl --fail --silent --show-error http://127.0.0.1:18081/api/v1/health/ready)
          printf '%s\n' "$antwort"
          printf '%s\n' "$antwort" | jq -e '.status == "ok" and .database == "ok"'

      - name: Web-PoC ueber veroeffentlichten Port
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18082/healthz
          curl --fail --silent --show-error http://127.0.0.1:18082/ | grep -Fq "<title>SideBySide Next"

      - name: Runtime-Container sind healthy
        run: |
          for dienst in api web; do
            id=$(docker compose ps -q "$dienst")
            health=$(docker inspect "$id" --format '{{.State.Health.Status}}')
            test "$health" = "healthy" || {
              echo "$dienst health=$health"
              docker compose logs "$dienst"
              exit 1
            }
          done

      - name: Logs bei Fehlschlag
        if: failure()
        run: docker compose logs

      - name: Aufraeumen
        if: always()
        run: docker compose down -v --remove-orphans
