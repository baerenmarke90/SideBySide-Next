name: Temporary Backend validation for 529

on:
  push:
    branches: [feat/529-server-admin-operations]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SBS_ENVIRONMENT: test
      SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
      SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/529-server-admin-operations
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install 'uv==0.12.5'
          uv sync --frozen

      - name: Apply known type search and lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          api_path = Path("backend/src/sidebyside/api/v1/server_admin.py")
          text = api_path.read_text()
          text = text.replace(
              "from typing import Annotated, Literal",
              "from typing import Annotated, Any, Literal",
          )
          text = text.replace(
              "def _active_session_filters(current_time: datetime) -> tuple[object, ...]:",
              "def _active_session_filters(current_time: datetime) -> tuple[Any, ...]:",
          )
          old_query = '''    if normalized_query:
              like = f"%{normalized_query}%"
              statement = statement.where(
                  or_(
                      func.lower(Account.display_name).like(like),
                      exists().where(
                          AccountEmail.account_id == Account.id,
                          AccountEmail.email.like(like),
                      ),
                  )
              )
          '''
          new_query = '''    if normalized_query:
              like = f"%{normalized_query}%"
              display_name_match = func.lower(Account.display_name).like(like)
              email_match = exists().where(
                  AccountEmail.account_id == Account.id,
                  AccountEmail.email.like(like),
              )
              account_id_match = parse_id(normalized_query)
              if account_id_match is None:
                  statement = statement.where(or_(display_name_match, email_match))
              else:
                  statement = statement.where(
                      or_(display_name_match, email_match, Account.id == account_id_match)
                  )
          '''
          if old_query not in text:
              raise SystemExit("Account query block changed unexpectedly.")
          api_path.write_text(text.replace(old_query, new_query))

          test_path = Path("backend/tests/integration/test_server_admin.py")
          test_text = test_path.read_text()
          test_anchor = '''    assert set(payload["items"][0]) == {
              "id",
              "displayName",
              "primaryEmail",
              "emailVerified",
              "createdAt",
              "disabledAt",
              "authMethods",
              "activeSessionCount",
              "activeMembershipCount",
          }
          '''
          test_replacement = test_anchor + '''
              by_id = client.get(
                  f"/api/v1/server-admin/accounts?query={target.id}",
                  headers=auth(token),
              )
              assert by_id.status_code == 200
              assert by_id.json()["total"] == 1
              assert by_id.json()["items"][0]["id"] == str(target.id)
          '''
          if test_anchor not in test_text:
              raise SystemExit("Account directory test block changed unexpectedly.")
          test_path.write_text(test_text.replace(test_anchor, test_replacement))

          web_path = Path("web/src/components/ServerAdminAccountsPanel.tsx")
          web_text = web_path.read_text()
          unused_block = '''  const unverifiedEmails = account.emails.filter(
              (email) => email.verifiedAt === null,
            );
          '''
          if unused_block in web_text:
              web_path.write_text(web_text.replace(unused_block, ""))
          PY

      - name: Fix safe Ruff issues and format changed backend files
        working-directory: backend
        run: |
          files=(
            src/sidebyside/administration/models.py
            src/sidebyside/administration/service.py
            src/sidebyside/administration/account_operations.py
            src/sidebyside/api/v1/server_admin.py
            scripts/server_admin.py
            tests/integration/test_server_admin.py
            alembic/versions/0037_server_admin_account_actions.py
          )
          uv run --frozen ruff check --fix "${files[@]}"
          uv run --frozen ruff format "${files[@]}"

      - name: Type checking
        working-directory: backend
        run: uv run --frozen mypy

      - name: OpenAPI contract remains current
        working-directory: backend
        run: uv run --frozen python scripts/openapi_contract.py check

      - name: Apply migrations
        working-directory: backend
        run: uv run --frozen alembic upgrade head

      - name: Run focused ServerAdmin integration tests
        working-directory: backend
        run: uv run --frozen pytest tests/integration/test_server_admin.py -q

      - name: Commit validated source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/src/sidebyside/administration/models.py \
            backend/src/sidebyside/administration/service.py \
            backend/src/sidebyside/administration/account_operations.py \
            backend/src/sidebyside/api/v1/server_admin.py \
            backend/scripts/server_admin.py \
            backend/tests/integration/test_server_admin.py \
            backend/alembic/versions/0037_server_admin_account_actions.py \
            web/src/components/ServerAdminAccountsPanel.tsx
          if git diff --cached --quiet; then
            echo 'Sources already validated and formatted.'
            exit 0
          fi
          git commit -m 'fix(server-admin): validate account operations and search'
          git push origin HEAD:feat/529-server-admin-operations
