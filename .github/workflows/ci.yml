name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      SBS_ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Gesperrte Abhaengigkeiten
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Sichere Self-Hosted-Konfiguration
        working-directory: .
        run: |
          docker compose --env-file .env.example config --quiet
          host_ip=$(docker compose --env-file .env.example config --format json \
            | jq -r '.services.api.ports[0].host_ip')
          if [ "$host_ip" != "127.0.0.1" ]; then
            echo "Die API ist im Standard nicht auf Loopback begrenzt: $host_ip"
            exit 1
          fi

      - name: Keine Quelldatei wird von .gitignore verschluckt
        # Ein ungeankertes Muster wie "media/" trifft jedes Verzeichnis
        # dieses Namens. Lokal faellt das nie auf, weil die Datei auf der
        # Platte liegt - erst der Checkout in der CI hat sie nicht mehr.
        working-directory: .
        run: |
          fehlend=$(comm -23 \
            <(find backend/src web android -name "*.py" -o -name "*.ts" \
                -o -name "*.tsx" -o -name "*.kt" 2>/dev/null | sort) \
            <(git ls-files backend/src web android | sort))
          if [ -n "$fehlend" ]; then
            echo "Diese Quelldateien sind nicht versioniert:"
            echo "$fehlend"
            exit 1
          fi

      - name: Lint
        run: uv run --frozen ruff check src tests scripts alembic

      - name: Formatierung
        run: uv run --frozen ruff format --check src tests scripts alembic

      - name: Typpruefung
        run: uv run --frozen mypy

      - name: OpenAPI-Vertrag
        run: uv run --frozen python scripts/openapi_contract.py check

      - name: Tests ohne Integration
        run: uv run --frozen pytest -m "not integration" -q

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest

    # Datenbanktests und Schema-/Migrationschecks laufen getrennt vom
    # statischen/Unit-Gate. Dadurch werden die teuren Integrationstests pro
    # Commit genau einmal ausgefuehrt und beide Backend-Gates koennen parallel
    # laufen.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SBS_ENVIRONMENT: test
      SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
      SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Gesperrte Abhaengigkeiten
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Migrationen
        run: uv run --frozen alembic upgrade head

      - name: Migrationen sind vollstaendig
        # Weicht das Modell vom Schema ab, fehlt eine Migration. Das faellt
        # sonst erst beim Deployment auf.
        run: |
          uv run --frozen alembic revision --autogenerate -m "drift check" --rev-id drift_check
          if grep -qE "op\.(create|drop|alter|add)_" alembic/versions/drift_check_*.py; then
            echo "Modell und Migrationen weichen ab:"
            cat alembic/versions/drift_check_*.py
            exit 1
          fi
          rm alembic/versions/drift_check_*.py

      - name: Integrationstests sind wirklich gelaufen
        # Ein uebersprungener Sicherheitstest darf nicht wie ein bestandener
        # aussehen. Der maschinenlesbare JUnit-Report belegt, dass mindestens
        # ein Integrationstest lief und keiner uebersprungen wurde.
        run: |
          report=$(mktemp)
          uv run --frozen pytest -m integration -q --junitxml="$report"
          uv run --frozen python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          testcases = root.findall(".//testcase")
          skipped = sum(case.find("skipped") is not None for case in testcases)

          if not testcases:
              raise SystemExit("Keine Integrationstests gelaufen.")
          if skipped:
              raise SystemExit(
                  f"{skipped} Integrationstest(s) wurden uebersprungen - "
                  "Datenbank nicht erreichbar?"
              )
          PY

  self-hosted:
    name: Self-Hosted Start
    runs-on: ubuntu-latest
    # Der Fehler aus #110 ist an allen Gates vorbeigekommen, weil CI die
    # Compose-Datei nur geparst und Alembic unter SBS_ENVIRONMENT=test
    # ausgefuehrt hat. Der dokumentierte Startpfad lief nirgends. Dieser Job
    # faehrt ihn genau so, wie er in docs/SELF-HOSTING.md steht.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dokumentierten Erststart vorbereiten
        # Wie in der Anleitung: kopieren, Passwort ersetzen, starten. Der
        # Testwert ist ein CI-Wert und kein Geheimnis.
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-nur-fuer-den-testlauf/' .env
          docker compose config --quiet

      - name: Stack starten
        run: docker compose up -d --wait --wait-timeout 300

      - name: Migration ist durchgelaufen
        run: |
          status=$(docker compose ps -a --format json migrate | jq -r '.ExitCode')
          if [ "$status" != "0" ]; then
            echo "migrate ist nicht sauber beendet (ExitCode $status):"
            docker compose logs migrate
            exit 1
          fi

      - name: Healthcheck ueber den veroeffentlichten Port
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health

      - name: Kein Runtime-Dienst ist an der Konfiguration gescheitert
        # Ein fehlender Settings-Wert beendet den Prozess sofort; unter
        # restart: unless-stopped sieht das nach kurzer Zeit wie ein
        # Neustartkarussell aus und nicht wie ein Fehler.
        run: |
          for dienst in api worker; do
            status=$(docker compose ps --format json "$dienst" | jq -r '.State')
            if [ "$status" != "running" ]; then
              echo "$dienst laeuft nicht ($status):"
              docker compose logs "$dienst"
              exit 1
            fi
          done
          if docker compose logs api worker | grep -q "validation error for Settings"; then
            echo "Ein Dienst hat einen Settings-Fehler protokolliert:"
            docker compose logs api worker
            exit 1
          fi

      - name: Migration ist wiederholbar
        run: |
          docker compose run --rm migrate
          echo "zweiter Lauf gegen das bestehende Schema war erfolgreich"

      - name: Produktionsbetrieb weist unsichere Konfiguration weiterhin ab
        # Der Testbetrieb ist der Standard, nicht die Ausrede. Diese Pruefung
        # haelt fest, dass die Production-Invarianten unveraendert greifen -
        # sonst waere der bequemste Weg zu gruener CI, sie zu lockern.
        run: |
          set +e
          for fall in "SBS_MAIL_TRANSPORT=log" "SBS_PUBLIC_BASE_URL=http://unsicher.invalid" "SBS_CURSOR_SIGNING_KEY="; do
            ausgabe=$(docker compose run --rm --no-deps \
              -e SBS_ENVIRONMENT=production \
              -e SBS_CURSOR_SIGNING_KEY=ci-testwert-mit-mindestens-32-zeichen \
              -e SBS_MAIL_TRANSPORT=smtp \
              -e SBS_PUBLIC_BASE_URL=https://ci.invalid \
              -e "$fall" \
              api python -c "from sidebyside.config import Settings; Settings()" 2>&1)
            if [ $? -eq 0 ]; then
              echo "Production hat eine unsichere Konfiguration akzeptiert: $fall"
              exit 1
            fi
            echo "abgewiesen wie erwartet: $fall"
          done
          set -e

      - name: Produktionsbetrieb ohne Mailserver ist zulaessig
        # Ein SMTP-Zugang ist keine Startvoraussetzung (ADR 0002). Verboten
        # ist nur "log", weil dabei Einmal-Token ins Log wandern.
        run: |
          docker compose run --rm --no-deps \
            -e SBS_ENVIRONMENT=production \
            -e SBS_CURSOR_SIGNING_KEY=ci-testwert-mit-mindestens-32-zeichen \
            -e SBS_MAIL_TRANSPORT=none \
            -e SBS_PUBLIC_BASE_URL=https://ci.invalid \
            api python -c "from sidebyside.config import Settings; Settings()"

      - name: Logs bei Fehlschlag
        if: failure()
        run: docker compose logs

      - name: Aufraeumen
        if: always()
        run: docker compose down -v

  api-clients:
    name: API Clients
    runs-on: ubuntu-latest
    # Der Vertrag ist die einzige Quelle fuer Web- und Android-DTOs. Weicht
    # der eingecheckte Client-Code von ihm ab, ist eine Vertragsaenderung
    # ohne den dazugehoerigen Clientteil gemergt worden - und der Bruch
    # faellt sonst erst im Clientprojekt auf.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Erzeugter Client-Code stimmt mit dem Vertrag ueberein
        run: tools/openapi/generate.sh --check

      - name: Der TypeScript-Client hat keine Runtime-Abhaengigkeit
        # Der Generator ist auf `typescript-fetch` konfiguriert, damit kein
        # HTTP-Paket in den Webclient wandert. Diese Pruefung haelt das fest:
        # ein Konfigurationswechsel wuerde sonst still eine Abhaengigkeit
        # einfuehren, die erst im Webprojekt auffaellt.
        run: |
          if find web/src/api/generated -name package.json | grep -q .; then
            echo "Der generierte TypeScript-Client bringt eine package.json mit."
            exit 1
          fi
          fremd=$(grep -rhoE "from '[^.][^']*'" web/src/api/generated || true)
          if [ -n "$fremd" ]; then
            echo "Der generierte TypeScript-Client importiert externe Pakete:"
            echo "$fremd" | sort -u
            exit 1
          fi

      - name: Der Kotlin-Client bringt keinen HTTP-Stack mit
        # Nur Modelle, kein Service-Layer: der HTTP-Stack des Android-Clients
        # ist eine Entscheidung am Android-Projekt und nicht an dieser Datei.
        run: |
          treffer=$(grep -rlE "retrofit2|io\.ktor|okhttp3" android/api/generated || true)
          if [ -n "$treffer" ]; then
            echo "Der generierte Kotlin-Code zieht einen HTTP-Stack herein:"
            echo "$treffer"
            exit 1
          fi

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: uv exakt installieren
        run: python -m pip install "uv==$UV_VERSION"
      - name: Lockdatei ist aktuell
        run: uv lock --check
      - name: Dependency- und Vulnerability-Scan
        # Policy: jeder bekannte OSV-Fund oder nachteilige Paketstatus laesst
        # den Job fehlschlagen. Ausnahmen muessen explizit, begruendet und
        # befristet in pyproject.toml stehen; aktuell gibt es keine.
        run: uv audit --preview --frozen
      - name: Abhaengigkeitsinventar
        run: |
          uv sync --frozen
          uv run --frozen python scripts/check_dependency_inventory.py ../docs/DEPENDENCIES.md
      - name: Backend-Wheel ohne Cache bauen
        run: uv build --no-cache --wheel --out-dir /tmp/sidebyside-dist
      - name: Produktionscontainer frisch bauen
        run: docker build --pull --no-cache --tag sidebyside-next:ci .

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks direkt statt ueber die Action: die Action scannt den
      # Bereich <vorheriger Commit>..HEAD und scheitert am ersten Push,
      # weil der erste Commit keinen Vorgaenger hat. Der direkte Aufruf
      # scannt die vollstaendige Historie - was fuer einen Secret-Scan
      # ohnehin die richtige Menge ist.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            detect --source . --redact --verbose --exit-code 1

  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pflichtdokumente vorhanden
        run: |
          for datei in PROVENANCE.md docs/DEPENDENCIES.md \
                       docs/SECURITY.md docs/PRIVACY-MODEL.md \
                       specification/PRODUCT-SPEC.md LICENSE \
                       COMMERCIAL-LICENSE.md CONTRIBUTING.md CLA.md \
                       TRADEMARKS.md; do
            test -f "$datei" || { echo "fehlt: $datei"; exit 1; }
          done
      - name: Lizenzentscheidung ist konsistent
        # Seit der ausdruecklichen Lizenzentscheidung ist LICENSE verpflichtend.
        # Die CI stellt sicher, dass Lizenz, Provenance und Commercial-Policy
        # nicht versehentlich wieder auf den frueheren offenen Stand geraten.
        run: |
          grep -Fq "# PolyForm Noncommercial License 1.0.0" LICENSE
          grep -Fq "PolyForm Noncommercial License 1.0.0" PROVENANCE.md
          grep -Fq "Commercial use requires a separate commercial license" COMMERCIAL-LICENSE.md
