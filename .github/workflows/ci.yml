name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Die Integrationstests laufen hier gegen echtes PostgreSQL. Auf
    # Entwicklungsrechnern ohne Datenbank werden sie uebersprungen - die CI
    # ist der Ort, an dem sie verbindlich laufen.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SBS_ENVIRONMENT: test
      SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
      SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Gesperrte Abhaengigkeiten
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Sichere Self-Hosted-Konfiguration
        working-directory: .
        run: |
          docker compose --env-file .env.example config --quiet
          host_ip=$(docker compose --env-file .env.example config --format json \
            | jq -r '.services.api.ports[0].host_ip')
          if [ "$host_ip" != "127.0.0.1" ]; then
            echo "Die API ist im Standard nicht auf Loopback begrenzt: $host_ip"
            exit 1
          fi

      - name: Keine Quelldatei wird von .gitignore verschluckt
        # Ein ungeankertes Muster wie "media/" trifft jedes Verzeichnis
        # dieses Namens. Lokal faellt das nie auf, weil die Datei auf der
        # Platte liegt - erst der Checkout in der CI hat sie nicht mehr.
        working-directory: .
        run: |
          fehlend=$(comm -23 \
            <(find backend/src web android -name "*.py" -o -name "*.ts" \
                -o -name "*.tsx" -o -name "*.kt" 2>/dev/null | sort) \
            <(git ls-files backend/src web android | sort))
          if [ -n "$fehlend" ]; then
            echo "Diese Quelldateien sind nicht versioniert:"
            echo "$fehlend"
            exit 1
          fi

      - name: Lint
        run: uv run --frozen ruff check src tests scripts alembic

      - name: Formatierung
        run: uv run --frozen ruff format --check src tests scripts alembic

      - name: Typpruefung
        run: uv run --frozen mypy

      - name: OpenAPI-Vertrag fuer Aktualisierung erzeugen
        run: uv run --frozen python scripts/openapi_contract.py write --contract /tmp/openapi.json

      - name: Generierten OpenAPI-Vertrag bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-openapi
          path: /tmp/openapi.json

      - name: Generierten OpenAPI-Vertrag in den PR-Branch uebernehmen
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          cp /tmp/openapi.json backend/openapi.json
          git add backend/openapi.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update OpenAPI contract for profiles API"
          git push origin HEAD:${{ github.head_ref }}

      - name: OpenAPI-Vertrag
        run: uv run --frozen python scripts/openapi_contract.py check

      - name: Migrationen
        run: uv run --frozen alembic upgrade head

      - name: Migrationen sind vollstaendig
        # Weicht das Modell vom Schema ab, fehlt eine Migration. Das faellt
        # sonst erst beim Deployment auf.
        run: |
          uv run --frozen alembic revision --autogenerate -m "drift check" --rev-id drift_check
          if grep -qE "op\.(create|drop|alter|add)_" alembic/versions/drift_check_*.py; then
            echo "Modell und Migrationen weichen ab:"
            cat alembic/versions/drift_check_*.py
            exit 1
          fi
          rm alembic/versions/drift_check_*.py

      - name: Tests
        run: uv run --frozen pytest -q

      - name: Integrationstests sind wirklich gelaufen
        # Ein uebersprungener Sicherheitstest darf nicht wie ein bestandener
        # aussehen. Hier muessen sie tatsaechlich gelaufen sein.
        run: |
          set -o pipefail
          uv run --frozen pytest -m integration -q --no-header | tee /tmp/integration.txt
          if grep -qE "[0-9]+ skipped" /tmp/integration.txt; then
            echo "Integrationstests wurden uebersprungen - Datenbank nicht erreichbar?"
            exit 1
          fi
          if ! grep -qE "[0-9]+ passed" /tmp/integration.txt; then
            echo "Keine Integrationstests gelaufen."
            exit 1
          fi

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: uv exakt installieren
        run: python -m pip install "uv==$UV_VERSION"
      - name: Lockdatei ist aktuell
        run: uv lock --check
      - name: Dependency- und Vulnerability-Scan
        # Policy: jeder bekannte OSV-Fund oder nachteilige Paketstatus laesst
        # den Job fehlschlagen. Ausnahmen muessen explizit, begruendet und
        # befristet in pyproject.toml stehen; aktuell gibt es keine.
        run: uv audit --preview --frozen
      - name: Abhaengigkeitsinventar
        run: |
          uv sync --frozen
          uv run --frozen python scripts/check_dependency_inventory.py ../docs/DEPENDENCIES.md
      - name: Backend-Wheel ohne Cache bauen
        run: uv build --no-cache --wheel --out-dir /tmp/sidebyside-dist
      - name: Produktionscontainer frisch bauen
        run: docker build --pull --no-cache --tag sidebyside-next:ci .

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # gitleaks direkt statt ueber die Action: die Action scannt den
      # Bereich <vorheriger Commit>..HEAD und scheitert am ersten Push,
      # weil der erste Commit keinen Vorgaenger hat. Der direkte Aufruf
      # scannt die vollstaendige Historie - was fuer einen Secret-Scan
      # ohnehin die richtige Menge ist.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            detect --source . --redact --verbose --exit-code 1

  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Pflichtdokumente vorhanden
        run: |
          for datei in PROVENANCE.md docs/DEPENDENCIES.md \
                       docs/SECURITY.md docs/PRIVACY-MODEL.md \
                       specification/PRODUCT-SPEC.md; do
            test -f "$datei" || { echo "fehlt: $datei"; exit 1; }
          done
      - name: Keine Lizenzdatei ohne ausdrueckliche Entscheidung
        # Die Lizenz fuer den eigenen Quellcode ist bewusst offen. Eine
        # versehentlich hinzugefuegte LICENSE waere ein Angebot, das so
        # nicht beschlossen wurde.
        run: |
          if ls LICENSE LICENSE.* COPYING 2>/dev/null | grep -q .; then
            echo "LICENSE vorhanden, aber noch keine Lizenzentscheidung getroffen."
            exit 1
          fi
