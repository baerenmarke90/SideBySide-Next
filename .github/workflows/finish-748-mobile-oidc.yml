name: Finish 748 mobile OIDC contract

on:
  push:
    branches:
      - work/748-finish

permissions:
  contents: write

jobs:
  update-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SBS_ENVIRONMENT: test
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/748-finish
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend toolchain
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen

      - name: Add server-authoritative Android OIDC redirect selection
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "backend/src/sidebyside/config.py",
              "    redirect_uri: str = Field(min_length=1, max_length=512)\n    scopes: str = \"openid email profile\"\n",
              "    redirect_uri: str = Field(min_length=1, max_length=512)\n    # Optional native-app callback registered with the provider. The client may\n    # select only this preconfigured URI; it can never supply an arbitrary redirect.\n    android_redirect_uri: str | None = Field(default=None, min_length=1, max_length=512)\n    scopes: str = \"openid email profile\"\n",
          )

          replace_once(
              "backend/src/sidebyside/auth/recent_auth.py",
              "class RecentAuthenticationMethod(StrEnum):\n    LOCAL_PASSWORD = \"LOCAL_PASSWORD\"\n    PASSKEY = \"PASSKEY\"\n    OIDC = \"OIDC\"\n\n\nclass RecentAuthenticationErrorCode:\n",
              "class RecentAuthenticationMethod(StrEnum):\n    LOCAL_PASSWORD = \"LOCAL_PASSWORD\"\n    PASSKEY = \"PASSKEY\"\n    OIDC = \"OIDC\"\n\n\nclass RecentAuthenticationClient(StrEnum):\n    WEB = \"web\"\n    ANDROID = \"android\"\n\n\nclass RecentAuthenticationErrorCode:\n",
          )
          replace_once(
              "backend/src/sidebyside/auth/recent_auth.py",
              "def capabilities(\n    session: Session,\n    account: Account,\n    device_session: DeviceSession,\n    policy: AuthCapabilities,\n) -> RecentAuthenticationCapabilities:\n",
              "def capabilities(\n    session: Session,\n    account: Account,\n    device_session: DeviceSession,\n    policy: AuthCapabilities,\n    *,\n    client: RecentAuthenticationClient = RecentAuthenticationClient.WEB,\n) -> RecentAuthenticationCapabilities:\n",
          )
          replace_once(
              "backend/src/sidebyside/auth/recent_auth.py",
              "    configured_ids = {connection.id for connection in get_settings().oidc_connections}\n",
              "    configured_ids = {\n        connection.id\n        for connection in get_settings().oidc_connections\n        if client != RecentAuthenticationClient.ANDROID\n        or connection.android_redirect_uri is not None\n    }\n",
          )

          replace_once(
              "backend/src/sidebyside/auth/recent_oidc.py",
              "    *,\n    purpose: recent_auth.RecentAuthenticationPurpose,\n) -> oidc.StartedFlow:\n    \"\"\"Request active provider reauthentication for one current session.\"\"\"\n    recent_auth.ensure_context(account, device_session)\n    configured = oidc.connection(connection_id)\n",
              "    *,\n    purpose: recent_auth.RecentAuthenticationPurpose,\n    client: recent_auth.RecentAuthenticationClient = recent_auth.RecentAuthenticationClient.WEB,\n) -> oidc.StartedFlow:\n    \"\"\"Request active provider reauthentication for one current session.\"\"\"\n    recent_auth.ensure_context(account, device_session)\n    configured = oidc.connection(connection_id)\n    redirect_uri = configured.redirect_uri\n    if client == recent_auth.RecentAuthenticationClient.ANDROID:\n        if configured.android_redirect_uri is None:\n            raise ForbiddenError(\n                \"OIDC recent authentication is not available for this client.\",\n                recent_auth.RecentAuthenticationErrorCode.METHOD_UNAVAILABLE,\n            )\n        redirect_uri = configured.android_redirect_uri\n",
          )
          replace_once(
              "backend/src/sidebyside/auth/recent_oidc.py",
              "            redirect_uri=configured.redirect_uri,\n",
              "            redirect_uri=redirect_uri,\n",
          )
          replace_once(
              "backend/src/sidebyside/auth/recent_oidc.py",
              "        \"redirect_uri\": configured.redirect_uri,\n",
              "        \"redirect_uri\": redirect_uri,\n",
          )

          replace_once(
              "backend/src/sidebyside/api/v1/recent_authentication.py",
              "from fastapi import APIRouter, Path, Request, status\n",
              "from fastapi import APIRouter, Path, Query, Request, status\n",
          )
          replace_once(
              "backend/src/sidebyside/api/v1/recent_authentication.py",
              "    policy: AuthPolicy,\n) -> CapabilitiesView:\n    available = recent_auth.capabilities(session, account, device_session, policy)\n",
              "    policy: AuthPolicy,\n    client: Annotated[\n        recent_auth.RecentAuthenticationClient, Query()\n    ] = recent_auth.RecentAuthenticationClient.WEB,\n) -> CapabilitiesView:\n    available = recent_auth.capabilities(\n        session, account, device_session, policy, client=client\n    )\n",
          )
          replace_once(
              "backend/src/sidebyside/api/v1/recent_authentication.py",
              "    connection_id: Annotated[str, Path(alias=\"connectionId\")],\n) -> OidcStartView:\n",
              "    connection_id: Annotated[str, Path(alias=\"connectionId\")],\n    client: Annotated[\n        recent_auth.RecentAuthenticationClient, Query()\n    ] = recent_auth.RecentAuthenticationClient.WEB,\n) -> OidcStartView:\n",
          )
          replace_once(
              "backend/src/sidebyside/api/v1/recent_authentication.py",
              "        device_session,\n        purpose=PURPOSE,\n    )\n",
              "        device_session,\n        purpose=PURPOSE,\n        client=client,\n    )\n",
          )

          replace_once(
              ".env.example",
              '# SBS_OIDC_CONNECTIONS=[{"id":"pocket","issuer":"https://id.example","client_id":"sidebyside","client_secret":"...","redirect_uri":"https://app.example/oidc"}]\n',
              '# Optional android_redirect_uri is an operator-registered native callback used only for Android recent-authentication step-up.\n# SBS_OIDC_CONNECTIONS=[{"id":"pocket","issuer":"https://id.example","client_id":"sidebyside","client_secret":"...","redirect_uri":"https://app.example/oidc","android_redirect_uri":"de.sidebyside.app://recent-authentication/oidc"}]\n',
          )
          PY

      - name: Format backend
        working-directory: backend
        run: uv run --frozen ruff format src tests scripts alembic

      - name: Refresh OpenAPI contract
        working-directory: backend
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Regenerate Web and Android models
        run: tools/openapi/generate.sh

      - name: Remove one-time workflow
        run: rm .github/workflows/finish-748-mobile-oidc.yml

      - name: Commit contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(auth): add server-authoritative Android OIDC step-up redirect"
          git push origin HEAD:work/748-finish
