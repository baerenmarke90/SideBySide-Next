name: M4 S2 Type Fix

on:
  push:
    branches: [feat/292-m4c-rules-occurrences-final]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
      SBS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/292-m4c-rules-occurrences-final
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Fix typed generated source locals
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/sidebyside/reminders/runtime.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '''    for source in important_dates:\n        desired[("IMPORTANT_DATE", source.id, IMPORTANT_DATE_RULE)] = {\n            "owner_id": source.owner_id,\n            "schedule_type": ReminderScheduleType.ANNUAL,\n            "annual_month": source.date.month,\n            "annual_day": source.date.day,\n            "local_time": time(9, 0),\n        }\n''': '''    for important_date in important_dates:\n        desired[("IMPORTANT_DATE", important_date.id, IMPORTANT_DATE_RULE)] = {\n            "owner_id": important_date.owner_id,\n            "schedule_type": ReminderScheduleType.ANNUAL,\n            "annual_month": important_date.date.month,\n            "annual_day": important_date.date.day,\n            "local_time": time(9, 0),\n        }\n''',
              '''    for source in people:\n        if source.birthday is None:\n            continue\n        desired[("RELATED_PERSON", source.id, RELATED_PERSON_BIRTHDAY_RULE)] = {\n            "owner_id": source.owner_id,\n            "schedule_type": ReminderScheduleType.ANNUAL,\n            "annual_month": source.birthday.month,\n            "annual_day": source.birthday.day,\n            "local_time": time(9, 0),\n        }\n''': '''    for person in people:\n        if person.birthday is None:\n            continue\n        desired[("RELATED_PERSON", person.id, RELATED_PERSON_BIRTHDAY_RULE)] = {\n            "owner_id": person.owner_id,\n            "schedule_type": ReminderScheduleType.ANNUAL,\n            "annual_month": person.birthday.month,\n            "annual_day": person.birthday.day,\n            "local_time": time(9, 0),\n        }\n''',
              '''    for source in plans:\n        if source.planned_start is None:\n            continue\n        desired[("PLAN", source.id, PLAN_START_RULE)] = {\n            "owner_id": source.owner_id,\n            "schedule_type": ReminderScheduleType.ONCE,\n            "once_at": clock.ensure_utc(source.planned_start),\n        }\n''': '''    for plan in plans:\n        if plan.planned_start is None:\n            continue\n        desired[("PLAN", plan.id, PLAN_START_RULE)] = {\n            "owner_id": plan.owner_id,\n            "schedule_type": ReminderScheduleType.ONCE,\n            "once_at": clock.ensure_utc(plan.planned_start),\n        }\n''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit("expected runtime source block not found")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate strict typing and formatting
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen
          uv run --frozen ruff format src/sidebyside/reminders/runtime.py
          uv run --frozen ruff check src/sidebyside/reminders/runtime.py
          uv run --frozen mypy
      - name: Commit clean fix
        run: |
          set -euo pipefail
          git rm .github/m4-s2-mypy.txt
          git rm .github/workflows/m4-s2-mypy-diagnostic.yml
          git rm .github/workflows/m4-s2-typefix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/sidebyside/reminders/runtime.py
          git commit -m "fix(reminders): use typed generated source locals"
          git push origin HEAD:feat/292-m4c-rules-occurrences-final
