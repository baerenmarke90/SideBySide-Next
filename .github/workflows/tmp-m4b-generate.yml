name: Temporary M4-B Contract Generation

on:
  push:
    branches:
      - tmp/m4b-contract-generation

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SBS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/m4b-contract-generation

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"

      - name: Install locked backend
        working-directory: backend
        run: |
          python -m pip install "uv==0.12.5"
          uv sync --frozen

      - name: Regenerate contract and clients
        run: |
          cd backend
          uv run --frozen python scripts/openapi_contract.py write
          cd ..
          tools/openapi/generate.sh

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json web/src/api/generated android/api/generated
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(m4): regenerate engagement API clients"
          git push origin HEAD:tmp/m4b-contract-generation
