name: Self-Hosted Recovery

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '53 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    outputs:
      recovery: ${{ steps.scope.outputs.recovery }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test change-scope filter logic
        run: python3 tools/ci/test_change_scope.py

      - name: Determine relevant change scopes
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              ;;
            *)
              echo "recovery=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled/manual run: Self-Hosted Recovery remains fully active."
              exit 0
              ;;
          esac

          if [ -z "$base_sha" ] || [ -z "$head_sha" ] \
            || [[ "$base_sha" =~ ^0+$ ]] \
            || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            echo "recovery=true" >> "$GITHUB_OUTPUT"
            echo "Change range unavailable; failing closed to Self-Hosted Recovery."
            exit 0
          fi

          git diff --name-only --no-renames "$base_sha" "$head_sha" > /tmp/changed-files.txt
          echo "Changed files:"
          cat /tmp/changed-files.txt
          python3 tools/ci/change_scope.py /tmp/changed-files.txt >> "$GITHUB_OUTPUT"

  recovery:
    name: Backup, Restore, and Upgrade
    needs: changes
    if: needs.changes.outputs.recovery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Recovery helper syntax and archive contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/self_hosted_recovery.py \
            scripts/self_hosted_deletion_reconcile.py \
            scripts/self_hosted_recovery_acceptance.py \
            scripts/account_deletion_recovery_acceptance.py \
            scripts/test_self_hosted_recovery.py \
            scripts/test_self_hosted_deletion_reconcile.py \
            backend/scripts/recovery_fixture.py \
            backend/src/sidebyside/identity/deletion_reconcile.py
          python3 -m unittest \
            scripts.test_self_hosted_recovery \
            scripts.test_self_hosted_deletion_reconcile

      - name: Prepare ephemeral CI source-build overlay
        run: |
          set -euo pipefail
          cat > deploy/compose.source-build.yaml <<'YAML'
          x-source-backend-build: &source-backend-build
            image: "sidebyside-backend:source-${SBS_BUILD_REVISION:-unverified-local-checkout}"
            build:
              context: "${SBS_BACKEND_BUILD_CONTEXT:-./backend}"
              args:
                SBS_BUILD_REVISION: "${SBS_BUILD_REVISION:-unverified-local-checkout}"
            pull_policy: build
          x-source-web-build: &source-web-build
            image: "sidebyside-web:source-${SBS_BUILD_REVISION:-unverified-local-checkout}"
            build:
              context: "${SBS_WEB_BUILD_CONTEXT:-./web}"
              args:
                SBS_BUILD_REVISION: "${SBS_BUILD_REVISION:-unverified-local-checkout}"
                VITE_SBS_API_BASE_URL: ""
                VITE_SBS_DEMO_MODE: "${SBS_DEMO_MODE:-false}"
                VITE_SBS_DEMO_URL: "${SBS_DEMO_PUBLIC_URL:-}"
                VITE_SBS_DEMO_RESET_TIMER: "${SBS_DEMO_MODE_RESET_TIMER:-false}"
                VITE_SBS_DEMO_RESET_INTERVAL: "${SBS_DEMO_MODE_RESET_INTERVAL:-6h}"
            pull_policy: build
          services:
            migrate:
              <<: *source-backend-build
            demo-init:
              <<: *source-backend-build
            api:
              <<: *source-backend-build
            worker:
              <<: *source-backend-build
            web:
              <<: *source-web-build
          YAML

      - name: Fresh restore and prior-schema upgrade acceptance
        run: python3 scripts/self_hosted_recovery_acceptance.py

      - name: Account deletion survives older restore
        run: python3 scripts/account_deletion_recovery_acceptance.py

      - name: Remove ephemeral source-build overlay
        if: always()
        run: rm -f deploy/compose.source-build.yaml
