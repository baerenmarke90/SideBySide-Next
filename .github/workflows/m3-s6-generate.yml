name: M3-S6 Generate Contracts

on:
  push:
    branches:
      - feat/254-m3-s6-shared-collections
    paths:
      - .github/workflows/m3-s6-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend
        working-directory: backend
        run: |
          python -m pip install 'uv==0.12.5'
          uv lock --check
          uv sync --frozen

      - name: Write canonical OpenAPI snapshot
        working-directory: backend
        env:
          SBS_ENVIRONMENT: test
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Generate pinned TypeScript and Kotlin clients
        run: tools/openapi/generate.sh

      - name: Commit generated artifacts to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/openapi.json web/src/api/generated android/api/generated
          if git diff --cached --quiet; then
            echo 'Generated artifacts are already current.'
            exit 0
          fi
          git commit -m 'chore(api): regenerate M3-S6 contracts (#254)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
