name: M4 Sync OpenAPI

on:
  push:
    branches: [feat/285-m4c-reminders-final]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
      SBS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/285-m4c-reminders-final

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Generate authoritative OpenAPI contract
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen
          uv run --frozen python scripts/openapi_contract.py write

      - name: Commit generated contract
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/openapi.json; then
            echo "OpenAPI already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json
          git commit -m "chore(api): synchronize M4-C-S1 OpenAPI contract"
          git push origin HEAD:feat/285-m4c-reminders-final
