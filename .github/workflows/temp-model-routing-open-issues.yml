name: Temporary open-issue model routing

on:
  push:
    branches:
      - automation/model-routing-open-issues-20260904

permissions:
  contents: read
  issues: write

jobs:
  route-open-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Append model routing to open issues missing it
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "sidebyside-model-routing",
          }

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def contains_any(value, needles):
              return any(needle in value for needle in needles)

          def route_for(issue):
              title = (issue.get("title") or "").lower()
              labels = " ".join(
                  (label.get("name") or "").lower()
                  for label in issue.get("labels", [])
                  if isinstance(label, dict)
              )
              signal = f"{title} {labels}"

              critical = [
                  "architecture", "architektur", "security", "sicherheit", "privacy", "datenschutz",
                  "auth", "oidc", "passkey", "login", "sso", "permission", "authorization",
                  "encrypt", "verschlüssel", "cache", "offline", "push", "server-admin", "serveradmin",
                  "deployment", "deploy", "storage", "backup", "restore", "recovery", "migration", "migrate",
                  "websocket", "realtime", "real-time", "consent", "locked", "unlock", "concurrency",
                  "race", "idempot", "billing", "payment", "entitlement", "account deletion", "delete account",
                  "data loss", "datenverlust", "credential", "token", "session",
              ]
              large_design = ["epic", "relaunch", "redesign", "overhaul", "design system", "design-system"]
              small_ui = [
                  "polish", "copy", "wording", "text", "a11y", "accessibility", "barriere", "haptic",
                  "layout", "spacing", "icon", "avatar", "placeholder", "screenshot", " qa", "test", "docs",
                  "documentation", "dokumentation", "responsive", "typography", "typografie", "dark mode",
                  "darkmode", "styling", "farbe", "farben",
              ]

              if contains_any(signal, critical):
                  return ("GPT-5.6 Sol", "High", "Claude Sonnet 5", "Gemini 3.1 Pro", "High", "A")
              if contains_any(signal, large_design):
                  return ("Claude Sonnet 5", "High", "GPT-5.6 Sol", "Gemini 3.1 Pro", "High", "B+")
              if contains_any(signal, small_ui):
                  return ("Gemini 3.8 Flash", "Medium", "Claude Sonnet 5", "GPT-5.6 Sol", "Medium", "D")
              if title.startswith("fix") or " bug" in title or title.startswith("bug"):
                  return ("GPT-5.6 Sol", "High", "Claude Sonnet 5", "Gemini 3.8 Flash", "Medium", "C")
              return ("Claude Sonnet 5", "High", "GPT-5.6 Sol", "Gemini 3.8 Flash", "Medium", "B")

          issues = []
          page = 1
          while True:
              batch = request(f"{api}/repos/{repo}/issues?state=open&per_page=100&page={page}")
              issues.extend(issue for issue in batch if "pull_request" not in issue)
              if len(batch) < 100:
                  break
              page += 1

          updated = []
          skipped = []
          category_counts = {}

          for issue in issues:
              number = issue["number"]
              body = issue.get("body") or ""
              if "Model-Routing" in body or "Model Routing" in body:
                  skipped.append(number)
                  continue

              primary, reasoning, fallback, review, review_reasoning, category = route_for(issue)
              block = (
                  "## 🤖 Model-Routing\n\n"
                  f"- **Primärmodell:** `{primary}`\n"
                  f"- **Reasoning:** `{reasoning}`\n"
                  f"- **Alternative/Fallback:** `{fallback}`\n"
                  f"- **Review:** `{review}`\n"
                  f"- **Review-Reasoning:** `{review_reasoning}`\n\n"
                  "> Bei Modell-/Rate-Limit oder ungünstiger Verfügbarkeit direkt auf die Alternative wechseln. "
                  "Review nach Möglichkeit providerübergreifend durchführen."
              )
              if not body:
                  new_body = block
              elif body.endswith("\n"):
                  new_body = body + "\n" + block
              else:
                  new_body = body + "\n\n" + block

              request(
                  f"{api}/repos/{repo}/issues/{number}",
                  method="PATCH",
                  payload={"body": new_body},
              )
              updated.append(number)
              category_counts[category] = category_counts.get(category, 0) + 1
              time.sleep(0.15)

          print(f"open_issues={len(issues)}")
          print(f"already_routed={len(skipped)}")
          print(f"updated={len(updated)}")
          print("updated_numbers=" + ",".join(map(str, updated)))
          print("category_counts=" + json.dumps(category_counts, sort_keys=True))
          PY
