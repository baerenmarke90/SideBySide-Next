name: Temporary #863 Contract Sync

on:
  push:
    branches:
      - feat/863-moments-candidates

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[contract-sync]') }}
    runs-on: ubuntu-24.04
    env:
      PYTHON_VERSION: '3.13.7'
      UV_VERSION: '0.12.5'
      SBS_ENVIRONMENT: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/863-moments-candidates
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen
      - name: Write current OpenAPI contract
        working-directory: backend
        run: uv run --frozen python scripts/openapi_contract.py write
      - name: Regenerate Web and Android clients
        run: bash tools/openapi/generate.sh
      - name: Commit generated contract surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json web/src/api/generated android/api/generated
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(api): sync #863 generated contract [contract-sync]"
          git push origin HEAD:feat/863-moments-candidates
