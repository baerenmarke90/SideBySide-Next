name: M4 Sync Endpoint Matrix

on:
  push:
    branches: [feat/285-m4c-reminders-final]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/285-m4c-reminders-final

      - name: Add Reminder endpoints to tenant matrix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/integration/test_endpoint_matrix.py")
          text = path.read_text()

          text = text.replace(
              'PLAN = {"title": "Matrix Plan", "description": "Text"}\n',
              'PLAN = {"title": "Matrix Plan", "description": "Text"}\n'
              'REMINDER = {\n'
              '    "title": "Matrix Reminder",\n'
              '    "description": "Text",\n'
              '    "schedule": {\n'
              '        "type": "ANNUAL",\n'
              '        "month": 6,\n'
              '        "day": 13,\n'
              '        "localTime": "09:00:00",\n'
              '    },\n'
              '    "offsets": [7, 1],\n'
              '}\n',
          )

          text = text.replace(
              '    Endpoint(\n'
              '        "POST",\n'
              '        "/api/v1/spaces/{spaceId}/thinking-of-you",\n'
              '        body={"clientRequestId": str(uuid4())},\n'
              '    ),\n',
              '    Endpoint(\n'
              '        "POST",\n'
              '        "/api/v1/spaces/{spaceId}/thinking-of-you",\n'
              '        body={"clientRequestId": str(uuid4())},\n'
              '    ),\n'
              '    Endpoint("GET", "/api/v1/spaces/{spaceId}/reminders"),\n'
              '    Endpoint("POST", "/api/v1/spaces/{spaceId}/reminders", body=REMINDER),\n'
              '    Endpoint(\n'
              '        "GET",\n'
              '        "/api/v1/spaces/{spaceId}/reminders/{reminderId}",\n'
              '        resource_absence="REMINDER_NOT_FOUND",\n'
              '    ),\n'
              '    Endpoint(\n'
              '        "PUT",\n'
              '        "/api/v1/spaces/{spaceId}/reminders/{reminderId}",\n'
              '        body=REMINDER,\n'
              '        if_match=True,\n'
              '        resource_absence="REMINDER_NOT_FOUND",\n'
              '    ),\n'
              '    Endpoint(\n'
              '        "DELETE",\n'
              '        "/api/v1/spaces/{spaceId}/reminders/{reminderId}",\n'
              '        if_match=True,\n'
              '        resource_absence="REMINDER_NOT_FOUND",\n'
              '    ),\n'
              '    Endpoint(\n'
              '        "PUT",\n'
              '        "/api/v1/spaces/{spaceId}/reminders/{reminderId}/preference",\n'
              '        body={"muted": True},\n'
              '        resource_absence="REMINDER_NOT_FOUND",\n'
              '    ),\n',
          )

          text = text.replace(
              '    plan = client.post(f"{base_path}/plans", json=PLAN, headers=headers).json()\n',
              '    plan = client.post(f"{base_path}/plans", json=PLAN, headers=headers).json()\n'
              '    reminder = client.post(\n'
              '        f"{base_path}/reminders", json=REMINDER, headers=headers\n'
              '    ).json()\n',
          )

          text = text.replace(
              '            "planId": plan["id"],\n',
              '            "planId": plan["id"],\n'
              '            "reminderId": reminder["id"],\n',
          )

          text = text.replace(
              '            "planId",\n'
              '            "placeId",\n',
              '            "planId",\n'
              '            "reminderId",\n'
              '            "placeId",\n',
          )

          path.write_text(text)
          PY

      - name: Commit matrix synchronization
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- backend/tests/integration/test_endpoint_matrix.py; then
            echo "Endpoint matrix already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/integration/test_endpoint_matrix.py
          git commit -m "test(api): cover M4-C-S1 Reminder tenant routes"
          git push origin HEAD:feat/285-m4c-reminders-final
