name: M4 S2 Runtime Fix

on:
  push:
    branches: [feat/292-m4c-rules-occurrences-final]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/292-m4c-rules-occurrences-final
      - name: Apply runtime correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/sidebyside/reminders/runtime.py')
          text = path.read_text()
          text = text.replace(
              'desired = _desired_occurrences(reminder, account, parameters)',
              'desired = _desired_occurrences(session, reminder, account, parameters)',
          )
          text = text.replace(
              'def _desired_occurrences(\n    reminder: Reminder,',
              'def _desired_occurrences(\n    session: Session,\n    reminder: Reminder,',
          )
          text = text.replace(
              'profile = _relationship_profile(reminder.space_id)',
              'profile = _relationship_profile_for(session, reminder.space_id)',
          )
          start = text.find('\ndef _relationship_profile(space_id: UUID) -> None:\n')
          if start != -1:
              end = text.find('\ndef _timezone(', start)
              text = text[:start] + '\n' + text[end:]
          path.write_text(text)
          PY
          git diff --check
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/sidebyside/reminders/runtime.py
          git commit -m "fix(reminders): use session-aware relationship planning"
          git push origin HEAD:feat/292-m4c-rules-occurrences-final
