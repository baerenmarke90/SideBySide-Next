name: M5 S3 one-shot source repair

on:
  push:
    branches:
      - feat/300-m5-web-shared-planning

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repair App source and remove one-shot workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git checkout --quiet "${BRANCH}"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("web/src/App.tsx")
          content = path.read_bytes()
          broken = b"DET\xc1IL"
          occurrences = content.count(broken)
          if occurrences != 2:
              raise SystemExit(
                  f"Expected exactly two corrupted DETAIL identifiers, found {occurrences}"
              )
          content = content.replace(broken, b"DETAIL")
          path.write_bytes(content)
          path.read_text(encoding="utf-8")
          PY
          rm .github/workflows/s3-repair.yml .github/workflows/s3-quality-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx .github/workflows/s3-repair.yml .github/workflows/s3-quality-fix.yml
          git commit -m "fix(web): repair M5-S3 App source"
          git push --quiet origin "HEAD:${BRANCH}"
