name: M4 Search FTS Metadata Fix

on:
  push:
    branches:
      - fix/m4-search-fts-metadata-indexes

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"
  SBS_ENVIRONMENT: test
  SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
  SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Align ORM FTS expression indexes with migration 0028
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          migration_path = Path("backend/alembic/versions/0028_m4_search_indexes.py")
          migration_tree = ast.parse(migration_path.read_text(encoding="utf-8"))
          index_rows = None
          for node in migration_tree.body:
              if (
                  isinstance(node, ast.AnnAssign)
                  and isinstance(node.target, ast.Name)
                  and node.target.id == "_INDEXES"
              ):
                  index_rows = ast.literal_eval(node.value)
                  break
          if index_rows is None:
              raise SystemExit("Could not read canonical M4 Search index expressions from 0028")

          expressions = {name: expression for name, _table, expression in index_rows}
          if len(expressions) != 13:
              raise SystemExit(f"Expected 13 canonical M4 Search indexes, found {len(expressions)}")

          changed_files = []
          changed_indexes = 0

          for path in sorted(Path("backend/src/sidebyside").glob("*/models.py")):
              source = path.read_text(encoding="utf-8")
              if "_search_fts" not in source:
                  continue
              tree = ast.parse(source)
              lines = source.splitlines(keepends=True)
              line_offsets = [0]
              for line in lines:
                  line_offsets.append(line_offsets[-1] + len(line))

              replacements: list[tuple[int, int, str]] = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Name):
                      continue
                  if node.func.id != "Index" or len(node.args) < 2:
                      continue
                  if not isinstance(node.args[0], ast.Constant) or not isinstance(node.args[0].value, str):
                      continue
                  index_name = node.args[0].value
                  if index_name not in expressions:
                      continue
                  if not any(
                      keyword.arg == "postgresql_using"
                      and isinstance(keyword.value, ast.Constant)
                      and keyword.value.value == "gin"
                      for keyword in node.keywords
                  ):
                      raise SystemExit(f"M4 Search index is not PostgreSQL GIN: {index_name}")
                  text_call = node.args[1]
                  if (
                      not isinstance(text_call, ast.Call)
                      or not isinstance(text_call.func, ast.Name)
                      or text_call.func.id != "text"
                  ):
                      raise SystemExit(f"M4 Search index has unexpected ORM expression: {index_name}")
                  if text_call.end_lineno is None or text_call.end_col_offset is None:
                      raise SystemExit(f"Missing AST source span for {index_name}")
                  start = line_offsets[text_call.lineno - 1] + text_call.col_offset
                  end = line_offsets[text_call.end_lineno - 1] + text_call.end_col_offset
                  parts = expressions[index_name].split(" || ")
                  chunks = []
                  for position, part in enumerate(parts):
                      prefix = "(" if position == 0 else ""
                      suffix = ")" if position == len(parts) - 1 else " || "
                      chunks.append(prefix + part + suffix)
                  inner_indent = " " * (text_call.col_offset + 4)
                  closing_indent = " " * text_call.col_offset
                  replacement = "text(\n"
                  replacement += "".join(
                      f"{inner_indent}{json.dumps(chunk)}\n" for chunk in chunks
                  )
                  replacement += f"{closing_indent})"
                  replacements.append((start, end, replacement))

              if replacements:
                  updated = source
                  for start, end, replacement in sorted(replacements, reverse=True):
                      updated = updated[:start] + replacement + updated[end:]
                  if updated != source:
                      path.write_text(updated, encoding="utf-8")
                      changed_files.append(str(path))
                      changed_indexes += len(replacements)

          if changed_indexes != 13:
              raise SystemExit(f"Expected to correct 13 M4 Search ORM indexes, corrected {changed_indexes}")
          print(f"Corrected {changed_indexes} FTS indexes across {len(changed_files)} model files")
          PY
      - name: Validate Search metadata and integration coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$UV_VERSION"
          (
            cd backend
            uv lock --check
            uv sync --frozen
            uv run --frozen ruff format src/sidebyside/*/models.py
            uv run --frozen ruff check src/sidebyside
            uv run --frozen ruff format --check src/sidebyside
            uv run --frozen mypy src/sidebyside
            uv run --frozen alembic upgrade head
            uv run --frozen alembic check
            uv run --frozen pytest -m integration -q tests/integration/test_search.py
            uv run --frozen pytest -m integration -q tests/integration/test_endpoint_matrix.py
          )
      - name: Commit validated M4 Search metadata fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/m4-search-fts-metadata-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(search): align ORM FTS index expressions with PostgreSQL"
          git push origin HEAD:fix/m4-search-fts-metadata-indexes
