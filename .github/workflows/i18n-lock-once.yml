name: I18n Lockfile One Shot

on:
  push:
    branches:
      - feat/i18n-foundation-180
    paths:
      - web/package.json
      - .github/workflows/i18n-lock-once.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    env:
      REPO_DIR: /__w/SideBySide-Next/SideBySide-Next
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Git fuer Checkout bereitstellen
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/i18n-foundation-180

      - name: Lockfile mit gepinnten Abhaengigkeiten aktualisieren
        run: |
          cd "$REPO_DIR/web"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Dependency-Dokumentation synchronisieren
        run: |
          cd "$REPO_DIR"
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/DEPENDENCIES.md';
          let text = fs.readFileSync(path, 'utf8');
          const anchor = '| @tanstack/react-query | 5.85.5 | npm | MIT |\n';
          const addition = '| i18next | 26.4.0 | npm | MIT |\n| react-i18next | 17.0.11 | npm | MIT |\n';
          if (!text.includes('| i18next | 26.4.0 | npm | MIT |')) {
            if (!text.includes(anchor)) throw new Error('Web dependency table anchor missing');
            text = text.replace(anchor, anchor + addition);
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Erzeugte Dateien auf Feature-Branch schreiben
        run: |
          cd "$REPO_DIR"
          node <<'NODE'
          const fs = require('fs');
          const owner = 'baerenmarke90';
          const repo = 'SideBySide-Next';
          const branch = 'feat/i18n-foundation-180';
          const token = process.env.GH_TOKEN;
          const api = 'https://api.github.com';

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(options.headers || {}),
              },
            });
            if (!response.ok) {
              throw new Error(`${options.method || 'GET'} ${url}: ${response.status} ${await response.text()}`);
            }
            return response.json();
          }

          async function update(path, message) {
            const encodedPath = path.split('/').map(encodeURIComponent).join('/');
            const current = await request(`${api}/repos/${owner}/${repo}/contents/${encodedPath}?ref=${encodeURIComponent(branch)}`);
            const content = fs.readFileSync(path).toString('base64');
            await request(`${api}/repos/${owner}/${repo}/contents/${encodedPath}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message, content, sha: current.sha, branch }),
            });
          }

          await update('web/package-lock.json', 'build(web): lock i18n dependencies');
          await update('docs/DEPENDENCIES.md', 'docs(deps): document i18n dependencies');
          NODE
