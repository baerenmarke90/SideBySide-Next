name: M5 Remove Space ID Config

on:
  push:
    branches:
      - feat/298-m5-web-space-context

permissions:
  contents: write

jobs:
  patch:
    name: Remove obsolete Space ID configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/298-m5-web-space-context
          fetch-depth: 0

      - name: Update deployment configuration and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "web/Dockerfile",
              'ARG VITE_SBS_API_BASE_URL=""\nARG VITE_SBS_SPACE_ID=""\nENV VITE_SBS_API_BASE_URL=${VITE_SBS_API_BASE_URL}\nENV VITE_SBS_SPACE_ID=${VITE_SBS_SPACE_ID}\n',
              'ARG VITE_SBS_API_BASE_URL=""\nENV VITE_SBS_API_BASE_URL=${VITE_SBS_API_BASE_URL}\n',
          )

          for path in ("compose.yaml", "compose.arcane.yaml"):
              replace(
                  path,
                  '    args:\n      VITE_SBS_API_BASE_URL: ""\n      VITE_SBS_SPACE_ID: "${SBS_WEB_SPACE_ID:-}"\n',
                  '    args:\n      VITE_SBS_API_BASE_URL: ""\n',
              )

          replace(
              ".env.example",
              '# Der G2-Referenzflow hat bewusst noch keine Space-Auswahl. Diese nicht geheime\n# UUID wird beim Image-Build eingebettet. Ohne Wert startet der Webdienst\n# trotzdem und zeigt einen klaren Betreiberhinweis.\nSBS_WEB_SPACE_ID=\n\n',
              '',
          )

          replace(
              "web/README.md",
              '- `VITE_SBS_API_BASE_URL` — API base URL; an empty value uses same-origin.\n- `VITE_SBS_SPACE_ID` — reference Space for the current M2 Web slice.\n\nAccess and refresh tokens remain exclusively in ephemeral React state.',
              '- `VITE_SBS_API_BASE_URL` — API base URL; an empty value uses same-origin.\n\nThe active Space is derived only after authentication from the account\'s server-authorized Memberships; it is not a build-time or operator value.\nAccess and refresh tokens remain exclusively in ephemeral React state.',
          )
          replace(
              "web/README.md",
              'The current M2 Web slice still requires a known Space UUID:\n\n```dotenv\nSBS_WEB_SPACE_ID=00000000-0000-0000-0000-000000000000\n```\n\nBecause Vite embeds this operator value at build time, changing it requires\n`docker compose up -d --build web`. The UUID is not a secret; access and refresh\ntokens remain exclusively in ephemeral browser state.\n\n',
              'After sign-in, the Web client discovers the account\'s active Memberships through\nthe authenticated API and uses only a server-authorized Space ID. No Space UUID\nis embedded in the Web image or configured by the operator.\n\n',
          )

          replace(
              "docs/SELF-HOSTING.md",
              'The Web start page is visible without Space configuration. The technical\nlogin/Memory/image/Story flow becomes active only after `SBS_WEB_SPACE_ID` in\n`.env` is set to an existing Space UUID and the image is rebuilt with\n`docker compose up -d --build web`.\n',
              'The Web start page requires no Space configuration. After authentication, the\nclient discovers the account\'s active Memberships through the API and uses only\na server-authorized Space. No Space UUID is embedded in the Web image.\n',
          )
          replace(
              "docs/SELF-HOSTING.md",
              'SBS_WEB_SPACE_ID=...              # existing Space UUID for the G2 reference flow\n\n',
              '',
          )
          replace(
              "docs/SELF-HOSTING.md",
              '`--build` is required for the PoC because the operator Space ID is embedded at\nVite build time.\n',
              '`--build` ensures the deployed Web and backend images match the selected source revision.\n',
          )

          replace(
              "docs/ARCANE.md",
              '## Web reference flow\n\nThe current Web reference flow still requires an existing Space UUID as build\nconfiguration:\n\n```dotenv\nSBS_WEB_SPACE_ID=<space-uuid>\n```\n\nThe UUID is not a secret. It is embedded in the Web bundle during the Vite\nbuild. A container restart is therefore insufficient after a change; the Web\nimage must be rebuilt.\n',
              '## Web Space context\n\nThe Web client does not accept an operator-provided Space UUID. After\nauthentication it discovers the account\'s active Memberships through the API\nand uses only a server-authorized Space. Arcane therefore needs no Space-specific\nWeb build argument or environment value.\n',
          )
          PY

          if grep -R -n -E 'SBS_WEB_SPACE_ID|VITE_SBS_SPACE_ID' \
            .env.example compose.yaml compose.arcane.yaml web docs/SELF-HOSTING.md docs/ARCANE.md; then
            echo "Obsolete Web Space ID configuration remains in an active surface."
            exit 1
          fi

      - name: Commit cleanup and remove this one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m5-remove-space-id-config.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example compose.yaml compose.arcane.yaml web/Dockerfile web/README.md docs/SELF-HOSTING.md docs/ARCANE.md
          git commit -m "refactor(web): remove build-time Space ID configuration"
          git push origin HEAD:feat/298-m5-web-space-context
