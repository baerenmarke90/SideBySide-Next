name: Finish 748 Android wiring

on:
  push:
    branches:
      - work/748-finish

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/748-finish
          fetch-depth: 0

      - name: Wire Android recent authentication
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          # OkHttp adapter: same authenticated DeviceSession, no client-side grant token.
          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/OkHttpReferenceApi.kt",
              "import kotlinx.serialization.json.JsonNull\nimport kotlinx.serialization.json.JsonPrimitive\nimport kotlinx.serialization.json.buildJsonObject\n",
              "import kotlinx.serialization.json.JsonNull\nimport kotlinx.serialization.json.JsonObject\nimport kotlinx.serialization.json.JsonPrimitive\nimport kotlinx.serialization.json.buildJsonObject\nimport kotlinx.serialization.json.jsonArray\nimport kotlinx.serialization.json.jsonPrimitive\n",
          )
          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/OkHttpReferenceApi.kt",
              ") : ReferenceContract {\n",
              ") : ReferenceContract, AccountDeletionRecentAuthenticationContract {\n",
          )
          ok_http_methods = r'''
    override suspend fun accountDeletionRecentAuthenticationCapabilities(
        accessToken: String,
    ): AccountDeletionRecentAuthenticationCapabilities {
        val payload = executeJson(
            authenticatedRequest(
                "$baseUrl/api/v1/auth/recent-authentication/account-deletion?client=android",
                accessToken,
            ).get().build(),
            JsonObject.serializer(),
        )
        return AccountDeletionRecentAuthenticationCapabilities(
            localPassword = payload["localPassword"]?.jsonPrimitive?.content == "true",
            passkey = payload["passkey"]?.jsonPrimitive?.content == "true",
            oidcConnections = payload["oidcConnections"]
                ?.jsonArray
                ?.map { it.jsonPrimitive.content }
                .orEmpty(),
        )
    }

    override suspend fun accountDeletionRecentAuthenticationPassword(
        accessToken: String,
        password: String,
    ) {
        val body = buildJsonObject { put("password", JsonPrimitive(password)) }
        executeEmpty(
            authenticatedRequest(
                "$baseUrl/api/v1/auth/recent-authentication/account-deletion/password",
                accessToken,
            ).post(body.toString().toRequestBody(jsonMediaType)).build(),
        )
    }

    override suspend fun startAccountDeletionRecentAuthenticationPasskey(
        accessToken: String,
    ): String = executeJson(
        authenticatedRequest(
            "$baseUrl/api/v1/auth/recent-authentication/account-deletion/passkeys/start",
            accessToken,
        ).post(EMPTY_JSON_BODY.toRequestBody(jsonMediaType)).build(),
        JsonObject.serializer(),
    ).toString()

    override suspend fun finishAccountDeletionRecentAuthenticationPasskey(
        accessToken: String,
        authenticationResponseJson: String,
    ) {
        val credential = SideBySideJson.parseToJsonElement(authenticationResponseJson)
        val body = buildJsonObject { put("credential", credential) }
        executeEmpty(
            authenticatedRequest(
                "$baseUrl/api/v1/auth/recent-authentication/account-deletion/passkeys/finish",
                accessToken,
            ).post(body.toString().toRequestBody(jsonMediaType)).build(),
        )
    }

    override suspend fun startAccountDeletionRecentAuthenticationOidc(
        accessToken: String,
        connectionId: String,
    ): AccountDeletionOidcStart {
        val encodedConnection = java.net.URLEncoder
            .encode(connectionId, Charsets.UTF_8.name())
            .replace("+", "%20")
        val payload = executeJson(
            authenticatedRequest(
                "$baseUrl/api/v1/auth/recent-authentication/account-deletion/oidc/$encodedConnection/start?client=android",
                accessToken,
            ).post(EMPTY_JSON_BODY.toRequestBody(jsonMediaType)).build(),
            JsonObject.serializer(),
        )
        return AccountDeletionOidcStart(
            authorizationUrl = payload.getValue("authorizationUrl").jsonPrimitive.content,
            state = payload.getValue("state").jsonPrimitive.content,
        )
    }

    override suspend fun finishAccountDeletionRecentAuthenticationOidc(
        accessToken: String,
        connectionId: String,
        code: String,
        state: String,
    ) {
        val encodedConnection = java.net.URLEncoder
            .encode(connectionId, Charsets.UTF_8.name())
            .replace("+", "%20")
        val body = buildJsonObject {
            put("code", JsonPrimitive(code))
            put("state", JsonPrimitive(state))
        }
        executeEmpty(
            authenticatedRequest(
                "$baseUrl/api/v1/auth/recent-authentication/account-deletion/oidc/$encodedConnection/callback",
                accessToken,
            ).post(body.toString().toRequestBody(jsonMediaType)).build(),
        )
    }

'''
          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/OkHttpReferenceApi.kt",
              "    override suspend fun deleteOwnAccount(\n",
              ok_http_methods + "    override suspend fun deleteOwnAccount(\n",
          )

          # ViewModel state and orchestration. Platform UI gets challenges/URLs, never bearer tokens.
          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/ReferenceViewModel.kt",
              "    val accountDeletionBusy: Boolean = false,\n    val accountDeletionProblem: UiProblem? = null,\n",
              "    val accountDeletionBusy: Boolean = false,\n    val accountDeletionProblem: UiProblem? = null,\n    val accountDeletionRecentAuthenticationCapabilities: AccountDeletionRecentAuthenticationCapabilities? = null,\n    val accountDeletionRecentAuthenticationBusy: Boolean = false,\n    val accountDeletionRecentAuthenticationProblem: UiProblem? = null,\n    val accountDeletionRecentAuthenticationComplete: Boolean = false,\n    val accountDeletionPasskeyRequest: String? = null,\n    val accountDeletionOidcPending: AccountDeletionOidcPending? = null,\n",
          )
          view_model_methods = r'''
    fun resetAccountDeletionRecentAuthentication() {
        mutate {
            it.copy(
                accountDeletionRecentAuthenticationCapabilities = null,
                accountDeletionRecentAuthenticationBusy = false,
                accountDeletionRecentAuthenticationProblem = null,
                accountDeletionRecentAuthenticationComplete = false,
                accountDeletionPasskeyRequest = null,
                accountDeletionOidcPending = null,
            )
        }
    }

    fun loadAccountDeletionRecentAuthentication() {
        val api = contract as? AccountDeletionRecentAuthenticationContract ?: return configurationError()
        val currentSession = session ?: return
        val operationEpoch = sessionEpoch
        mutate {
            it.copy(
                accountDeletionRecentAuthenticationBusy = true,
                accountDeletionRecentAuthenticationProblem = null,
                accountDeletionRecentAuthenticationComplete = false,
            )
        }
        viewModelScope.launch {
            runCatching {
                api.accountDeletionRecentAuthenticationCapabilities(currentSession.tokens.accessToken)
            }.onSuccess { capabilities ->
                if (!isCurrentSession(operationEpoch, currentSession)) return@onSuccess
                mutate {
                    it.copy(
                        accountDeletionRecentAuthenticationCapabilities = capabilities,
                        accountDeletionRecentAuthenticationBusy = false,
                    )
                }
            }.onFailure { throwable ->
                if (!isCurrentSession(operationEpoch, currentSession)) return@onFailure
                mutate {
                    it.copy(
                        accountDeletionRecentAuthenticationBusy = false,
                        accountDeletionRecentAuthenticationProblem = problemFor(throwable),
                    )
                }
            }
        }
    }

    fun authenticateAccountDeletionPassword(password: String) {
        val api = contract as? AccountDeletionRecentAuthenticationContract ?: return configurationError()
        val currentSession = session ?: return
        val operationEpoch = sessionEpoch
        mutate {
            it.copy(
                accountDeletionRecentAuthenticationBusy = true,
                accountDeletionRecentAuthenticationProblem = null,
            )
        }
        viewModelScope.launch {
            runCatching {
                api.accountDeletionRecentAuthenticationPassword(currentSession.tokens.accessToken, password)
            }.onSuccess {
                if (!isCurrentSession(operationEpoch, currentSession)) return@onSuccess
                mutate {
                    it.copy(
                        accountDeletionRecentAuthenticationBusy = false,
                        accountDeletionRecentAuthenticationComplete = true,
                    )
                }
            }.onFailure { throwable ->
                if (!isCurrentSession(operationEpoch, currentSession)) return@onFailure
                mutate {
                    it.copy(
                        accountDeletionRecentAuthenticationBusy = false,
                        accountDeletionRecentAuthenticationProblem = problemFor(throwable),
                    )
                }
            }
        }
    }

    fun startAccountDeletionPasskey() {
        val api = contract as? AccountDeletionRecentAuthenticationContract ?: return configurationError()
        val currentSession = session ?: return
        val operationEpoch = sessionEpoch
        mutate {
            it.copy(
                accountDeletionRecentAuthenticationBusy = true,
                accountDeletionRecentAuthenticationProblem = null,
                accountDeletionPasskeyRequest = null,
            )
        }
        viewModelScope.launch {
            runCatching {
                api.startAccountDeletionRecentAuthenticationPasskey(currentSession.tokens.accessToken)
            }.onSuccess { requestJson ->
                if (!isCurrentSession(operationEpoch, currentSession)) return@onSuccess
                mutate {
                    it.copy(
                        accountDeletionRecentAuthenticationBusy = false,
                        accountDeletionPasskeyRequest = requestJson,
                    )
                }
            }.onFailure { throwable ->
                if (!isCurrentSession(operationEpoch, currentSession)) return@onFailure
                failAccountDeletionRecentAuthentication(throwable)
            }
        }
    }

    fun finishAccountDeletionPasskey(authenticationResponseJson: String) {
        val api = contract as? AccountDeletionRecentAuthenticationContract ?: return configurationError()
        val currentSession = session ?: return
        val operationEpoch = sessionEpoch
        mutate {
            it.copy(
                accountDeletionRecentAuthenticationBusy = true,
                accountDeletionRecentAuthenticationProblem = null,
                accountDeletionPasskeyRequest = null,
            )
        }
        viewModelScope.launch {
            runCatching {
                api.finishAccountDeletionRecentAuthenticationPasskey(
                    currentSession.tokens.accessToken,
                    authenticationResponseJson,
                )
            }.onSuccess {
                if (!isCurrentSession(operationEpoch, currentSession)) return@onSuccess
                mutate {
                    it.copy(
                        accountDeletionRecentAuthenticationBusy = false,
                        accountDeletionRecentAuthenticationComplete = true,
                    )
                }
            }.onFailure { throwable ->
                if (!isCurrentSession(operationEpoch, currentSession)) return@onFailure
                failAccountDeletionRecentAuthentication(throwable)
            }
        }
    }

    fun startAccountDeletionOidc(connectionId: String) {
        val api = contract as? AccountDeletionRecentAuthenticationContract ?: return configurationError()
        val currentSession = session ?: return
        val operationEpoch = sessionEpoch
        mutate {
            it.copy(
                accountDeletionRecentAuthenticationBusy = true,
                accountDeletionRecentAuthenticationProblem = null,
                accountDeletionOidcPending = null,
            )
        }
        viewModelScope.launch {
            runCatching {
                api.startAccountDeletionRecentAuthenticationOidc(
                    currentSession.tokens.accessToken,
                    connectionId,
                )
            }.onSuccess { started ->
                if (!isCurrentSession(operationEpoch, currentSession)) return@onSuccess
                mutate {
                    it.copy(
                        accountDeletionRecentAuthenticationBusy = false,
                        accountDeletionOidcPending = AccountDeletionOidcPending(
                            connectionId = connectionId,
                            authorizationUrl = started.authorizationUrl,
                            state = started.state,
                        ),
                    )
                }
            }.onFailure { throwable ->
                if (!isCurrentSession(operationEpoch, currentSession)) return@onFailure
                failAccountDeletionRecentAuthentication(throwable)
            }
        }
    }

    fun finishAccountDeletionOidc(code: String, state: String) {
        val pending = _uiState.value.accountDeletionOidcPending ?: return
        if (pending.state != state) {
            failAccountDeletionRecentAuthentication(IllegalArgumentException("OIDC state mismatch"))
            return
        }
        val api = contract as? AccountDeletionRecentAuthenticationContract ?: return configurationError()
        val currentSession = session ?: return
        val operationEpoch = sessionEpoch
        mutate {
            it.copy(
                accountDeletionRecentAuthenticationBusy = true,
                accountDeletionRecentAuthenticationProblem = null,
            )
        }
        viewModelScope.launch {
            runCatching {
                api.finishAccountDeletionRecentAuthenticationOidc(
                    currentSession.tokens.accessToken,
                    pending.connectionId,
                    code,
                    state,
                )
            }.onSuccess {
                if (!isCurrentSession(operationEpoch, currentSession)) return@onSuccess
                mutate {
                    it.copy(
                        accountDeletionRecentAuthenticationBusy = false,
                        accountDeletionRecentAuthenticationComplete = true,
                        accountDeletionOidcPending = null,
                    )
                }
            }.onFailure { throwable ->
                if (!isCurrentSession(operationEpoch, currentSession)) return@onFailure
                failAccountDeletionRecentAuthentication(throwable)
            }
        }
    }

    fun failAccountDeletionRecentAuthentication(throwable: Throwable) {
        mutate {
            it.copy(
                accountDeletionRecentAuthenticationBusy = false,
                accountDeletionRecentAuthenticationProblem = problemFor(throwable),
                accountDeletionPasskeyRequest = null,
                accountDeletionOidcPending = null,
            )
        }
    }

'''
          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/ReferenceViewModel.kt",
              "    fun deleteOwnAccount() {\n",
              view_model_methods + "    fun deleteOwnAccount() {\n",
          )

          # Credential Manager is the standard Android WebAuthn bridge.
          replace_once(
              "android/app/build.gradle.kts",
              '    implementation("androidx.navigation:navigation-compose:2.10.0")\n',
              '    implementation("androidx.navigation:navigation-compose:2.10.0")\n    implementation("androidx.credentials:credentials:1.6.0")\n',
          )

          # Deep-link returns the provider authorization code to the existing DeviceSession.
          replace_once(
              "android/app/src/main/AndroidManifest.xml",
              '        <activity\n            android:name=".MainActivity"\n            android:exported="true">\n',
              '        <activity\n            android:name=".MainActivity"\n            android:exported="true"\n            android:launchMode="singleTop">\n',
          )
          replace_once(
              "android/app/src/main/AndroidManifest.xml",
              '                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n',
              '                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data\n                    android:scheme="de.sidebyside.app"\n                    android:host="recent-authentication"\n                    android:path="/oidc" />\n            </intent-filter>\n',
          )

          # Copy for the new Android step-up screen.
          strings = Path("android/app/src/main/res/values/strings.xml")
          text = strings.read_text(encoding="utf-8")
          additions = '''    <string name="account_delete_reauth_title">Identität bestätigen</string>\n    <string name="account_delete_reauth_intro">Bestätige deine Identität erneut. Welche Methode verfügbar ist, entscheidet der Server für dieses Konto und diese Sitzung.</string>\n    <string name="account_delete_reauth_loading">Verfügbare Anmeldemethoden werden geladen …</string>\n    <string name="account_delete_reauth_password_label">Aktuelles Passwort</string>\n    <string name="account_delete_reauth_password_action">Mit Passwort bestätigen</string>\n    <string name="account_delete_reauth_passkey_action">Mit Passkey bestätigen</string>\n    <string name="account_delete_reauth_oidc_action">Mit %1$s erneut anmelden</string>\n    <string name="account_delete_reauth_unavailable">Für dieses Konto ist auf Android aktuell keine Methode zur erneuten Identitätsbestätigung verfügbar. Die Kontolöschung bleibt gesperrt.</string>\n    <string name="account_delete_reauth_pending">Identität wird bestätigt …</string>\n'''
          if 'name="account_delete_reauth_title"' not in text:
              marker = '    <string name="account_delete_confirmation_title">'
              index = text.find(marker)
              if index < 0:
                  raise SystemExit("account deletion string anchor not found")
              text = text[:index] + additions + text[index:]
              strings.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/finish-748-android-wire.yml

      - name: Commit Android wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(android): wire recent authentication before Account deletion"
          git push origin HEAD:work/748-finish
