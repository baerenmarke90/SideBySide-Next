name: Temporary 682 account-space retention fix

on:
  push:
    branches:
      - fix/682-forget-space-preference-after-account-deletion

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK 37.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Apply #682 implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          store_path = Path("android/app/src/main/java/de/sidebyside/next/reference/SpacePreferenceStore.kt")
          store = store_path.read_text(encoding="utf-8")

          old = """interface SpacePreferenceStore {
              fun rememberedSpace(accountId: UUID): UUID?

              fun rememberSpace(accountId: UUID, spaceId: UUID)
          }
          """
          new = """interface SpacePreferenceStore {
              fun rememberedSpace(accountId: UUID): UUID?

              fun rememberSpace(accountId: UUID, spaceId: UUID)

              /** Removes only this Account's remembered Space selection. */
              fun forgetAccount(accountId: UUID)
          }
          """
          if old not in store:
              raise SystemExit("SpacePreferenceStore interface context changed")
          store = store.replace(old, new, 1)

          old = """ * The default for [ReferenceViewModel] so existing and new unit tests keep
           * resolving to the first ACTIVE membership without needing a Context —
           * exactly one fresh instance per ViewModel, never a shared singleton, so one
           * test's remembered Space can never leak into another's.
          """
          new = """ * The default for [ReferenceViewModel] so unit tests can model an explicit
           * remembered Space without needing a Context. Exactly one fresh instance is
           * created per ViewModel, never a shared singleton, so one test's preference
           * can never leak into another's.
          """
          if old not in store:
              raise SystemExit("InMemorySpacePreferenceStore comment context changed")
          store = store.replace(old, new, 1)

          old = """    override fun rememberSpace(accountId: UUID, spaceId: UUID) {
                  remembered[accountId] = spaceId
              }
          }
          """
          new = """    override fun rememberSpace(accountId: UUID, spaceId: UUID) {
                  remembered[accountId] = spaceId
              }

              override fun forgetAccount(accountId: UUID) {
                  remembered.remove(accountId)
              }
          }
          """
          if old not in store:
              raise SystemExit("InMemorySpacePreferenceStore implementation context changed")
          store = store.replace(old, new, 1)

          old = """    override fun rememberSpace(accountId: UUID, spaceId: UUID) {
                  prefs.edit().putString(accountId.toString(), spaceId.toString()).apply()
              }

              private companion object {
          """
          new = """    override fun rememberSpace(accountId: UUID, spaceId: UUID) {
                  prefs.edit().putString(accountId.toString(), spaceId.toString()).apply()
              }

              override fun forgetAccount(accountId: UUID) {
                  prefs.edit().remove(accountId.toString()).apply()
              }

              private companion object {
          """
          if old not in store:
              raise SystemExit("SharedPreferencesSpaceStore implementation context changed")
          store = store.replace(old, new, 1)
          store_path.write_text(store, encoding="utf-8")

          vm_path = Path("android/app/src/main/java/de/sidebyside/next/reference/ReferenceViewModel.kt")
          vm = vm_path.read_text(encoding="utf-8")
          old = """                .onSuccess {
                      if (!isCurrentSession(operationEpoch, currentSession)) return@onSuccess
                      // The server has crossed the irreversible tombstone boundary and
                      // revoked this session. Reuse the existing logout transition to
                      // invalidate in-flight work, drafts, Room/protected caches and UI state.
                      logout()
                  }
          """
          new = """                .onSuccess {
                      // Server acceptance belongs to the captured Account even if the UI
                      // moved to another session while the request was in flight. Remove
                      // only that Account's durable Space preference before touching UI state.
                      spaceStore.forgetAccount(currentSession.account.id)
                      if (!isCurrentSession(operationEpoch, currentSession)) return@onSuccess
                      // The server has crossed the irreversible tombstone boundary and
                      // revoked this session. Reuse the existing logout transition to
                      // invalidate in-flight work, drafts, Room/protected caches and UI state.
                      logout()
                  }
          """
          if old not in vm:
              raise SystemExit("Account deletion success context changed")
          vm = vm.replace(old, new, 1)
          vm_path.write_text(vm, encoding="utf-8")
          PY

          cat > android/app/src/test/java/de/sidebyside/next/reference/SpacePreferenceDeletionTest.kt <<'EOF'
          package de.sidebyside.next.reference

          import android.content.Context
          import androidx.test.core.app.ApplicationProvider
          import java.util.UUID
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.ExperimentalCoroutinesApi
          import kotlinx.coroutines.test.StandardTestDispatcher
          import kotlinx.coroutines.test.advanceUntilIdle
          import kotlinx.coroutines.test.resetMain
          import kotlinx.coroutines.test.runTest
          import kotlinx.coroutines.test.setMain
          import org.junit.After
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Before
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.annotation.Config
          import sidebyside.api.models.AccountDeletionAccepted
          import sidebyside.api.models.AccountDeletionRequest
          import sidebyside.api.models.AccountDeletionStatus
          import sidebyside.api.models.AccountMembershipView
          import sidebyside.api.models.AccountView
          import sidebyside.api.models.SessionView
          import sidebyside.api.models.StoryPage
          import sidebyside.api.models.TokenView

          private const val SPACE_PREFERENCE_DELETION_BASE_URL = "https://sidebyside.example"
          private val SPACE_PREFERENCE_DELETION_SPACE: UUID = UUID.fromString("11111111-1111-4111-8111-111111111111")
          private val OTHER_SPACE_PREFERENCE_DELETION_SPACE: UUID = UUID.fromString("22222222-2222-4222-8222-222222222222")

          @OptIn(ExperimentalCoroutinesApi::class)
          @RunWith(RobolectricTestRunner::class)
          @Config(sdk = [35])
          class SpacePreferenceDeletionTest {
              private val dispatcher = StandardTestDispatcher()
              private val context: Context get() = ApplicationProvider.getApplicationContext()

              @Before
              fun setUp() = Dispatchers.setMain(dispatcher)

              @After
              fun tearDown() = Dispatchers.resetMain()

              @Test
              fun acceptedDeletionRemovesOnlyDeletedAccountsPersistentPreference() = runTest(dispatcher) {
                  val api = PreferenceDeletionApi(accountId = UUID.randomUUID())
                  val otherAccountId = UUID.randomUUID()
                  val store = SharedPreferencesSpaceStore(context)
                  store.rememberSpace(api.accountId, SPACE_PREFERENCE_DELETION_SPACE)
                  store.rememberSpace(otherAccountId, OTHER_SPACE_PREFERENCE_DELETION_SPACE)
                  val model = model(api, store)

                  model.signIn("someone@example.test", "secret")
                  advanceUntilIdle()
                  model.deleteOwnAccount()
                  advanceUntilIdle()

                  assertNull(store.rememberedSpace(api.accountId))
                  assertEquals(
                      OTHER_SPACE_PREFERENCE_DELETION_SPACE,
                      store.rememberedSpace(otherAccountId),
                  )
                  assertFalse(model.uiState.value.loggedIn)

                  // Removing an already-absent Account mapping is deliberately idempotent.
                  store.forgetAccount(api.accountId)
                  assertNull(store.rememberedSpace(api.accountId))
              }

              @Test
              fun rejectedDeletionRetainsPersistentPreference() = runTest(dispatcher) {
                  val api = PreferenceDeletionApi(
                      accountId = UUID.randomUUID(),
                      deletionFailure = ReferenceApiException(
                          code = "ACCOUNT_DELETION_AUTHORITY_UNAVAILABLE",
                          message = "unavailable",
                          status = 503,
                      ),
                  )
                  val store = SharedPreferencesSpaceStore(context)
                  store.rememberSpace(api.accountId, SPACE_PREFERENCE_DELETION_SPACE)
                  val model = model(api, store)

                  model.signIn("someone@example.test", "secret")
                  advanceUntilIdle()
                  model.deleteOwnAccount()
                  advanceUntilIdle()

                  assertEquals(
                      SPACE_PREFERENCE_DELETION_SPACE,
                      store.rememberedSpace(api.accountId),
                  )
                  assertTrue(model.uiState.value.loggedIn)
              }

              @Test
              fun ordinaryLogoutRetainsPersistentPreference() = runTest(dispatcher) {
                  val api = PreferenceDeletionApi(accountId = UUID.randomUUID())
                  val store = SharedPreferencesSpaceStore(context)
                  store.rememberSpace(api.accountId, SPACE_PREFERENCE_DELETION_SPACE)
                  val model = model(api, store)

                  model.signIn("someone@example.test", "secret")
                  advanceUntilIdle()
                  model.logout()

                  assertEquals(
                      SPACE_PREFERENCE_DELETION_SPACE,
                      store.rememberedSpace(api.accountId),
                  )
                  assertFalse(model.uiState.value.loggedIn)
              }

              @Test
              fun inMemoryForgetIsIdempotentAndAccountScoped() {
                  val deletedAccountId = UUID.randomUUID()
                  val otherAccountId = UUID.randomUUID()
                  val store = InMemorySpacePreferenceStore()
                  store.rememberSpace(deletedAccountId, SPACE_PREFERENCE_DELETION_SPACE)
                  store.rememberSpace(otherAccountId, OTHER_SPACE_PREFERENCE_DELETION_SPACE)

                  store.forgetAccount(deletedAccountId)
                  store.forgetAccount(deletedAccountId)

                  assertNull(store.rememberedSpace(deletedAccountId))
                  assertEquals(
                      OTHER_SPACE_PREFERENCE_DELETION_SPACE,
                      store.rememberedSpace(otherAccountId),
                  )
              }

              private fun model(
                  api: ReferenceContract,
                  store: SpacePreferenceStore,
              ) = ReferenceViewModel(
                  config = ReferenceConfig(SPACE_PREFERENCE_DELETION_BASE_URL),
                  api = api,
                  spaceStore = store,
              )
          }

          private class PreferenceDeletionApi(
              val accountId: UUID,
              private val deletionFailure: Throwable? = null,
          ) : FakeReferenceContract() {
              override suspend fun signIn(email: String, password: String): SessionView = SessionView(
                  account = AccountView(displayName = "Someone", id = accountId),
                  tokens = TokenView(
                      accessExpiresAt = java.time.OffsetDateTime.now(),
                      accessToken = "access",
                      refreshExpiresAt = java.time.OffsetDateTime.now(),
                      refreshToken = "refresh",
                  ),
              )

              override suspend fun listMemberships(accessToken: String): List<AccountMembershipView> =
                  listOf(
                      AccountMembershipView(
                          role = "PARTNER",
                          spaceId = SPACE_PREFERENCE_DELETION_SPACE,
                          status = "ACTIVE",
                      ),
                  )

              override suspend fun getTimeline(
                  spaceId: UUID,
                  accessToken: String,
                  cursor: String?,
              ): StoryPage = StoryPage(hasMore = false, items = emptyList(), nextCursor = null)

              override suspend fun deleteOwnAccount(
                  accessToken: String,
                  request: AccountDeletionRequest,
              ): AccountDeletionAccepted {
                  deletionFailure?.let { throw it }
                  return AccountDeletionAccepted(
                      acceptedAt = java.time.OffsetDateTime.now(),
                      status = AccountDeletionStatus.PENDING,
                  )
              }
          }
          EOF

          git rm .github/workflows/tmp-682-account-space-retention.yml
          git diff --check

      - name: Full Android unit suite
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:testDebugUnitTest

      - name: Commit validated #682 implementation
        run: |
          set -euo pipefail
          git config user.name "SideBySide CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/de/sidebyside/next/reference/SpacePreferenceStore.kt \
                  android/app/src/main/java/de/sidebyside/next/reference/ReferenceViewModel.kt \
                  android/app/src/test/java/de/sidebyside/next/reference/SpacePreferenceDeletionTest.kt \
                  .github/workflows/tmp-682-account-space-retention.yml
          git commit -m "fix(android): forget Space preference after Account deletion"
          git push origin HEAD:fix/682-forget-space-preference-after-account-deletion
