name: Temporary ServerAdmin actor column for 335

on:
  push:
    branches:
      - feat/335-server-admin-controls

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/335-server-admin-controls
          fetch-depth: 0

      - name: Apply staged actor patch
        run: python3 tools/tmp_patch_335_actor.py

      - name: Verify Web actor audit rendering
        working-directory: web
        run: |
          npm ci
          npx biome format --write src/components/ServerAdminPage.tsx src/components/ServerAdminPage.css src/components/ServerAdminControls.test.tsx src/i18n/locales/serverAdmin.ts
          npm run typecheck
          npm run lint
          npm test -- src/components/ServerAdminControls.test.tsx

      - name: Commit verified actor audit column
        run: |
          rm .github/workflows/zz-temp-server-admin-actor-335.yml tools/tmp_patch_335_actor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "feat: identify actors in ServerAdmin audit (#335)"
          git push origin HEAD:feat/335-server-admin-controls
