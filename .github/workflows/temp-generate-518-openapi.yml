name: Temporary 518 OpenAPI Generation

on:
  push:
    branches:
      - feat/518-space-offboarding-core
    paths:
      - .github/workflows/temp-generate-518-openapi.yml

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Generate canonical contract
        run: |
          cd backend
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen
          uv run --frozen python scripts/openapi_contract.py write
      - name: Generate Web and Android clients
        run: tools/openapi/generate.sh
      - name: Verify generated output
        run: |
          git diff --check
          cd backend
          uv run --frozen python scripts/openapi_contract.py check
          cd ..
          tools/openapi/generate.sh --check
      - name: Commit generated contract and clients
        run: |
          git rm .github/workflows/temp-generate-518-openapi.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json web/src/api/generated android/api/generated
          git commit -m "chore(api): regenerate Space offboarding clients"
          git push origin HEAD:feat/518-space-offboarding-core
