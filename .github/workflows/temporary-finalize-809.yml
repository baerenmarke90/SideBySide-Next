name: Temporary finalize #809 v2

on:
  push:
    branches:
      - feat/809-shared-story-summary-v2

permissions:
  contents: write

concurrency:
  group: finalize-809-v2
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"
  SBS_ENVIRONMENT: test
  SBS_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test
  SBS_TEST_DATABASE_URL: postgresql+psycopg://sidebyside:sidebyside@localhost:5432/sidebyside_test

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidebyside
          POSTGRES_PASSWORD: sidebyside
          POSTGRES_DB: sidebyside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidebyside -d sidebyside_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/809-shared-story-summary-v2
          fetch-depth: 0

      - name: Apply full-suite alignment
        run: python3 tools/temporary/finalize_809_v2.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Upgrade test database
        working-directory: backend
        run: uv run --frozen alembic upgrade head

      - name: Validate affected backend suites
        working-directory: backend
        run: |
          uv run --frozen ruff format src tests scripts alembic
          uv run --frozen ruff check src tests scripts alembic
          uv run --frozen mypy
          uv run --frozen python scripts/openapi_contract.py check
          uv run --frozen pytest \
            tests/unit/test_dashboard_catalog_parity.py \
            tests/integration/test_dashboard.py \
            tests/integration/test_dashboard_preferences.py \
            tests/integration/test_dashboard_story_summary.py \
            -q

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate affected Web suites
        working-directory: web
        run: |
          npm run format
          npm run typecheck
          npm run lint
          npm test -- \
            SharedStorySummary.test.tsx \
            dashboardModules.test.ts \
            DashboardSettingsPanel.test.tsx \
            TodayPage.test.tsx \
            --reporter=default

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify pinned Gradle wrapper JAR
        working-directory: android
        run: |
          printf '%s  %s\n' \
            '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7' \
            'gradle/wrapper/gradle-wrapper.jar' \
            | sha256sum --check --strict -

      - name: Install Android SDK 37.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Validate Android contract compatibility
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace --dependency-verification strict
          :app:testDebugUnitTest
          --tests de.sidebyside.next.reference.DashboardViewWireCompatibilityTest
          --tests de.sidebyside.next.reference.SpaceContextTest
          --tests de.sidebyside.next.today.TodayScreenSemanticsTest
          --tests de.sidebyside.next.today.TodayTest
          --tests de.sidebyside.next.cache.ProductReadCacheViewModelTest

      - name: Verify generated clients are current
        run: tools/openapi/generate.sh --check

      - name: Remove one-shot finalization machinery
        run: |
          rm .github/workflows/temporary-finalize-809.yml
          rm tools/temporary/finalize_809_v2.py
          rmdir tools/temporary 2>/dev/null || true

      - name: Commit final alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "test: align #809 dashboard contracts"
          git push origin HEAD:feat/809-shared-story-summary-v2
