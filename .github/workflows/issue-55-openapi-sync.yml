name: Issue 55 OpenAPI Sync

on:
  push:
    branches:
      - fix/issue-55-oidc-onboarding
    paths:
      - .github/workflows/issue-55-openapi-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      SBS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/issue-55-oidc-onboarding
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.7
      - name: Install locked tooling
        run: python -m pip install "uv==0.12.5"
      - name: Generate OpenAPI contract
        working-directory: backend
        run: |
          uv sync --frozen
          uv run --frozen python scripts/openapi_contract.py write
      - name: Commit generated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update OpenAPI contract for OIDC onboarding"
          git push origin HEAD:fix/issue-55-oidc-onboarding
