name: M4 S1 Format

on:
  push:
    branches: [feat/285-m4c-reminders-final]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
      SBS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/285-m4c-reminders-final
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Format endpoint matrix
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen
          uv run --frozen ruff format tests/integration/test_endpoint_matrix.py
      - name: Commit formatter output
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- backend/tests/integration/test_endpoint_matrix.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/integration/test_endpoint_matrix.py
          git commit -m "style(api): format M4-C-S1 endpoint matrix"
          git push origin HEAD:feat/285-m4c-reminders-final
# Trigger after workflow registration.
