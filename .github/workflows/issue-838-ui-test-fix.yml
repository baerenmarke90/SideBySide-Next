name: Issue 838 UI Test Fix

on:
  push:
    branches:
      - feat/838-date-only-plans

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/838-date-only-plans
          fetch-depth: 0
      - name: Apply date-only UI test node patch
        run: python tools/issue_838_ui_test_node_patch.py
      - name: Commit test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/test/java/de/sidebyside/next/plan/PlanScreenTest.kt
          git commit -m "test(android): assert date-only timing on card and sheet"
          git push origin HEAD:feat/838-date-only-plans
