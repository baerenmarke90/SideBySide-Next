name: Temporary Android offboarding patch

on:
  push:
    branches:
      - feat/518-android-space-offboarding
    paths:
      - .github/workflows/temp-android-offboarding-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply exact Android offboarding patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/ReferenceContract.kt",
              "import sidebyside.api.models.SessionView\nimport sidebyside.api.models.SpaceView\n",
              "import sidebyside.api.models.SessionView\nimport sidebyside.api.models.SpaceMembershipExitView\nimport sidebyside.api.models.SpaceView\n",
          )
          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/ReferenceContract.kt",
              "    suspend fun listMemberships(accessToken: String): List<AccountMembershipView>\n\n    /** Deletes only the Account represented by [accessToken]. */\n",
              "    suspend fun listMemberships(accessToken: String): List<AccountMembershipView>\n\n    /** Ends only the current Account's Membership in [spaceId]. */\n    suspend fun leaveSpace(\n        spaceId: UUID,\n        accessToken: String,\n    ): SpaceMembershipExitView\n\n    /** Deletes only the Account represented by [accessToken]. */\n",
          )

          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/OkHttpReferenceApi.kt",
              "import sidebyside.api.models.SignInRequest\nimport sidebyside.api.models.SpaceView\n",
              "import sidebyside.api.models.SignInRequest\nimport sidebyside.api.models.SpaceMembershipExitView\nimport sidebyside.api.models.SpaceView\n",
          )
          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/OkHttpReferenceApi.kt",
              "    override suspend fun listMemberships(accessToken: String): List<AccountMembershipView> =\n        executeJson(\n            authenticatedRequest(\"$baseUrl/api/v1/auth/memberships\", accessToken)\n                .get()\n                .build(),\n            ListSerializer(AccountMembershipView.serializer()),\n        )\n\n    override suspend fun deleteOwnAccount(\n",
              "    override suspend fun listMemberships(accessToken: String): List<AccountMembershipView> =\n        executeJson(\n            authenticatedRequest(\"$baseUrl/api/v1/auth/memberships\", accessToken)\n                .get()\n                .build(),\n            ListSerializer(AccountMembershipView.serializer()),\n        )\n\n    override suspend fun leaveSpace(\n        spaceId: UUID,\n        accessToken: String,\n    ): SpaceMembershipExitView =\n        executeJson(\n            authenticatedRequest(\"$baseUrl/api/v1/spaces/$spaceId/membership/leave\", accessToken)\n                .post(EMPTY_JSON_BODY.toRequestBody(jsonMediaType))\n                .build(),\n            SpaceMembershipExitView.serializer(),\n        )\n\n    override suspend fun deleteOwnAccount(\n",
          )

          replace_once(
              "android/app/src/test/java/de/sidebyside/next/reference/FakeReferenceContract.kt",
              "import sidebyside.api.models.SessionView\nimport sidebyside.api.models.StoryPage\n",
              "import sidebyside.api.models.SessionView\nimport sidebyside.api.models.SpaceMembershipExitView\nimport sidebyside.api.models.StoryPage\n",
          )
          replace_once(
              "android/app/src/test/java/de/sidebyside/next/reference/FakeReferenceContract.kt",
              "    override suspend fun listMemberships(accessToken: String): List<AccountMembershipView> =\n        notExercised(\"listMemberships\")\n\n    override suspend fun deleteOwnAccount(\n",
              "    override suspend fun listMemberships(accessToken: String): List<AccountMembershipView> =\n        notExercised(\"listMemberships\")\n\n    override suspend fun leaveSpace(\n        spaceId: UUID,\n        accessToken: String,\n    ): SpaceMembershipExitView = notExercised(\"leaveSpace\")\n\n    override suspend fun deleteOwnAccount(\n",
          )

          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/ReferenceViewModel.kt",
              "    val profile: ProfileUiState = ProfileUiState(),\n    val accountDeletionBusy: Boolean = false,\n    val accountDeletionProblem: UiProblem? = null,\n    val busy: Boolean = false,\n",
              "    val profile: ProfileUiState = ProfileUiState(),\n    val spaceOffboardingBusy: Boolean = false,\n    val spaceOffboardingProblem: UiProblem? = null,\n    val accountDeletionBusy: Boolean = false,\n    val accountDeletionProblem: UiProblem? = null,\n    val busy: Boolean = false,\n",
          )
          leave_method = dedent(
              """\
                  /**
                   * Ends the current Account's Membership in the active Space.
                   *
                   * The token and destructive authority stay inside this session owner. Once
                   * the server accepts exit, the old Space becomes unusable locally before a
                   * membership refresh is attempted: [clearSpaceBoundState] advances the
                   * session epoch and removes drafts/read caches/protected local state. A
                   * refresh may then move to another active Space or keep the authenticated
                   * Account in the existing awaiting-Space state. A refresh failure never
                   * restores the former Space.
                   */
                  fun leaveActiveSpace() {
                      if (_uiState.value.demoMode) return
                      val api = contract ?: return configurationError()
                      val currentSession = session ?: return
                      val spaceId = activeSpaceId ?: return
                      val operationEpoch = sessionEpoch

                      mutate { it.copy(spaceOffboardingBusy = true, spaceOffboardingProblem = null) }
                      viewModelScope.launch {
                          if (!isCurrentSession(operationEpoch, currentSession)) return@launch
                          runCatching { api.leaveSpace(spaceId, currentSession.tokens.accessToken) }
                              .onSuccess {
                                  if (!isCurrentSession(operationEpoch, currentSession)) return@onSuccess

                                  clearSpaceBoundState()
                                  activeSpaceId = null
                                  imageDrafts = emptyList()
                                  mutate {
                                      it.copy(
                                          loggedIn = false,
                                          awaitingSpace = true,
                                          activeSpaceId = null,
                                          availableSpaces = emptyList(),
                                          spacePartnerNames = emptyMap(),
                                          profile = ProfileUiState(),
                                          spaceOffboardingBusy = false,
                                          spaceOffboardingProblem = null,
                                          busy = false,
                                          error = null,
                                          draftImages = emptyList(),
                                      )
                                  }

                                  val postExitEpoch = sessionEpoch
                                  val memberships = runCatching {
                                      api.listMemberships(currentSession.tokens.accessToken)
                                  }.getOrNull() ?: return@onSuccess
                                  if (!isCurrentSession(postExitEpoch, currentSession)) return@onSuccess

                                  val active = activeMemberships(memberships)
                                  val nextSpace = activeSpaceOf(memberships, _uiState.value.accountId)
                                  if (nextSpace == null) {
                                      mutate { it.copy(availableSpaces = active) }
                                      return@onSuccess
                                  }

                                  activeSpaceId = nextSpace
                                  mutate {
                                      it.copy(
                                          loggedIn = true,
                                          awaitingSpace = false,
                                          activeSpaceId = nextSpace,
                                          availableSpaces = active,
                                          spacePartnerNames = emptyMap(),
                                          profile = ProfileUiState(),
                                          spaceOffboardingBusy = false,
                                          spaceOffboardingProblem = null,
                                      )
                                  }
                                  refreshStory()
                              }
                              .onFailure { throwable ->
                                  if (isCurrentSession(operationEpoch, currentSession)) {
                                      mutate {
                                          it.copy(
                                              spaceOffboardingBusy = false,
                                              spaceOffboardingProblem = problemFor(throwable),
                                          )
                                      }
                                  }
                              }
                      }
                  }

              """
          )
          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/ReferenceViewModel.kt",
              "    /**\n     * Switches to another authorized Space.\n",
              leave_method + "    /**\n     * Switches to another authorized Space.\n",
          )

          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/MainActivity.kt",
              "import de.sidebyside.next.profile.ProfileSettingsContent\nimport de.sidebyside.next.shell.AppDestination\n",
              "import de.sidebyside.next.profile.ProfileSettingsContent\nimport de.sidebyside.next.relationship.SpaceOffboardingContent\nimport de.sidebyside.next.shell.AppDestination\n",
          )
          replace_once(
              "android/app/src/main/java/de/sidebyside/next/reference/MainActivity.kt",
              "                            AccountSettingsContent(\n                                demoMode = state.demoMode,\n",
              "                            if (state.activeSpaceId != null) {\n                                SpaceOffboardingContent(\n                                    demoMode = state.demoMode,\n                                    busy = state.spaceOffboardingBusy,\n                                    problem = state.spaceOffboardingProblem,\n                                    onOpenDataExport = { navController.navigate(DATA_EXPORT_ROUTE) },\n                                    onLeaveSpace = viewModel::leaveActiveSpace,\n                                )\n                            }\n                            AccountSettingsContent(\n                                demoMode = state.demoMode,\n",
          )
          PY

      - name: Commit exact patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-android-offboarding-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(android): wire Space self-offboarding lifecycle"
          git push origin HEAD:${GITHUB_REF_NAME}
