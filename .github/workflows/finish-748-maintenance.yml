name: Finish 748 maintenance

on:
  push:
    branches:
      - work/748-finish

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SBS_ENVIRONMENT: test
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/748-finish
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend toolchain
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen

      - name: Register recent-auth endpoints in the completeness matrix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/integration/test_endpoint_matrix.py")
          text = path.read_text(encoding="utf-8")
          anchor = '    ("POST", "/api/v1/account/deletion"),\n'
          entries = (
              '    ("GET", "/api/v1/auth/recent-authentication/account-deletion"),\n'
              '    ("POST", "/api/v1/auth/recent-authentication/account-deletion/password"),\n'
              '    ("POST", "/api/v1/auth/recent-authentication/account-deletion/passkeys/start"),\n'
              '    ("POST", "/api/v1/auth/recent-authentication/account-deletion/passkeys/finish"),\n'
              '    ("POST", "/api/v1/auth/recent-authentication/account-deletion/oidc/{connectionId}/start"),\n'
              '    ("POST", "/api/v1/auth/recent-authentication/account-deletion/oidc/{connectionId}/callback"),\n'
          )
          block = "".join(entries)
          if entries[0] not in text:
              if anchor not in text:
                  raise SystemExit("Authenticated endpoint-matrix anchor not found")
              text = text.replace(anchor, anchor + block, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Format backend with the pinned repository formatter
        working-directory: backend
        run: uv run --frozen ruff format src tests scripts alembic

      - name: Refresh OpenAPI contract
        working-directory: backend
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Regenerate Web and Android API clients
        run: tools/openapi/generate.sh

      - name: Remove one-time maintenance workflow
        run: rm .github/workflows/finish-748-maintenance.yml

      - name: Commit deterministic maintenance output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(auth): refresh recent-auth contracts and formatting"
          git push origin HEAD:work/748-finish
