name: Android Verification Metadata Refresh

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-verification-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh verification metadata
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify pinned wrapper JAR before execution
        working-directory: android
        shell: bash
        run: |
          printf '%s  %s\n' \
            '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7' \
            'gradle/wrapper/gradle-wrapper.jar' \
            | sha256sum --check --strict -

      - name: Install Android SDK 37.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Refresh metadata from a cold dependency resolution
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace --refresh-dependencies
          --write-verification-metadata sha256
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Commit only verification metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradle/verification-metadata.xml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Verification metadata is already complete."
            exit 0
          fi
          git commit -m "build(android): complete verification metadata"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
