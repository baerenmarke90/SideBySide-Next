name: Temporary M3-S5 Status Update

on:
  push:
    branches:
      - feat/250-m3-s5-chapter-api

permissions:
  contents: write

jobs:
  update-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/250-m3-s5-chapter-api

      - name: Update M3-S5 living status sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "docs/IMPLEMENTATION-STATUS.md",
              "- [ ] **M3-S5 — Chapter:** next runtime slice. Adds `Chapter.placeId` and the three `chapter_*` relations.\n- [ ] M3-S6+ — Collections and Private Area according to the Delivery Plan.",
              "- [x] **M3-S5 — Chapter:** Chapter Domain with optional `startOn`/`endOn`, canonical nullable `placeId`, collaborative CRUD/List with `If-Match`/409, typed `chapter_memories`/`chapter_heart_moments`/`chapter_milestones`, deterministic derived cross-type content ordering, privacy-safe target handling, and delete semantics that remove only the Chapter and its relations while preserving all originals.\n- [ ] **M3-S6 — Shared Collections:** next runtime slice according to the Delivery Plan. S7+ continues with PrivateNote, GiftIdea, and PrivateCollection.",
          )
          replace(
              "docs/IMPLEMENTATION-STATUS.md",
              "M3-S5 **Chapter** according to the [M3 Delivery Plan](m3/DELIVERY-PLAN.md). The slice adds the Chapter model with `startOn`/`endOn` per M3-D11, derived chronological presentation per M3-D10, plus `Chapter.placeId` and the three `chapter_*` relations — the latter using the same join shape that S4 delivered for Places.\n\nPer M3-D12, Chapter deletion removes only the Chapter and its relations; no Memory, HeartMoment, or Milestone may disappear with it.",
              "M3-S6 **Shared Collections** according to the [M3 Delivery Plan](m3/DELIVERY-PLAN.md): Collection + CollectionItem, collaborative writes, separate root/item versioning, contiguous positions, atomic full-list reorder, delete compaction, and Cross-Tenant/Concurrency coverage. ShoppingList and persisted multi-select state remain outside S6.",
          )

          replace(
              "docs/ROADMAP.md",
              "**Version:** 1.8  \n**As of:** August 27, 2026",
              "**Version:** 1.9  \n**As of:** August 30, 2026",
          )
          replace(
              "docs/ROADMAP.md",
              "**G1 and G2 have passed. M3 is released for implementation; S1 through S4 are delivered. The next runtime slice is M3-S5 — Chapter.**",
              "**G1 and G2 have passed. M3 is released for implementation; S1 through S5 are delivered. The next runtime slice is M3-S6 — Shared Collections.**",
          )
          replace(
              "docs/ROADMAP.md",
              "### M3 — Planning & Private Area: released, S1 through S4 delivered",
              "### M3 — Planning & Private Area: released, S1 through S5 delivered",
          )
          replace(
              "docs/ROADMAP.md",
              "Delivered are **M3-S1 Wish Foundation**, **M3-S2 Plan + Wish->Plan**, **M3-S3 Place Foundation**, and **M3-S4 typed Content Relations**. The next runtime slice is **M3-S5 — Chapter**.",
              "Delivered are **M3-S1 Wish Foundation**, **M3-S2 Plan + Wish->Plan**, **M3-S3 Place Foundation**, **M3-S4 typed Content Relations**, and **M3-S5 Chapter**. The next runtime slice is **M3-S6 — Shared Collections**.",
          )

          replace(
              "docs/m3/DELIVERY-PLAN.md",
              "**Status:** S0 complete; runtime released; S1 through S4 delivered  \n**As of:** August 26, 2026",
              "**Status:** S0 complete; runtime released; S1 through S5 delivered  \n**As of:** August 30, 2026",
          )
          replace(
              "docs/m3/DELIVERY-PLAN.md",
              "## 8. S5 – Chapter",
              "## 8. S5 – Chapter – delivered",
          )
          marker = "-> all originals remain readable unchanged\n```\n\n## 9. S6 – Shared Collections"
          replacement = "-> all originals remain readable unchanged\n```\n\nImplemented. Chapter CRUD/List is exposed through the versioned REST/OpenAPI contract with `If-Match`/409 semantics; all four decided date shapes and the invalid-range error are covered. `Chapter.placeId` is canonical and Same-Space, Place deletion detaches it versionedly, and the three typed relation families reuse the S4 integrity/privacy/locking model. Derived content ordering is computed from original resources without a persisted position. Chapter deletion removes relation rows only and preserves Memory, SHARED HeartMoment, Milestone, and Place originals.\n\n## 9. S6 – Shared Collections"
          replace("docs/m3/DELIVERY-PLAN.md", marker, replacement)
          PY

      - name: Commit status updates and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-m3-s5-status.yml
          git add docs/IMPLEMENTATION-STATUS.md docs/ROADMAP.md docs/m3/DELIVERY-PLAN.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(m3): mark S5 Chapter delivered (#250)"
          git push origin HEAD:feat/250-m3-s5-chapter-api
