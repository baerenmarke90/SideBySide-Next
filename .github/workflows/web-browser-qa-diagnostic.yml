name: Web Browser QA Diagnostic

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-browser-qa-diagnostic.yml"

permissions:
  contents: read

jobs:
  browser-diagnostic:
    name: Split Playwright scenarios
    runs-on: ubuntu-24.04
    container:
      image: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked browser QA dependencies
        working-directory: web/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Install pinned Chromium runtime
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Compact sign-in accessibility
        working-directory: web/e2e
        run: npm test -- --grep "compact sign-in"

      - name: Authenticated shell accessibility
        if: ${{ always() }}
        working-directory: web/e2e
        run: npm test -- --grep "expanded authenticated shell"
