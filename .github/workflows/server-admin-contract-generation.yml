name: Temporary ServerAdmin Contract Generation

on:
  push:
    branches:
      - feat/335-server-admin-foundation

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.13.7'
      UV_VERSION: '0.12.5'
      SBS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked backend environment
        run: |
          python -m pip install "uv==$UV_VERSION"
          cd backend
          uv sync --frozen

      - name: Write OpenAPI contract
        run: |
          cd backend
          uv run --frozen python scripts/openapi_contract.py write

      - name: Regenerate official clients
        run: tools/openapi/generate.sh

      - name: Commit generated contract and clients
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json web/src/api/generated android/api/generated
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: regenerate ServerAdmin API clients"
          git push origin HEAD:feat/335-server-admin-foundation
