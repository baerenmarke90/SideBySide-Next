name: Issue 809 final format fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/809-shared-story-summary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact Biome formatting output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/e2e/tests/product-reflow.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = """            path: testInfo.outputPath(\n              `shell-today-story-summary-${width}.png`,\n            ),\n"""
          new = """            path: testInfo.outputPath(`shell-today-story-summary-${width}.png`),\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one format target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit focused format fix and remove workflow
        run: |
          rm .github/workflows/issue809-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(web): satisfy Biome for #809 browser evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
