name: Android Gradle Bootstrap

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-gradle-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: android-gradle-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate trusted Gradle files
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Stop when generated files already exist
        id: state
        shell: bash
        run: |
          if [[ -f android/gradle/wrapper/gradle-wrapper.jar && -f android/gradle/verification-metadata.xml ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.state.outputs.ready != 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up trusted Gradle 9.5.0 for one-time generation
        if: steps.state.outputs.ready != 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Install Android SDK 37.1
        if: steps.state.outputs.ready != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Generate wrapper and verification metadata
        if: steps.state.outputs.ready != 'true'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper \
            --gradle-version 9.5.0 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum 553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
          actual_wrapper_sha=$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')
          test "$actual_wrapper_sha" = "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7"
          ./gradlew --no-daemon --stacktrace \
            --write-verification-metadata sha256 \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Commit generated files to the PR branch
        if: steps.state.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android/gradlew \
            android/gradlew.bat \
            android/gradle/wrapper/gradle-wrapper.jar \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/gradle/verification-metadata.xml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build(android): add trusted Gradle wrapper metadata"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
