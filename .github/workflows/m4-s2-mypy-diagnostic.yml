name: M4 S2 Mypy Diagnostic

on:
  push:
    branches: [feat/292-m4c-rules-occurrences-final]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
      SBS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/292-m4c-rules-occurrences-final
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Capture strict mypy diagnostics
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen
          set +e
          uv run --frozen mypy > ../.github/m4-s2-mypy.txt 2>&1
          status=$?
          set -e
          printf '\nexit=%s\n' "$status" >> ../.github/m4-s2-mypy.txt
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/m4-s2-mypy.txt
          git commit -m "ci: capture M4-C-S2 mypy diagnostic"
          git push origin HEAD:feat/292-m4c-rules-occurrences-final
