name: Temporary Android Account Patch V2

on:
  push:
    branches:
      - feat/644-android-account-deletion
    paths:
      - .github/workflows/temp-patch-644-android-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python tools/temp_patch_644_android.py
      - name: Verify patch
        run: git diff --check
      - name: Commit source wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java android/app/src/test/java
          git commit -m "feat(android): wire self-service Account deletion"
          git push origin HEAD:feat/644-android-account-deletion
