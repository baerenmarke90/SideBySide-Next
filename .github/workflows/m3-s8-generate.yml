name: M3 S8 Contract Generation

on:
  push:
    branches: [feat/259-m3-s8-private-collections]
    paths:
      - .github/workflows/m3-s8-generate.yml

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.7"
  UV_VERSION: "0.12.5"
  SBS_ENVIRONMENT: test

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/259-m3-s8-private-collections

      - name: Extend endpoint isolation matrix for private collection fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/integration/test_endpoint_matrix.py")
          text = path.read_text(encoding="utf-8")

          if "fixture_aliases: dict[str, str]" not in text:
              text = text.replace(
                  "    placeholders: tuple[str, ...] = field(default=())\n"
                  "    query: dict[str, str] = field(default_factory=dict)\n",
                  "    placeholders: tuple[str, ...] = field(default=())\n"
                  "    fixture_aliases: dict[str, str] = field(default_factory=dict)\n"
                  "    query: dict[str, str] = field(default_factory=dict)\n",
              )

          if "PRIVATE_COLLECTION =" not in text:
              text = text.replace(
                  'GIFT_IDEA = {"title": "Matrix Gift Idea"}\n',
                  'GIFT_IDEA = {"title": "Matrix Gift Idea"}\n'
                  'PRIVATE_COLLECTION = {"title": "Matrix Private Collection", "icon": "lock"}\n'
                  'PRIVATE_COLLECTION_ITEM = {"title": "Matrix Private Collection Item"}\n'
                  'PRIVATE_COLLECTION_FIXTURES = {\n'
                  '    "collectionId": "privateCollectionId",\n'
                  '    "itemId": "privateCollectionItemId",\n'
                  '}\n',
              )

          if 'Endpoint("GET", "/api/v1/spaces/{spaceId}/private/collections")' not in text:
              marker = '    Endpoint("GET", "/api/v1/spaces/{spaceId}/private/notes"),\n'
              block = '''    Endpoint("GET", "/api/v1/spaces/{spaceId}/private/collections"),
              Endpoint(
                  "POST",
                  "/api/v1/spaces/{spaceId}/private/collections",
                  body=PRIVATE_COLLECTION,
              ),
              Endpoint(
                  "GET",
                  "/api/v1/spaces/{spaceId}/private/collections/{collectionId}",
                  resource_absence="PRIVATE_COLLECTION_NOT_FOUND",
                  fixture_aliases=PRIVATE_COLLECTION_FIXTURES,
              ),
              Endpoint(
                  "PATCH",
                  "/api/v1/spaces/{spaceId}/private/collections/{collectionId}",
                  body={"title": "Matrix Private Collection updated"},
                  if_match=True,
                  resource_absence="PRIVATE_COLLECTION_NOT_FOUND",
                  fixture_aliases=PRIVATE_COLLECTION_FIXTURES,
              ),
              Endpoint(
                  "DELETE",
                  "/api/v1/spaces/{spaceId}/private/collections/{collectionId}",
                  if_match=True,
                  resource_absence="PRIVATE_COLLECTION_NOT_FOUND",
                  fixture_aliases=PRIVATE_COLLECTION_FIXTURES,
              ),
              Endpoint(
                  "POST",
                  "/api/v1/spaces/{spaceId}/private/collections/{collectionId}/items",
                  body=PRIVATE_COLLECTION_ITEM,
                  resource_absence="PRIVATE_COLLECTION_NOT_FOUND",
                  placeholders=("collectionId",),
                  fixture_aliases=PRIVATE_COLLECTION_FIXTURES,
              ),
              Endpoint(
                  "GET",
                  "/api/v1/spaces/{spaceId}/private/collections/{collectionId}/items/{itemId}",
                  resource_absence="PRIVATE_COLLECTION_ITEM_NOT_FOUND",
                  placeholders=("itemId",),
                  fixture_aliases=PRIVATE_COLLECTION_FIXTURES,
              ),
              Endpoint(
                  "PATCH",
                  "/api/v1/spaces/{spaceId}/private/collections/{collectionId}/items/{itemId}",
                  body={"completed": True},
                  if_match=True,
                  resource_absence="PRIVATE_COLLECTION_ITEM_NOT_FOUND",
                  placeholders=("itemId",),
                  fixture_aliases=PRIVATE_COLLECTION_FIXTURES,
              ),
              Endpoint(
                  "DELETE",
                  "/api/v1/spaces/{spaceId}/private/collections/{collectionId}/items/{itemId}",
                  if_match=True,
                  resource_absence="PRIVATE_COLLECTION_ITEM_NOT_FOUND",
                  placeholders=("itemId",),
                  fixture_aliases=PRIVATE_COLLECTION_FIXTURES,
              ),
              Endpoint(
                  "PUT",
                  "/api/v1/spaces/{spaceId}/private/collections/{collectionId}/order",
                  body={"itemIds": []},
                  if_match=True,
                  resource_absence="PRIVATE_COLLECTION_NOT_FOUND",
                  placeholders=("collectionId",),
                  fixture_aliases=PRIVATE_COLLECTION_FIXTURES,
              ),
          '''
              text = text.replace(marker, block + marker)

          if "private_collection = client.post(" not in text:
              marker = '''    private_note = client.post(
                  f"{base_path}/private/notes", json=PRIVATE_NOTE, headers=headers
              ).json()
          '''
              block = '''    private_collection = client.post(
                  f"{base_path}/private/collections",
                  json=PRIVATE_COLLECTION,
                  headers=headers,
              ).json()
              private_collection_item = client.post(
                  f"{base_path}/private/collections/{private_collection['id']}/items",
                  json=PRIVATE_COLLECTION_ITEM,
                  headers=headers,
              ).json()
          '''
              text = text.replace(marker, block + marker)
              text = text.replace(
                  '            "itemId": collection_item["id"],\n',
                  '            "itemId": collection_item["id"],\n'
                  '            "privateCollectionId": private_collection["id"],\n'
                  '            "privateCollectionItemId": private_collection_item["id"],\n',
              )

          old_path = '''def _path(endpoint: Endpoint, ids: dict[str, str], **replacements: str) -> str:
              values = {**ids, **replacements}
              return endpoint.template.format(**values)
          '''
          new_path = '''def _path(endpoint: Endpoint, ids: dict[str, str], **replacements: str) -> str:
              values = dict(ids)
              for placeholder, fixture_id in endpoint.fixture_aliases.items():
                  values[placeholder] = ids[fixture_id]
              values.update(replacements)
              return endpoint.template.format(**values)
          '''
          if old_path in text:
              text = text.replace(old_path, new_path)

          old_unknown = '''        path = endpoint.template.format(
                      **{**scenario["ids"], **dict.fromkeys(_resource_placeholders(endpoint), str(uuid4()))}
                  )
          '''
          new_unknown = '''        path = _path(
                      endpoint,
                      scenario["ids"],
                      **dict.fromkeys(_resource_placeholders(endpoint), str(uuid4())),
                  )
          '''
          if old_unknown in text:
              text = text.replace(old_unknown, new_unknown)

          old_malformed = '''        unknown = endpoint.template.format(
                      **{**scenario["ids"], **dict.fromkeys(_resource_placeholders(endpoint), str(uuid4()))}
                  )
                  malformed = endpoint.template.format(
                      **{**scenario["ids"], **dict.fromkeys(_resource_placeholders(endpoint), "nicht-echt")}
                  )
          '''
          new_malformed = '''        unknown = _path(
                      endpoint,
                      scenario["ids"],
                      **dict.fromkeys(_resource_placeholders(endpoint), str(uuid4())),
                  )
                  malformed = _path(
                      endpoint,
                      scenario["ids"],
                      **dict.fromkeys(_resource_placeholders(endpoint), "nicht-echt"),
                  )
          '''
          if old_malformed in text:
              text = text.replace(old_malformed, new_malformed)

          path.write_text(text, encoding="utf-8")
          PY

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen

      - name: Format and lint the S8 backend changes
        working-directory: backend
        run: |
          uv run --frozen ruff format \
            src/sidebyside/private_collections \
            src/sidebyside/api/v1/private_collections.py \
            src/sidebyside/api/v1/__init__.py \
            src/sidebyside/domain/events.py \
            tests/integration/test_private_collections_api.py \
            tests/integration/test_private_collection_races.py \
            tests/integration/test_endpoint_matrix.py \
            alembic/env.py \
            alembic/versions/0027_m3_private_collections.py
          uv run --frozen ruff check --fix \
            src/sidebyside/private_collections \
            src/sidebyside/api/v1/private_collections.py \
            src/sidebyside/api/v1/__init__.py \
            src/sidebyside/domain/events.py \
            tests/integration/test_private_collections_api.py \
            tests/integration/test_private_collection_races.py \
            tests/integration/test_endpoint_matrix.py \
            alembic/env.py \
            alembic/versions/0027_m3_private_collections.py
          uv run --frozen ruff format \
            src/sidebyside/private_collections \
            src/sidebyside/api/v1/private_collections.py \
            tests/integration/test_private_collections_api.py \
            tests/integration/test_private_collection_races.py \
            tests/integration/test_endpoint_matrix.py \
            alembic/versions/0027_m3_private_collections.py

      - name: Write canonical OpenAPI contract
        working-directory: backend
        run: uv run --frozen python scripts/openapi_contract.py write

      - name: Generate API clients
        run: tools/openapi/generate.sh

      - name: Commit generated contract and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/openapi.json \
            backend/src/sidebyside/private_collections \
            backend/src/sidebyside/api/v1/private_collections.py \
            backend/src/sidebyside/api/v1/__init__.py \
            backend/src/sidebyside/domain/events.py \
            backend/tests/integration/test_private_collections_api.py \
            backend/tests/integration/test_private_collection_races.py \
            backend/tests/integration/test_endpoint_matrix.py \
            backend/alembic/env.py \
            backend/alembic/versions/0027_m3_private_collections.py \
            web/src/api/generated \
            android/api/generated
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore(api): generate PrivateCollection contract (#259)"
          git push origin HEAD:feat/259-m3-s8-private-collections
