name: Temporary client completion for 334

on:
  push:
    branches:
      - feat/334-registration-maintenance

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/334-registration-maintenance
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 tools/tmp_patch_334.py

      - name: Verify Web client changes
        working-directory: web
        run: |
          npm ci
          npx biome format --write src/components/IdentityEntry.tsx src/client/instanceStatus.ts src/client/instanceStatus.test.ts src/i18n/locales/de.ts
          npm run typecheck
          npm test -- src/client/instanceStatus.test.ts

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android status tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:testDebugUnitTest --tests de.sidebyside.next.reference.ReferenceViewModelTest

      - name: Commit verified client completion
        run: |
          rm .github/workflows/zz-temp-client-completion-334.yml tools/tmp_patch_334.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "feat: surface registration availability in clients (#334)"
          git push origin HEAD:feat/334-registration-maintenance
