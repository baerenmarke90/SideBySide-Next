name: M4 Search Ready Merge

on:
  push:
    branches:
      - ops/m4-search-ready-merge

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ready branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/274-m4a-search-ready
          fetch-depth: 0

      - name: Merge validated Search branch
        run: |
          git fetch origin feat/274-m4a-search-foundation
          git config user.name "baerenmarke90"
          git config user.email "49028921+baerenmarke90@users.noreply.github.com"
          git merge --no-ff origin/feat/274-m4a-search-foundation \
            -m "Merge M4-A Search foundation into ready branch"
          git push origin HEAD:feat/274-m4a-search-ready
