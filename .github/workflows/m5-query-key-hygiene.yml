name: M5 Query Key Hygiene

on:
  push:
    branches:
      - feat/298-m5-web-space-context

permissions:
  contents: write

jobs:
  patch:
    name: Remove bearer token from query key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/298-m5-web-space-context
          fetch-depth: 0

      - name: Patch query key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("web/src/App.tsx")
          text = path.read_text(encoding="utf-8")
          old = "queryKey: ['account-memberships', tokens?.accessToken ?? 'signed-out'],"
          new = "queryKey: ['account-memberships'],"
          if old not in text:
              raise SystemExit("Membership query key anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit patch and remove this one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m5-query-key-hygiene.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx
          git commit -m "fix(web): keep bearer token out of query keys"
          git push origin HEAD:feat/298-m5-web-space-context
