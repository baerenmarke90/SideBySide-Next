name: Temporary #549 generation

on:
  push:
    branches:
      - feat/549-server-admin-spaces

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13.7"
      UV_VERSION: "0.12.5"
      SBS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python3 tools/tmp_549_runner.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen

      - name: Format and validate backend source
        working-directory: backend
        run: |
          uv run --frozen ruff format src tests
          uv run --frozen ruff check src tests
          uv run --frozen mypy
          uv run --frozen python scripts/openapi_contract.py write

      - name: Generate checked-in API clients
        run: tools/openapi/generate.sh

      - name: Format and validate Web source
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run format
          npm run typecheck
          npm run lint
          npm test -- ServerAdminNavigation.test.tsx

      - name: Verify generated clients and diff
        run: |
          tools/openapi/generate.sh --check
          git diff --check

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json backend/src/sidebyside/api/v1/server_admin.py \
            backend/tests/integration/test_server_admin.py \
            backend/tests/integration/test_endpoint_matrix.py \
            web/src/api/generated android/api/generated \
            web/src/components/ServerAdminPage.tsx \
            web/src/components/ServerAdminNavigation.test.tsx \
            web/src/components/ServerAdminSpacesPanel.tsx \
            web/src/i18n/locales/serverAdmin.ts docs/SERVER-ADMIN.md
          git commit -m "feat(server-admin): add privacy-safe Space lifecycle insights (#549)"
          git push origin HEAD:feat/549-server-admin-spaces
