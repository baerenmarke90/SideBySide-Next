# Self-Hosted.
#
#   cp .env.example .env    # und ausfuellen
#   docker compose up -d
#
# Vier Bausteine: API, Web, Worker, PostgreSQL. Medien liegen im Volume
# oder, wenn konfiguriert, in einem S3-kompatiblen Speicher.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-sidebyside}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      SBS_ENVIRONMENT: production
      SBS_DEPLOYMENT: self_hosted
      SBS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidebyside}
      SBS_MEDIA_ROOT: /var/lib/sidebyside/media
    volumes:
      - media_data:/var/lib/sidebyside/media
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["python", "-m", "sidebyside.jobs.runner"]
    environment:
      SBS_ENVIRONMENT: production
      SBS_DEPLOYMENT: self_hosted
      SBS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidebyside}
      SBS_MEDIA_ROOT: /var/lib/sidebyside/media
    volumes:
      - media_data:/var/lib/sidebyside/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
