# Cloud/Managed v1 deployment representation for SideBySide.
#
# Contract: docs/m6/CLOUD-MANAGED-TOPOLOGY.md
# Template: deploy/cloud-managed.env.example
#
# This is the reviewable process/environment/health/volume contract for the
# supported Cloud/Managed launch topology. It intentionally differs from the
# Self-Hosted `compose.yaml` only where docs/m6/CLOUD-MANAGED-TOPOLOGY.md
# requires it:
#
#   - no bundled `postgres` service: SBS_DATABASE_URL must point at a managed
#     PostgreSQL instance;
#   - no `local` MediaStore volume: SBS_MEDIA_STORE=s3 is required;
#   - no `demo-init`: the canonical public Demo (#304) is a separate deployment;
#   - api/worker/web/migrate use `image:` references to exact #519 released
#     image archives (see docs/m6/CLOUD-MANAGED-TOPOLOGY.md §4.1) instead of
#     `build:` — Cloud/Managed never builds from source at deploy time;
#   - the deletion-journal path is an explicit named volume, documented as
#     requiring a shared/ReadWriteMany-equivalent implementation across every
#     `api` (and, if applicable, `worker`) replica — see §3.5 of the topology
#     contract. Plain Compose expresses this as a single named volume because
#     Compose itself is a single-host runtime; translating this file to the
#     selected managed platform's actual multi-replica descriptor must bind
#     that mount to the platform's shared/network volume type, not a
#     per-replica local disk.
#
# The operator's actual managed-platform deployment descriptor is generated
# from this file; it is not hand-maintained as a second, divergent recipe.

x-runtime-environment: &runtime-environment
  SBS_DATABASE_URL: "${SBS_DATABASE_URL:?SBS_DATABASE_URL fehlt}"
  SBS_ENVIRONMENT: "${SBS_ENVIRONMENT:-production}"
  SBS_DEPLOYMENT: cloud
  SBS_DEMO_MODE: "false"
  SBS_CURSOR_SIGNING_KEY: "${SBS_CURSOR_SIGNING_KEY:?SBS_CURSOR_SIGNING_KEY fehlt}"
  SBS_SERVER_ADMIN_EMAILS: '${SBS_SERVER_ADMIN_EMAILS:-[]}'
  SBS_MEDIA_STORE: s3
  SBS_S3_ENDPOINT: "${SBS_S3_ENDPOINT:?SBS_S3_ENDPOINT fehlt}"
  SBS_S3_REGION: "${SBS_S3_REGION:?SBS_S3_REGION fehlt}"
  SBS_S3_BUCKET: "${SBS_S3_BUCKET:?SBS_S3_BUCKET fehlt}"
  SBS_S3_ACCESS_KEY_ID: "${SBS_S3_ACCESS_KEY_ID:?SBS_S3_ACCESS_KEY_ID fehlt}"
  SBS_S3_SECRET_ACCESS_KEY: "${SBS_S3_SECRET_ACCESS_KEY:?SBS_S3_SECRET_ACCESS_KEY fehlt}"
  SBS_S3_SESSION_TOKEN: "${SBS_S3_SESSION_TOKEN:-}"
  # Shared durable path: see docs/m6/CLOUD-MANAGED-TOPOLOGY.md §3.5. The named
  # volume below must resolve to the same physical shared/network volume for
  # every api replica (and worker, if it ever reconciles the journal).
  SBS_ACCOUNT_DELETION_JOURNAL_PATH: /var/lib/sidebyside/deletion-journal/account-deletions.journal
  SBS_ACCOUNT_DELETION_INSTANCE_ID: "${SBS_ACCOUNT_DELETION_INSTANCE_ID:?SBS_ACCOUNT_DELETION_INSTANCE_ID fehlt}"
  SBS_ALLOWED_HOSTS: '${SBS_ALLOWED_HOSTS:?SBS_ALLOWED_HOSTS fehlt}'
  SBS_PUBLIC_BASE_URL: "${SBS_PUBLIC_BASE_URL:?SBS_PUBLIC_BASE_URL fehlt}"
  SBS_OIDC_CONNECTIONS: '${SBS_OIDC_CONNECTIONS:-[]}'
  SBS_WEBAUTHN_RP_ID: "${SBS_WEBAUTHN_RP_ID:-}"
  SBS_WEBAUTHN_RP_NAME: "${SBS_WEBAUTHN_RP_NAME:-SideBySide}"
  SBS_WEBAUTHN_ORIGINS: '${SBS_WEBAUTHN_ORIGINS:-[]}'
  SBS_MAIL_TRANSPORT: "${SBS_MAIL_TRANSPORT:-none}"
  SBS_MAIL_FROM: "${SBS_MAIL_FROM:-no-reply@localhost}"
  SBS_SMTP_HOST: "${SBS_SMTP_HOST:-localhost}"
  SBS_SMTP_PORT: "${SBS_SMTP_PORT:-587}"
  SBS_SMTP_USERNAME: "${SBS_SMTP_USERNAME:-}"
  SBS_SMTP_PASSWORD: "${SBS_SMTP_PASSWORD:-}"
  SBS_SMTP_STARTTLS: "${SBS_SMTP_STARTTLS:-true}"

# Immutable #519 release image references. Never `latest`/`main`/a branch name:
# see docs/m6/CLOUD-MANAGED-TOPOLOGY.md §4.1 and §7.
x-backend-image: &backend-image
  image: "${SBS_BACKEND_IMAGE:?SBS_BACKEND_IMAGE fehlt (immutable v<version> tag, never latest/main)}"

x-web-image: &web-image
  image: "${SBS_WEB_IMAGE:?SBS_WEB_IMAGE fehlt (immutable v<version> tag, never latest/main)}"

services:
  migrate:
    <<: *backend-image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      SBS_DATABASE_URL: "${SBS_DATABASE_URL:?SBS_DATABASE_URL fehlt}"
    networks:
      - app

  api:
    <<: *backend-image
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      FORWARDED_ALLOW_IPS: "${TRUSTED_PROXY_IPS:?TRUSTED_PROXY_IPS fehlt}"
    volumes:
      - deletion_journal_data:/var/lib/sidebyside/deletion-journal
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/ready")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend-image
    restart: unless-stopped
    command: ["python", "-m", "sidebyside.jobs.runner"]
    environment:
      <<: *runtime-environment
    volumes:
      - deletion_journal_data:/var/lib/sidebyside/deletion-journal
    networks:
      - app
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *web-image
    restart: unless-stopped
    environment:
      SBS_WEB_CSP_CONNECT_ORIGINS: "${SBS_S3_ENDPOINT:?SBS_S3_ENDPOINT fehlt}"
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy

networks:
  app:
    driver: bridge

volumes:
  # Placeholder single-host expression of the shared deletion-journal volume
  # required by docs/m6/CLOUD-MANAGED-TOPOLOGY.md §3.5. The selected managed
  # platform's descriptor must bind this to its ReadWriteMany-equivalent
  # network volume type across every api (and, if applicable, worker) replica,
  # not a per-replica local disk.
  deletion_journal_data:
