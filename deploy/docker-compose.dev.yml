# Development: run only the database in a container and the application locally.
#
# Do not fall back to SQLite. The data model uses PostgreSQL features such as
# JSONB, partial indexes, and FOR UPDATE SKIP LOCKED. Testing a second dialect
# would not verify the production behavior.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sidebyside
      POSTGRES_PASSWORD: sidebyside
      POSTGRES_DB: sidebyside
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
      # Create the test database on first startup. Integration tests deliberately
      # do not use the development database because they remove their schema at
      # the end of a run.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidebyside -d sidebyside"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev:
