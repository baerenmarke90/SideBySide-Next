# Entwicklung: nur die Datenbank im Container, die Anwendung laeuft lokal.
#
# Kein SQLite-Rueckfall. Das Datenmodell nutzt PostgreSQL-Eigenschaften -
# JSONB, Teilindizes, FOR UPDATE SKIP LOCKED -, und ein zweiter Dialekt im
# Test prueft nicht, was in Produktion laeuft.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sidebyside
      POSTGRES_PASSWORD: sidebyside
      POSTGRES_DB: sidebyside
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidebyside -d sidebyside"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev:
