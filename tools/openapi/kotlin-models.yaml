# Kotlin-Datenklassen fuer den Android-Client.
#
# Bewusst nur Modelle. Ein Service-Layer wuerde Retrofit, Ktor oder OkHttp
# als Runtime-Abhaengigkeit festlegen - fuer ein Android-Projekt, das es
# noch nicht gibt. Diese Wahl trifft, wer den Client baut.
#
# Das eigentliche Driftrisiko sind ohnehin die DTOs: ein umbenanntes Feld
# faellt ohne generierte Modelle erst zur Laufzeit auf. Genau das ist hier
# abgedeckt; Service-Interfaces koennen spaeter additiv dazukommen.
serializationLibrary: kotlinx_serialization
library: jvm-retrofit2
enumPropertyNaming: original
sourceFolder: .

# Der Generator-Platzhalter `org.openapitools.client` wuerde als fremder
# Namensraum im Android-Projekt landen. `sidebyside.api` spiegelt die
# Benennung des Backends (`sidebyside`) und beansprucht keine Domain - die
# Application ID des Android-Projekts ist eine eigene, spaetere Entscheidung.
packageName: sidebyside.api
modelPackage: sidebyside.api.models

# Erzeugt fuer oneOf/anyOf mit Discriminator echte Wrapper-/Subtyp-Modelle.
# Diese Generator-Option wird fuer Kotlin mit jvm-retrofit2 und
# kotlinx_serialization unterstuetzt.
generateOneOfAnyOfWrappers: true
