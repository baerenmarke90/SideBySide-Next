# Kotlin data classes for the Android client.
#
# Models only by design. A service layer would select Retrofit, Ktor, or OkHttp
# as a runtime dependency. That decision belongs to the Android client.
#
# DTOs are the actual drift risk: without generated models, a renamed field is
# detected only at runtime. This configuration covers that risk; service
# interfaces can be added later without replacing the models.
serializationLibrary: kotlinx_serialization
library: jvm-retrofit2
enumPropertyNaming: original
sourceFolder: .

# The generator placeholder `org.openapitools.client` would introduce an
# unrelated namespace into the Android project. `sidebyside.api` mirrors the
# backend package name (`sidebyside`) without claiming an application domain;
# the Android application ID is a separate decision.
packageName: sidebyside.api
modelPackage: sidebyside.api.models

# Generate real wrapper/subtype models for discriminated oneOf/anyOf schemas.
# Kotlin supports this generator option with jvm-retrofit2 and
# kotlinx_serialization.
generateOneOfAnyOfWrappers: true

# A free-form object in the contract (`type: object` with `additionalProperties`)
# maps to `Map<String, Any>` by default, and kotlinx.serialization has no
# serializer for `Any` — the Passkey request models therefore did not compile at
# all and had to be excluded from the Android build.
#
# `JsonElement` is the concrete type for "whatever JSON the contract allows
# here", so the models compile and round-trip without a hand-written DTO
# standing in for a generated one. This affects only the two Passkey request
# models; the `kotlin.Any` in the generated enum helpers comes from a template
# literal and is untouched.
typeMappings:
  AnyType: kotlinx.serialization.json.JsonElement
importMappings:
  kotlinx.serialization.json.JsonElement: kotlinx.serialization.json.JsonElement
